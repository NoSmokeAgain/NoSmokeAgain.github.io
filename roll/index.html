<style>

html,body{margin:0;height:100%;background:var(--bg);color:var(--card);font-family:'Noto Sans TC',system-ui,-apple-system,sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}

@keyframes in{from{opacity:0;transform:translate(-50%,-10px) scale(.9)}}

/* Slow Roll — second edition */
:root{--bg:#102e28;--card:#f4ebd8;--accent:#e8bb70;--mute:#a6b9a6;--ok:#a7cc9c}
html,body{font-family:Georgia,'Noto Sans TC',system-ui,sans-serif;background:#091d19}
#stage{max-width:560px;box-shadow:0 0 120px #0008}
#hud{padding: max(20px,env(safe-area-inset-top)) 24px 0}
#hud .k{font-size:11px;letter-spacing:1px;color:#b5c8b7}#hud .k b{font-size:17px;color:#f4ebd8}
#mute{border-radius:50%;background:#ffffff08;border-color:#b9ccad40}
#step{top:100px}#step .n{font-size:10px;letter-spacing:4px;color:#e8bb70}#step h2{font-size:32px;margin:12px 0 8px;color:#f4ebd8}#step p{font-size:13px;color:#b5c8b7}

h1{font-family:Georgia,'Noto Serif TC',serif;font-size:88px!important;letter-spacing:-5px;line-height:1.1;color:#f4ebd8}h1 em{color:#e8bb70}

#win{background:radial-gradient(ellipse at top,#315748f5,#0b211dfa)}#win h1{font-size:52px!important;letter-spacing:0}#tear h1{font-size:40px!important;letter-spacing:0}.shades{font-size:42px}#lick{width:84px;height:84px;font-size:35px;background:#ba7480;border-color:#f4ebd8;bottom:max(68px,env(safe-area-inset-bottom))}
#journey{position:absolute;bottom:max(24px,env(safe-area-inset-bottom));left:24px;right:24px;display:flex;gap:6px;pointer-events:none}#journey i{height:3px;background:#ffffff18;flex:1;transition:background .3s}#journey i.done{background:#e8bb70}#journey i.current{background:#c8d6b6}
#guide{position:absolute;top:70%;transition:top .2s;left:28px;right:28px;text-align:center;pointer-events:none;color:#d4dec9;font:12px system-ui;line-height:1.8;letter-spacing:1px}.pop.msg{background:#f4ebd8;border-radius:5px;font-size:13px}.pop.fast{border-radius:5px;font-size:14px;bottom:100px}#save{font-size:14px}button:focus-visible{outline:3px solid #fff;outline-offset:4px}
#cardv{position:absolute;inset:0;z-index:8;background:#0b211df5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px}#cardv[hidden]{display:none}#cardv img{max-width:100%;max-height:72vh;border-radius:6px;box-shadow:0 20px 50px #000a;-webkit-touch-callout:default;user-select:auto}#cardv p{margin:0;color:#d4dec9;font-size:14px}
@media(max-height:680px){#step{top:76px}#step h2{font-size:26px;margin:6px}h1{font-size:68px!important}.ov{gap:14px}#lick{bottom:48px;width:68px;height:68px}}
</style>

<body>
<div id="wrap"><div id="stage">
  <canvas id="cv" aria-label="手捲遊戲操作桌面"></canvas><div id="journey"><i></i><i></i><i></i><i></i><i></i><i></i></div><div id="guide"></div>
  <div id="hud"><div class="k">⏱ <b id="clock">0:00</b><br>🧻 第 <b id="paper">1</b> 張紙</div><button id="mute" aria-label="聲音開關">🔊</button></div>
  <div id="step"><div class="n" id="sn"></div><h2 id="st"></h2><p id="sd"></p></div>
  <button id="lick" hidden aria-label="舔">👅</button>

  <div class="ov" id="intro">
    <h1>慢慢<em>捲</em></h1>
    <p class="sub">世界已經夠快了。<br>這一根，慢慢來。</p>
    <button class="btn" id="go">開始手作 →</button>
    <p class="hint">吸菸有害健康・本遊戲只捲不抽</p>
  </div>

  <div class="ov" id="tear" hidden>
    <p style="font-size:56px;margin:0">🧻💥</p>
    <h1 id="tearT" style="font-size:36px">紙破了</h1>
    <p class="sub" id="tearD"></p>
    <button class="btn" id="retry">再拿一張</button>
  </div>

  <div class="ov" id="win" hidden>
    <div class="shades">😎</div>
    <h1>捲好了。</h1>
    <div class="cig"><i></i><b></b></div>
    <p class="sub" id="winD"></p>
    <div class="stats"><div><b id="wT">0:00</b><span>花了</span></div><div><b id="wP">1</b><span>張紙</span></div></div>
    <div class="row"><button class="btn" id="again">再捲一根</button><button class="btn ghost" id="copy">複製戰績</button><button class="btn ghost" id="save">下載戰績卡</button></div>
    <p class="toast" id="toast"></p>
    <p class="hint">吸菸有害健康・捲完就好，不一定要抽</p>
  </div>
  <div id="cardv" hidden><img id="cardimg" alt="慢慢捲戰績卡"><p>長按圖片儲存，或截圖分享</p><button class="btn ghost" id="cardx">關閉</button></div>
</div></div>

<script>
'use strict';
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),$=id=>document.getElementById(id);
let W=0,H=0,dpr=1;
function resize(){const r=cv.getBoundingClientRect();dpr=Math.min(2,window.devicePixelRatio||1);W=r.width;H=r.height;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',()=>{resize();if(typeof placeGuide==='function')placeGuide()});

/* ---------- audio ---------- */
let ac=null,master=null,nb=null,muted=false;
try{muted=localStorage.getItem('ru_mute')==='1'}catch(e){}
$('mute').textContent=muted?'🔇':'🔊';
function silentWav(){const n=800,b=new ArrayBuffer(44+n),v=new DataView(b),w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};w(0,'RIFF');v.setUint32(4,36+n,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,8000,true);v.setUint32(28,8000,true);v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,'data');v.setUint32(40,n,true);for(let i=0;i<n;i++)v.setUint8(44+i,128);return URL.createObjectURL(new Blob([b],{type:'audio/wav'}))}
function initAudio(){if(ac){if(ac.state==='suspended')ac.resume();return}
  try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
  try{const a=new Audio(silentWav());a.loop=true;a.play().catch(()=>{})}catch(e){}
  const AudioCtor=window.AudioContext||window.webkitAudioContext;if(!AudioCtor)return;try{ac=new AudioCtor()}catch(e){return;}master=ac.createGain();master.gain.value=muted?0:.9;
  const comp=ac.createDynamicsCompressor();master.connect(comp);comp.connect(ac.destination);
  nb=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  rubSetup()}
function env(g,t,a,p,d){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(p,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+d)}
function osc(type,f,t,d,p,dst,f2){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);env(g,t,.005,p,d);o.connect(g);g.connect(dst||master);o.start(t);o.stop(t+d+.05);return o}
function noise(t,d,p,type,f,q,dst){if(!ac)return;const s=ac.createBufferSource();s.buffer=nb;const fl=ac.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q||1;const g=ac.createGain();env(g,t,.003,p,d);s.connect(fl);fl.connect(g);g.connect(dst||master);s.start(t,Math.random());s.stop(t+d+.05)}
const now=()=>ac?ac.currentTime:0;
const sfx={
  sprinkle(){if(!ac)return;noise(now(),.04,.08,'highpass',3000+Math.random()*3000,1)},
  tear(){const t=now();for(let i=0;i<6;i++)noise(t+i*.035,.06,.5,'bandpass',1500+Math.random()*2500,2)},
  lick(){const t=now();noise(t,.25,.25,'lowpass',700,6);osc('sine',300,t,.2,.08,null,500)},
  knock(){const t=now();osc('sine',180,t,.08,.5,null,90);noise(t,.03,.25,'bandpass',900,2)},
  ding(){const t=now();osc('sine',1320,t,.15,.25);osc('sine',1760,t+.12,.25,.2)},
  ok(){const t=now();[660,880].forEach((f,i)=>osc('triangle',f,t+i*.09,.18,.2))},
  bad(){const t=now();osc('square',200,t,.2,.12,null,110)},
  snap(){const t=now();noise(t,.05,.4,'bandpass',2500,3);osc('sine',900,t,.06,.15)},
  whoosh(){const t=now();noise(t,1.8,.25,'bandpass',500,.7)}
};
/* continuous rubbing sound, volume follows finger speed */
let rubG=null;
function rubSetup(){const s=ac.createBufferSource();s.buffer=nb;s.loop=true;const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=1800;f.Q.value=.8;rubG=ac.createGain();rubG.gain.value=0;s.connect(f);f.connect(rubG);rubG.connect(master);s.start()}
function rub(v){if(rubG)rubG.gain.setTargetAtTime(Math.min(.22,v),ac.currentTime,.05)}

/* ---------- original laid-back West Coast groove (plays on success) ---------- */
let groove=null;
function startGroove(){if(!ac)return;stopGroove();const bus=ac.createGain();bus.gain.value=.75;bus.connect(master);
  const bpm=92,spb=60/bpm,s16=spb/4,swing=s16*.18;let t0=ac.currentTime+.15,bar=0,alive=true;
  const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=380;lp.connect(bus);
  const CH=[[57,60,64,67],[50,54,57,60],[57,60,64,67],[52,55,59,62]];// Am7 D7 Am7 Em7
  const BASS=[[45,0],[45,3],[57,6],[45,8],[48,10],[50,12],[52,14]];
  const LEAD=[[76,0,2],[74,3,1],[72,4,4],[69,10,2],[72,12,4]];
  const mf=m=>440*Math.pow(2,(m-69)/12);
  function rhodes(m,t,d){[1,2].forEach((h,k)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=k?'triangle':'sine';o.frequency.value=mf(m)*h;env(g,t,.01,k?.02:.06,d);const tr=ac.createOscillator(),tg=ac.createGain();tr.frequency.value=5;tg.gain.value=.02;tr.connect(tg);tg.connect(g.gain);o.connect(g);g.connect(bus);o.start(t);tr.start(t);o.stop(t+d+.1);tr.stop(t+d+.1)})}
  function whine(m,t,d,prev){const o=ac.createOscillator(),g=ac.createGain(),v=ac.createOscillator(),vg=ac.createGain();o.type='sine';o.frequency.setValueAtTime(mf(prev||m),t);o.frequency.exponentialRampToValueAtTime(mf(m),t+.09);v.frequency.value=5.5;vg.gain.value=mf(m)*.012;v.connect(vg);vg.connect(o.frequency);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.09,t+.05);g.gain.setValueAtTime(.09,t+d*.8);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(bus);o.start(t);v.start(t);o.stop(t+d+.05);v.stop(t+d+.05)}
  function schedBar(t,b){const ch=CH[b%4];
    for(let i=0;i<16;i++){const tt=t+i*s16+(i%2?swing:0);
      noise(tt,.03,i%4===2?.09:.05,'highpass',8000,1,bus);
      if(i===0||i===7||i===10)osc('sine',120,tt,.22,.9,bus,42);
      if(i===4||i===12){noise(tt,.16,.45,'bandpass',1800,.8,bus);noise(tt+.008,.1,.3,'highpass',3000,1,bus)}}
    ch.forEach(m=>rhodes(m,t,spb*3.6));
    BASS.forEach(([m,s])=>{const tt=t+s*s16+(s%2?swing:0),o=ac.createOscillator(),g=ac.createGain();o.type='sawtooth';o.frequency.setValueAtTime(mf(m+(b%4===1?5:b%4===3?7:0)-12),tt);env(g,tt,.01,.5,s16*1.8);o.connect(g);g.connect(lp);o.start(tt);o.stop(tt+s16*2)});
    if(b%2===1){let prev=null;LEAD.forEach(([m,s,l])=>{whine(m,t+s*s16,l*s16,prev);prev=m})}}
  function tick(){if(!alive)return;while(t0<ac.currentTime+.6){schedBar(t0,bar);bar++;t0+=spb*4}groove.timer=setTimeout(tick,200)}
  groove={bus,stop(){alive=false;clearTimeout(groove&&groove.timer);bus.gain.setTargetAtTime(0,ac.currentTime,.2);setTimeout(()=>{try{bus.disconnect()}catch(e){}},1500)}};tick()}
function stopGroove(){if(groove){groove.stop();groove=null}}

/* ---------- game state ---------- */
const N=16;
let S=null,fibers=[],parts=[];
function genFibers(){fibers=[];for(let i=0;i<N;i++){const a=[];for(let k=0;k<26;k++)a.push({x:Math.random(),y:Math.random(),r:Math.random()*Math.PI,l:4+Math.random()*7,c:['#7a4a22','#94602e','#5e3818','#a8743a'][k%4]});fibers.push(a)}}
function newRun(){S={t0:performance.now(),papers:1,running:true};newPaper()}
function newPaper(){ptr=null;Object.assign(S,{step:1,dens:new Array(N).fill(0),filter:{x:0,y:0,placed:false,drag:false},prog:0,spill:0,lick:null,taps:0,lastTap:-9,ev:null,nextEv:performance.now()+5000+Math.random()*4000,down:false,vy:0,travel:0,turns:0,lastDir:0});genFibers();parts=[];setStep()}
const STEPS={
  1:['STEP 1 / 6','撒菸草','手指按住，沿著紙慢慢移動。把淡色區域慢慢鋪滿'],
  2:['STEP 2 / 6','放濾嘴','把濾嘴拖到紙的左邊'],
  3:['STEP 3 / 6','搓','在紙上來回左右搓，讓菸草均勻成形'],
  4:['STEP 4 / 6','捲','在紙上按住，慢慢往上推；放手會鬆開'],
  5:['STEP 5 / 6','舔膠邊','按住舌頭，在綠色區間放開'],

  const desc=S.papers===1&&sec<120?'一張紙、一次到位。手很穩，心更穩。':S.papers===1?'一張紙就捲好，慢，但沒失手。':S.papers<=3?`破了 ${S.papers-1} 張，還是捲出來了。`:S.papers<=7?`用掉 ${S.papers} 張紙。耐心是練出來的。`:`${S.papers} 張紙的代價。這根菸很貴。`;
  S.result={ms,papers:S.papers,title:S.papers===1?'手作職人':S.papers<=3?'沉得住氣':S.papers<=7?'越挫越捲':'紙張消耗大師'};$('winD').textContent=S.result.title+'｜'+desc;$('wT').textContent=fmt(ms);$('wP').textContent=S.papers;$('toast').textContent='';
  const url=/^https?:$/.test(location.protocol)?'\n'+location.href.split('#')[0]:'';
  shareText=`【慢慢捲・${S.result.title}】\n我花了 ${fmt(ms)}、用掉 ${S.papers} 張紙，才捲好一根菸😎\n你有這個耐心嗎？${url}`;
  setTimeout(()=>{$('win').hidden=false;startGroove()},500)}
function copy(t){const ok=()=>$('toast').textContent='複製好了';
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(ok,()=>fb());else fb();
  function fb(){const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,t.length);try{document.execCommand('copy');ok()}catch(e){$('toast').textContent='長按自己複製吧'}ta.remove()}}

$('go').onclick=()=>{initAudio();$('intro').hidden=true;newRun()};
$('again').onclick=()=>{stopGroove();$('win').hidden=true;newRun()};
$('copy').onclick=()=>copy(shareText);
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊';try{localStorage.setItem('ru_mute',muted?'1':'0')}catch(e){}if(master)master.gain.setTargetAtTime(muted?0:.9,ac.currentTime,.02)};
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{if(document.hidden){hiddenAt=performance.now();ptr=null;if(S){S.down=false;S.vy=0;if(S.lick)S.lick.holding=false;}rub(0);if(ac)ac.suspend();}else{if(S&&S.running&&hiddenAt){const delta=performance.now()-hiddenAt;S.t0+=delta;S.nextEv+=delta;if(S.ev)S.ev.end+=delta;}hiddenAt=0;if(ac)ac.resume();}});
function makeCard(){const c=document.createElement('canvas');c.width=1080;c.height=1350;const a=c.getContext('2d'),serif="'Noto Serif TC',Georgia,serif",sans="'Noto Sans TC',system-ui,sans-serif";
  const g=a.createRadialGradient(540,420,40,540,675,980);g.addColorStop(0,'#2c5145');g.addColorStop(1,'#0b211d');a.fillStyle=g;a.fillRect(0,0,1080,1350);
  a.strokeStyle='#e8bb70';a.lineWidth=2;a.strokeRect(45,45,990,1260);a.textAlign='center';
  a.fillStyle='#e8bb70';a.font='24px monospace';a.fillText('S L O W   R O L L  /  VOL. 02',540,140);
  a.fillStyle='#f4ebd8';a.font=`900 150px ${serif}`;a.fillText('慢慢捲',540,370);
  a.fillStyle='#e8bb70';a.font=`900 52px ${sans}`;a.fillText(S.result.title,540,480);
  a.save();a.translate(540,610);a.rotate(-.04);a.shadowColor='#0008';a.shadowBlur=30;a.shadowOffsetY=12;
  const cg=a.createLinearGradient(0,-26,0,26);cg.addColorStop(0,'#fffdf7');cg.addColorStop(.55,'#efe8da');cg.addColorStop(1,'#c9bfaa');a.fillStyle=cg;a.beginPath();a.roundRect(-330,-26,660,52,26);a.fill();a.shadowColor='transparent';
  a.fillStyle='#fbfaf4';a.beginPath();a.roundRect(-330,-26,130,52,[26,0,0,26]);a.fill();a.strokeStyle='#ddd5c4';a.lineWidth=2;for(let x=-312;x<-205;x+=14){a.beginPath();a.moveTo(x,-20);a.lineTo(x,20);a.stroke()}a.restore();
  a.fillStyle='#f4ebd8';a.font='700 120px monospace';a.fillText(fmt(S.result.ms),540,850);
  a.font=`500 38px ${sans}`;a.fillStyle='#d4dec9';a.fillText(`用掉 ${S.result.papers} 張紙，終於捲好了。`,540,930);
  a.fillStyle='#e8bb70';a.font=`900 44px ${sans}`;a.fillText('你有這個耐心嗎？',540,1080);
  a.fillStyle='#b4c7b3';a.font='26px monospace';a.fillText(location.host?location.host+location.pathname.replace(/index\.html$/,''):'nosmokeagain.github.io/2026roll',540,1150);
  a.font=`22px ${sans}`;a.fillText('吸菸有害健康・本遊戲只捲不抽',540,1245);return c}
$('save').onclick=async()=>{if(!S||!S.result)return;try{await document.fonts.ready}catch(e){}const c=makeCard();
  c.toBlob(async b=>{if(!b)return;const file=new File([b],'slow-roll.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],text:shareText});$('toast').textContent='已分享';return}catch(e){if(e&&e.name==='AbortError')return}}
    $('cardimg').src=c.toDataURL('image/png');$('cardv').hidden=false},'image/png')};
$('cardx').onclick=()=>$('cardv').hidden=true;
resize();requestAnimationFrame(loop);
