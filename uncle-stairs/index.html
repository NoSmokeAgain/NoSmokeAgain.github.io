<style>

:root{--sign:#e8e1ca;--ink:#1c2a24;--paper:#fbf7e8;--red:#b5281c;--mute:#5a6157;--hi:#f0c340;--green:#4d8a6c;--shaft:#22252b;--ok:#62d26f;--sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;--pixel:"Pixelify Sans","Courier New",monospace;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}

.screen[hidden]{display:none!important}
.tape{flex:none;width:100%;height:34px;background-color:var(--green);background-image:linear-gradient(#2f5e49 2px,transparent 2px),linear-gradient(90deg,#2f5e49 2px,transparent 2px);background-size:17px 17px;border-bottom:4px solid var(--ink)}
/* 告示版面 */
.sign{background:var(--sign);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet{width:100%;max-width:440px;margin-inline:auto;display:flex;flex-direction:column;gap:16px;flex:1 0 auto;padding-block:calc(18px + env(safe-area-inset-top,0px)) calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.notice{font-weight:700;font-size:15px;margin:0}
h1{font:900 clamp(50px,17vw,76px)/1.05 var(--sans);margin:0;white-space:nowrap}
.hero{flex:none;width:100%;display:flex;justify-content:center;padding-top:calc(16px + env(safe-area-inset-top,0px));background:linear-gradient(var(--sign) 58%,var(--green) 58%);border-bottom:4px solid var(--ink)}
#face{display:block;width:min(66vw,36vh,280px);height:auto;aspect-ratio:1;image-rendering:pixelated}
.lead{font-size:17px;font-weight:700;line-height:1.6;margin:0}
.btn{border:0;border-radius:6px;background:var(--ink);color:var(--sign);font-weight:900;font-size:21px;padding:15px 20px;width:100%}

<script>
const $=s=>document.querySelector(s);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- 音效 ---------- */
const Snd=(()=>{let c=null,on=store.get('dgSound')!=='off',timer=0,next=0,pos=0,playing=false;
 /* 原創循環：每格一個十六分音符，0 為休止 */
 const LEAD=[69,0,72,0,76,0,74,72,69,0,67,0,69,0,0,0, 65,0,69,0,72,0,71,69,67,0,64,0,67,0,0,0, 69,0,72,0,76,0,79,76,74,0,72,0,74,76,0,0, 72,0,71,0,69,0,67,0,64,0,67,0,69,0,0,0];
 const BASS=[45,45,57,45,45,45,57,45,41,41,53,41,41,41,53,41,43,43,55,43,43,43,55,43,45,45,57,45,40,40,52,40];
 const note=(m,t,d,type,g)=>{const o=c.createOscillator(),a=c.createGain();o.type=type;o.frequency.value=440*Math.pow(2,(m-69)/12);a.gain.setValueAtTime(g,t);a.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(a).connect(c.destination);o.start(t);o.stop(t+d)};
 const sched=()=>{if(!c)return;while(next<c.currentTime+.25){const l=LEAD[pos%64];if(l)note(l,next,.16,'square',.018);if(pos%2===0)note(BASS[(pos/2)%32],next,.18,'triangle',.05);if(noise&&pos%4===2){const n=c.createBufferSource(),a=c.createGain();n.buffer=noise;a.gain.setValueAtTime(.022,next);a.gain.exponentialRampToValueAtTime(.0001,next+.05);n.connect(a).connect(c.destination);n.start(next);n.stop(next+.05)}next+=.105;pos++}};
 let noise=null;const halt=()=>{clearInterval(timer);timer=0};
 const play=()=>{if(!c||!on||timer)return;if(!noise){noise=c.createBuffer(1,4410,44100);const d=noise.getChannelData(0);let v=0;for(let i=0;i<d.length;i++){if(i%6===0)v=Math.random()*2-1;d[i]=v}}if(c.state==='suspended')c.resume();next=c.currentTime+.06;timer=setInterval(sched,70);sched()};
 const init=()=>{if(c)return;const A=window.AudioContext||window.webkitAudioContext;if(A)try{c=new A()}catch(e){}};
 const tone=(f,d,type='square',g=.05,to=0)=>{if(!c||!on)return;if(c.state==='suspended')c.resume();const t=c.currentTime,o=c.createOscillator(),a=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);a.gain.setValueAtTime(g,t);a.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(a).connect(c.destination);o.start(t);o.stop(t+d)};
 return{init,isOn:()=>on,toggle(){on=!on;store.set('dgSound',on?'on':'off');if(on&&playing)play();else halt();return on},
  musicOn(){playing=true;play()},musicOff(){playing=false;halt()},
  land(){tone(150,.05,'square',.035)},spring(){tone(240,.16,'square',.05,720)},hurt(){tone(170,.22,'sawtooth',.08,55)},crack(){tone(420,.1,'triangle',.06,90)},
  zone(){tone(392,.1);setTimeout(()=>tone(523,.16),100)},
  /* 大叔的慘叫：合成人聲母音「啊——」，破音拉高後一路往下掉，尾音收成「嗚」 */
  die(){if(!c||!on)return;if(c.state==='suspended')c.resume();const t=c.currentTime,end=t+1.3,out=c.createGain();out.gain.setValueAtTime(.0001,t);out.gain.exponentialRampToValueAtTime(.3,t+.04);out.gain.setValueAtTime(.3,t+.75);out.gain.exponentialRampToValueAtTime(.0001,end);
   const shape=c.createWaveShaper(),cv=new Float32Array(257);for(let i=0;i<257;i++){const x=i/128-1;cv[i]=Math.tanh(x*2.4)}shape.curve=cv;shape.connect(out);out.connect(c.destination);
   [[850,5,1,430],[1300,6,.7,780],[2700,8,.25,2300]].forEach(([f,q,a,to])=>{const b=c.createBiquadFilter(),m=c.createGain();b.type='bandpass';b.Q.value=q;b.frequency.setValueAtTime(f,t);b.frequency.setValueAtTime(f,t+.7);b.frequency.exponentialRampToValueAtTime(to,end);m.gain.value=a*2.2;b.connect(m).connect(shape);[['sawtooth',0,1],['square',-14,.25]].forEach(([ty,de,lv])=>{const o=c.createOscillator(),l=c.createGain();o.type=ty;o.detune.value=de;l.gain.value=lv;o.frequency.setValueAtTime(230,t);o.frequency.exponentialRampToValueAtTime(370,t+.13);o.frequency.setValueAtTime(350,t+.5);o.frequency.exponentialRampToValueAtTime(82,end);const v=c.createOscillator(),vg=c.createGain();v.frequency.value=8.5;vg.gain.setValueAtTime(5,t);vg.gain.linearRampToValueAtTime(28,t+.6);v.connect(vg).connect(o.frequency);o.connect(l).connect(b);o.start(t);v.start(t);o.stop(end);v.stop(end)})})},
  thud(){tone(120,.28,'sine',.28,38)}}})();

/* ---------- 美術 ---------- */
const PAL={u:'#2f6fd0',k:'#2a2620',s:'#e0a878',w:'#f4f1e6',r:'#d92b1f',b:'#6b7a4a',n:'#70431f',e:'#17140c'};
const SPR={"stand":["...ssssss...","..kssssssk..","..kssssssk..","..se.ss.es..","..ssssssss..","..skkkkkks..","...ssssss...","..wwwwwwww..",".swwwwwwwws.",".swwwwwwwws.",".s.wwwwww.s.","...bbbbbb...","...bbbbbb...","...ss..ss...","...ss..ss...","..uuu..uuu.."],"walk1":["...ssssss...","..kssssssk..","..kssssssk..","..se.ss.es..","..ssssssss..","..skkkkkks..","...ssssss...","..wwwwwwww..",".swwwwwwwws.",".swwwwwwwws.",".s.wwwwww.s.","...bbbbbb...","..bbbbbbb...","..ss...ss...",".ss....ss...",".uuu....uuu."],"walk2":["...ssssss...","..kssssssk..","..kssssssk..","..se.ss.es..","..ssssssss..","..skkkkkks..","...ssssss...","..wwwwwwww..",".swwwwwwwws.",".swwwwwwwws.",".s.wwwwww.s.","...bbbbbb...","...bbbbbbb..","...ss...ss..","...ss....ss.",".uuu....uuu."],"fall":["s..ssssss..s","s.kssssssk.s","s.kssssssk.s","s.se.ss.es.s","s.ssssssss.s","s.skkkkkks.s","w..s.oo.s..w","wwwwwwwwwwww",".wwwwwwwwww.","..wwwwwwww..","..wwwwwwww..","...bbbbbb...","...bbbbbb...","..ss....ss..",".ss......ss.",".uu......uu."],"hurt":["...ssssss...","..kssssssk..","..kssssssk..","..sx.ss.xs..","..ssssssss..","..skkkkkks..","...s.oo.s...","..wwwwwwww..",".swwwwwwwws.",".swwwwwwwws.",".s.wwwwww.s.","...bbbbbb...","...bbbbbb...","...ss..ss...","...ss..ss...","..uuu..uuu.."]};
PAL.o='#7a2a22';PAL.x='#d92b1f';
const sprC={};for(const n in SPR){const m=document.createElement('canvas');m.width=12;m.height=16;const g=m.getContext('2d');SPR[n].forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch!=='.'){g.fillStyle=PAL[ch];g.fillRect(x,y,1,1)}}));sprC[n]=m}

function drawPlat(g,type,x,y,w,t,dir){
 x=Math.round(x);y=Math.round(y);
 if(type==='normal'){g.fillStyle='#c4bfae';g.fillRect(x,y,w,8);g.fillStyle='#e3dece';g.fillRect(x,y,w,2);g.fillStyle='#6e6a5e';g.fillRect(x,y+7,w,1);const c=['#7d7768','#a0553f','#3f5c52','#efe9d8'];for(let i=2,k=0;i<w-2;i+=4,k++){g.fillStyle=c[k%4];g.fillRect(x+i,y+3+(k*3)%4,1,1)}}
 else if(type==='spike'){g.fillStyle='#2f3634';g.fillRect(x,y-1,w,3);g.fillRect(x,y+5,w,3);for(let i=0;i<w;i+=8){g.fillStyle='#2f3634';g.fillRect(x+i+3,y-5,2,12);g.fillStyle='#d9dcd8';g.beginPath();g.moveTo(x+i+1,y-4);g.lineTo(x+i+4,y-10);g.lineTo(x+i+7,y-4);g.fill();g.fillStyle='#c5301f';g.fillRect(x+i+3,y-10,2,3)}}
 else if(type==='belt'){g.fillStyle='#8c9198';g.fillRect(x,y,w,8);const off=Math.floor(((t*42*dir)%6+6)%6);g.save();g.beginPath();g.rect(x+3,y,w-6,8);g.clip();g.fillStyle='#5c6168';for(let i=-6;i<w+6;i+=6)g.fillRect(x+i+off,y,2,8);g.restore();g.fillStyle='#f0c340';g.fillRect(x+w/2-5,y+3,10,2);g.fillRect(x+w/2+(dir>0?5:-7),y+2,2,4);g.fillStyle='#3b3f45';g.fillRect(x,y,3,8);g.fillRect(x+w-3,y,3,8)}
 else if(type==='spring'){g.fillStyle='#e9a7b6';g.fillRect(x,y,w,4);g.fillStyle='#f8d6dc';for(let i=2;i<w-2;i+=6)g.fillRect(x+i,y+1,2,2);g.fillStyle='#b4687c';g.fillRect(x,y+3,w,1);g.fillStyle='#b9c1c9';for(let i=2;i<w-3;i+=6){g.fillRect(x+i,y+4,4,1);g.fillRect(x+i+1,y+6,4,1)}g.fillStyle='#4a4f57';g.fillRect(x,y+7,w,1)}
 else if(type==='flip'){g.fillStyle='#b98a4f';g.fillRect(x,y,w,8);g.fillStyle='#d3a86b';g.fillRect(x,y,w,1);g.fillStyle='#ddc98f';g.fillRect(x,y+3,w,2);g.fillStyle='#6d4c26';for(let i=11;i<w-3;i+=17){g.fillRect(x+i,y,1,8)}g.fillRect(x,y+7,w,1)}
}

/* ---------- 遊戲本體 ---------- */

const cv=$('#cv'),g=cv.getContext('2d');

/* 每秒加快 0.9，約 2 分半到頂；移動和墜落一起加快才接得到 */
const speedAt=t=>Math.min(40+t*.9,170);
const rand=(a,b)=>a+Math.random()*(b-a);

function fit(fresh){const st=$('#stage'),aw=st.clientWidth,ah=st.clientHeight-(parseFloat(getComputedStyle(st).paddingBottom)||0);if(!aw||!ah)return;
 if(fresh)H=Math.max(290,Math.min(390,Math.round(W*ah/aw)));
 const k=Math.min(aw/W,ah/H);cv.width=W;cv.height=H;cv.style.width=Math.floor(W*k)+'px';cv.style.height=Math.floor(H*k)+'px';g.imageSmoothingEnabled=false}

function pickType(f){if(f<4)return'normal';const r=Math.random(),sp=Math.min(.3,.13+f*.001),fl=Math.min(.16,.07+f*.0006);
 if(r<sp)return'spike';if(r<sp+fl)return'flip';if(r<sp+fl+.16)return'belt';if(r<sp+fl+.26)return'spring';return'normal'}
function spawn(y,forced){const f=S.floor+Math.round(H/SP),w=Math.max(42,58-f*.05);let type=forced||pickType(f);
 /* 連續兩塊都危險時，強制給一塊能踩的 */
 const bad=type==='spike'||type==='flip';if(bad&&S.danger>=1)type='normal';S.danger=(type==='spike'||type==='flip')?S.danger+1:0;
 let x=rand(WALL,W-WALL-w);if(type!=='spike'&&type!=='flip'){const dx=x+w/2-S.safeX;if(Math.abs(dx)>85)x=Math.max(WALL,Math.min(W-WALL-w,S.safeX+Math.sign(dx)*85-w/2));S.safeX=x+w/2}
 S.plats.push({x,y,w,type,dir:Math.random()<.5?-1:1,used:false,timer:0,gone:0})}

function newGame(){S={plats:[],floor:1,scroll:0,hp:MAXHP,x:W/2-PW/2,y:0,vy:0,on:null,inv:0,noLand:0,t:0,danger:0,safeX:W/2,face:1,flash:0,shake:0,zone:ZONES[0],prevZone:null,fade:0,dead:false,deadT:0,walk:0,input:0,hurtT:0};
 fit(true);const y0=Math.round(H*.45);S.plats.push({x:W/2-32,y:y0,w:64,type:'normal',dir:1,used:true,timer:0,gone:0});S.y=y0-PH;S.on=S.plats[0];
 for(let y=y0+SP;y<H+SP*2;y+=SP)spawn(y);
 hudFloor=-1;hudHp=-1;updateHud();showZone('B1 樓梯間')}

let hudFloor=-1,hudHp=-1,zoneTimer=0;
function updateHud(){if(S.floor!==hudFloor){hudFloor=S.floor;$('#fl').textContent='B'+S.floor}
 if(S.hp!==hudHp){hudHp=S.hp;[...lifeEl.children].forEach((e,i)=>e.classList.toggle('on',i<S.hp));lifeEl.classList.toggle('low',S.hp<=4);lifeEl.setAttribute('aria-label','血量 '+S.hp+' 格')}}
function showZone(t){const z=$('#zone');z.textContent=t;z.classList.add('on');clearTimeout(zoneTimer);zoneTimer=setTimeout(()=>z.classList.remove('on'),1400)}
function damage(n){S.hp=Math.max(0,S.hp-n);S.flash=.25;S.hurtT=.4;if(!calm)S.shake=.25;Snd.hurt();if(S.hp===0)kill()}
function kill(){if(S.dead)return;S.dead=true;S.on=null;S.vy=-170;Snd.musicOff();Snd.die()}

function step(dt){S.t+=dt;S.flash=Math.max(0,S.flash-dt);S.shake=Math.max(0,S.shake-dt);S.inv=Math.max(0,S.inv-dt);S.noLand=Math.max(0,S.noLand-dt);S.hurtT=Math.max(0,S.hurtT-dt);S.fade=Math.max(0,S.fade-dt);
 if(S.dead){S.deadT+=dt;S.vy+=620*dt;S.y+=S.vy*dt;if(S.y>H+30&&S.deadT>1.35){Snd.thud();gameOver()}return}
 const v=speedAt(S.t),d=v*dt,boost=v-40;S.scroll+=d;const nf=1+Math.floor(S.scroll/SP);
 if(nf!==S.floor){S.floor=nf;const z=zoneAt(nf);if(z!==S.zone){S.prevZone=S.zone;S.zone=z;S.fade=1.5;showZone('抵達 '+z.name);Snd.zone()}}
 for(const p of S.plats){p.y0=p.y;p.y-=d;if(p.gone)p.gone+=dt}
 S.plats=S.plats.filter(p=>p.y>-14&&p.gone<.5);
 let last=S.plats.length?S.plats[S.plats.length-1].y:H;while(last<H+SP*2){last+=SP;spawn(last)}
 let vx=S.input*(108+boost*.25);if(S.input){S.face=S.input;S.walk+=dt}
 if(S.on){const p=S.on;if(p.type==='belt')vx+=p.dir*42;
  if(p.type==='flip'){p.timer+=dt;if(p.timer>.42&&!p.gone){p.gone=.001;Snd.crack();S.on=null;S.vy=0}}
  if(S.on){S.y=p.y-PH;if(S.x+PW-1<=p.x||S.x+1>=p.x+p.w){S.on=null;S.vy=-v*.1}}}
 S.x=Math.max(WALL,Math.min(W-WALL-PW,S.x+vx*dt));
 if(!S.on){const b0=S.y+PH;S.vy=Math.min(S.vy+(640+boost*2)*dt,280+boost*.6);S.y+=S.vy*dt;const b1=S.y+PH;
  if(!S.noLand)for(const p of S.plats){if(p.gone)continue;if(b0<=p.y0+1&&b1>=p.y&&S.x+PW-1>p.x&&S.x+1<p.x+p.w){land(p);break}}}
 if(S.y<CEIL&&!S.dead){S.y=CEIL;if(!S.inv){S.inv=.8;damage(5)}S.on=null;S.noLand=.3;S.vy=Math.max(S.vy,50)}
 if(S.y>H+8&&!S.dead){S.hp=0;kill();S.vy=0}
 updateHud()}
function land(p){S.y=p.y-PH;S.vy=0;const fresh=!p.used;p.used=true;
 if(p.type==='spike'){if(fresh)damage(5);if(S.dead)return;S.on=p;return}
 if(fresh&&S.hp<MAXHP)S.hp++;
 if(p.type==='spring'){S.vy=-232;S.on=null;p.bounce=.15;Snd.spring();return}
 S.on=p;Snd.land()}

function drawBg(z,alpha,off){g.globalAlpha=alpha;g.fillStyle=z.base;g.fillRect(0,0,W,H);for(let y=-(off%120);y<H;y+=120)for(let x=0;x<W;x+=120)g.drawImage(z.tile,x,Math.round(y));g.globalAlpha=1}
function render(){const off=S.scroll*.55;g.save();if(S.shake>0)g.translate(Math.round(rand(-2,2)),Math.round(rand(-2,2)));
 drawBg(S.zone,1,off);if(S.fade>0&&S.prevZone)drawBg(S.prevZone,S.fade/1.5,off);
 g.fillStyle='rgba(10,10,14,.4)';g.fillRect(0,0,W,H);
 for(const p of S.plats){if(p.y>H+10)continue;let px=p.x,py=p.y;if(p.type==='flip'&&p===S.on)px+=Math.round(Math.sin(S.t*60));
  if(p.gone){g.globalAlpha=Math.max(0,1-p.gone*2);py+=p.gone*70}
  if(p.bounce>0){p.bounce-=1/60;py+=2}
  drawPlat(g,p.type,px,py,p.w,S.t,p.dir);g.globalAlpha=1}
 /* 牆與天花板 */
 const wo=Math.round(S.scroll)%16;for(const wx of[0,W-WALL]){g.fillStyle='#0f1014';g.fillRect(wx,0,WALL,H);g.fillStyle='#4d8a6c';for(let y=-wo-16;y<H;y+=4)for(let k=0;k<2;k++){if((Math.floor((y+wo)/4)+k)%3)g.fillRect(wx+k*4,y,3,3)}}
 g.fillStyle='#0f1014';g.fillRect(0,0,W,3);for(let x=WALL;x<W-WALL;x+=8){g.fillStyle='#d6d8dc';g.beginPath();g.moveTo(x,3);g.lineTo(x+4,CEIL+1);g.lineTo(x+8,3);g.fill();g.fillStyle='#d92b1f';g.fillRect(x+3,CEIL-2,2,3)}
 /* 主角 */
 let spr='stand';if(S.hurtT>0||S.dead)spr='hurt';else if(!S.on)spr='fall';else if(S.input)spr=Math.floor(S.walk*10)%2?'walk1':'walk2';
 if(!(S.inv>0&&Math.floor(S.t*24)%2)){const sx=Math.round(S.x)-1,sy=Math.round(S.y);if(S.face<0){g.save();g.translate(sx+12,sy);g.scale(-1,1);g.drawImage(sprC[spr],0,0);g.restore()}else g.drawImage(sprC[spr],sx,sy)}
 g.restore();if(S.flash>0){g.fillStyle=`rgba(217,43,31,${S.flash*1.2})`;g.fillRect(0,0,W,H)}}

let lastT=0,acc=0,raf=0;
function loop(t){raf=requestAnimationFrame(loop);if(mode!=='play')return;const dt=Math.min(.05,(t-lastT)/1000||0);lastT=t;acc+=dt;while(acc>=1/120&&mode==='play'){step(1/120);acc-=1/120}if(S&&mode==='play')render()}

/* 輸入 */
const keys={l:false,r:false},ptr=new Map();
function syncInput(){let d=0;for(const v of ptr.values())d=v;if(!d)d=(keys.r?1:0)-(keys.l?1:0);if(S)S.input=d;$('#pL').classList.toggle('on',d<0);$('#pR').classList.toggle('on',d>0)}
const stage=$('#stage');
stage.addEventListener('pointerdown',e=>{if(mode!=='play')return;Snd.init();const r=stage.getBoundingClientRect();ptr.set(e.pointerId,e.clientX<r.left+r.width/2?-1:1);try{stage.setPointerCapture(e.pointerId)}catch(_){}syncInput();e.preventDefault()});
stage.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId))return;const r=stage.getBoundingClientRect();ptr.delete(e.pointerId);ptr.set(e.pointerId,e.clientX<r.left+r.width/2?-1:1);syncInput()});
for(const n of['pointerup','pointercancel','lostpointercapture'])stage.addEventListener(n,e=>{ptr.delete(e.pointerId);syncInput()});
stage.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{if(mode!=='play')return;const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')keys.l=true;else if(k==='arrowright'||k==='d')keys.r=true;else if(k==='escape'||k==='p'){pause();return}else return;e.preventDefault();syncInput()});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')keys.l=false;else if(k==='arrowright'||k==='d')keys.r=false;syncInput()});

 if(!ol.children.length)ol.append(lbSay('讀取中…'));
 try{const[top,near]=await Promise.all([lbCall('lb_top',{...p,p_limit:10}),lbCall('lb_context',p).catch(()=>[])]);ol.replaceChildren();

  if(rest.length){if(rest[0].rank>last+1)ol.append(lbSay('⋯'));rest.forEach(r=>ol.append(lbRow(r)))}

$('#lbForm').addEventListener('submit',async e=>{e.preventDefault();const name=$('#lbName').value.trim(),msg=$('#lbMsg'),gap=$('#lbGap'),btn=$('#lbSend');if(!name){msg.textContent='先取個暱稱。';return}if(!run)return;btn.disabled=true;msg.textContent='送出中…';gap.textContent='';
 try{const res=await lbCall('lb_submit',{p_game:LB.game,p_player:lbPlayer(),p_nickname:name,p_score:run.floor,p_details:null});
  if(res!=='ok'){btn.disabled=false;msg.textContent={bad_name:'這個暱稱不能用，換一個。',too_fast:'送太快了，等 30 秒再按一次。',too_busy:'現在人太多，等一下再試。',bad_score:'這次的成績無法上榜。',bad_game:'這個榜還沒開放。'}[res]||'送出失敗，再試一次。';return}
  store.set('hd_nick',name);btn.textContent='已上榜';
  const p={p_game:LB.game,p_period:'week',p_player:lbPlayer()},[[w],near]=await Promise.all([lbCall('lb_my_rank',p),lbCall('lb_context',p).catch(()=>[])]);
  if(w&&w.my_rank){const title=lbTitle(w.my_rank,w.total),pct=w.total>=20?`，贏過 ${w.beat_pct}% 的人`:'';msg.textContent=`${title?title+'！':''}本週第 ${w.my_rank} 名${pct}${w.my_score>run.floor?`（你本週最深 B${w.my_score}）`:''}。`;
   const above=near.find(r=>r.rank===w.my_rank-1);gap.textContent=above?`再下 ${above.score-w.my_score+1} 層就超過第 ${above.rank} 名：${above.nickname}`:(w.my_rank===1?'目前沒有人比你深。':'');run.rankLine=`本週第 ${w.my_rank} 名`}else msg.textContent='已上榜。';
  lbPeriod.overList='week';document.querySelectorAll('[data-for=overList] button').forEach(x=>x.setAttribute('aria-selected',x.dataset.p==='week'));lbLoad('overList');lbLoad('homeList')
 }catch(err){btn.disabled=false;msg.textContent='連線失敗，再試一次。'}});

/* 分享 */
function shareCard(){const c=document.createElement('canvas');c.width=1080;c.height=1350;const x=c.getContext('2d');x.fillStyle='#e8e1ca';x.fillRect(0,0,1080,1350);
 x.fillStyle='#4d8a6c';x.fillRect(0,0,1080,60);x.fillRect(0,1290,1080,60);x.fillStyle='#2f5e49';for(let i=0;i<1080;i+=30){x.fillRect(i,0,3,60);x.fillRect(i,1290,3,60)}x.fillRect(0,30,1080,3);x.fillStyle='#1c2a24';
 x.font='900 54px "Noto Sans TC",sans-serif';x.fillText('老公寓沒電梯，大叔走到',80,230);x.font='700 '+(run.floor>999?300:380)+'px "Pixelify Sans",monospace';x.fillText('B'+run.floor,70,640);
 x.font='900 58px "Noto Sans TC",sans-serif';x.fillText(run.zone,80,780);x.font='700 42px "Noto Sans TC",sans-serif';x.fillText(verdict(run.floor),80,860);if(run.rankLine)x.fillText(run.rankLine,80,930);
 x.font='900 86px "Noto Sans TC",sans-serif';x.fillText('大叔下樓梯',80,1180);x.font='700 40px "Noto Sans TC",sans-serif';x.fillText('happydog.tw/uncle-stairs',80,1250);return c}
$('#shareBtn').onclick=async()=>{if(!run)return;const m=$('#shareMsg'),url=location.origin+location.pathname,text=`老公寓沒電梯，大叔被我帶到 B${run.floor}。你能帶他到幾樓？`;m.textContent='';
 try{const blob=await new Promise(r=>shareCard().toBlob(r,'image/png')),file=new File([blob],`B${run.floor}.png`,{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],text:text+' '+url});return}
  if(navigator.share){await navigator.share({text,url});return}
  await navigator.clipboard.writeText(text+' '+url);m.textContent='已複製分享文字。'
 }catch(e){if(e&&e.name==='AbortError')return;m.textContent=text+' '+url}};

paintBest();lbLoad('homeList');requestAnimationFrame(loop);
</script>
</body></html>
