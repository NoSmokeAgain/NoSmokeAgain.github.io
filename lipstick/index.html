 function init(){unlock();if(c){if(c.state!='running')c.resume().catch(()=>{});return}const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;c=new AC();const comp=c.createDynamicsCompressor();comp.connect(c.destination);master=c.createGain();master.gain.value=on?1:0;master.connect(comp);fx=c.createGain();fx.gain.value=.85;fx.connect(master);mus=c.createGain();mus.gain.value=.3;mus.connect(master);nb=c.createBuffer(1,c.sampleRate,c.sampleRate);const a=nb.getChannelData(0);let x=4242;for(let i=0;i<a.length;i++){x=(x*1103515245+12345)&0x7fffffff;a[i]=x/0x3fffffff-1}next=c.currentTime+.1;if(on)music(true)}
