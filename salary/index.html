<style>
/* Layout: a bank passbook. Top = balance + day stamp + mood/health gauges; middle = today's event card (swipe or tap A/B);
   bottom = passbook ledger printing each day's line. Paper/ink/stamp-red palette, works in light and dark. */
:root{
  --bg:#e9e5da; --paper:#fbf8f0; --ink:#1f2a2e; --mute:#6f756f; --rule:#d6d0bf; --stamp:#c8372d; --plus:#1f7a4d; --minus:#b3261e; --mood:#e8a317; --hp:#2f8f6b; --cover:#14453d;
  --f:"Noto Sans TC",system-ui,sans-serif; --serif:"Noto Serif TC",serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121513;--paper:#1c201d;--ink:#ece8dc;--mute:#9aa197;--rule:#333a34;--stamp:#ff6a5e;--plus:#5fd39a;--minus:#ff7b70;--mood:#f2bd4a;--hp:#5fc79f;--cover:#0d2f29;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121513;--paper:#1c201d;--ink:#ece8dc;--mute:#9aa197;--rule:#333a34;--stamp:#ff6a5e;--plus:#5fd39a;--minus:#ff7b70;--mood:#f2bd4a;--hp:#5fc79f;--cover:#0d2f29;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);-webkit-tap-highlight-color:transparent}
.wrap{max-width:460px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px;display:grid;gap:14px}
.wrap>*{min-width:0}
.book{background:var(--cover);color:#f3ecd6;border-radius:14px;padding:16px 18px;display:grid;gap:10px;box-shadow:0 12px 30px -18px #000a}
.bk-top{display:flex;justify-content:space-between;align-items:center;font:700 12px var(--mono);letter-spacing:.14em;opacity:.8}
.bal{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.bal b{font:700 38px/1 var(--mono);font-variant-numeric:tabular-nums}
.bal b.neg{color:#ff8a80}
.day{font:900 15px var(--serif);border:2px solid #f3ecd6aa;border-radius:8px;padding:6px 10px;text-align:center;line-height:1.2;transform:rotate(-4deg)}
.day small{display:block;font:500 10px var(--f);opacity:.8}
.gauges{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g{display:grid;gap:4px;font:700 12px var(--f)}
.g .t{height:8px;border-radius:4px;background:#ffffff26;overflow:hidden}
.g .t i{display:block;height:100%;border-radius:4px;transition:width .4s}
.g.m .t i{background:#f2bd4a}.g.h .t i{background:#7fe0b4}
.card{background:var(--paper);border-radius:16px;padding:20px 18px;display:grid;gap:14px;box-shadow:0 1px 0 var(--rule),0 16px 30px -22px #0008;touch-action:pan-y;position:relative;transition:transform .25s;will-change:transform}
.card.in{animation:in .4s cubic-bezier(.2,1.3,.5,1)}
@keyframes in{from{transform:translateY(30px) rotate(3deg);opacity:0}}
.card .emo{font-size:46px;line-height:1}
.card h2{font:900 22px/1.4 var(--f);margin:0;text-wrap:balance}
.card p{margin:0;color:var(--mute);font-size:14px;line-height:1.6}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;text-align:left;border:1.5px solid var(--ink);border-radius:12px;padding:12px 14px;background:transparent;color:var(--ink);cursor:pointer;font:700 15px var(--f);touch-action:manipulation}
.opt .k{font:700 13px var(--mono);color:var(--stamp);grid-row:span 2;align-self:center}
.opt .fx{font:500 12px var(--mono);color:var(--mute)}
.opt:active{transform:scale(.98)}
.opt:focus-visible{outline:3px solid var(--stamp);outline-offset:2px}
@media (hover:hover){.opt:hover{background:var(--bg)}}
.swipe-hint{font-size:12px;color:var(--mute);text-align:center;margin:0}
.instbar{font:700 12px var(--f);background:#ffffff1f;border-radius:8px;padding:6px 10px}
.quip{position:fixed;left:50%;top:30%;transform:translateX(-50%);background:var(--ink);color:var(--paper);font:900 15px var(--f);padding:8px 14px;border-radius:999px;z-index:31;pointer-events:none;white-space:nowrap;animation:qp 1.5s forwards}
@keyframes qp{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}12%{opacity:1;transform:translate(-50%,0) scale(1.05)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-10px)}}
.ledger{background:var(--paper);border-radius:12px;padding:12px 14px;display:grid;gap:0;max-height:240px;overflow:auto}
.ledger h3{font:700 12px var(--mono);letter-spacing:.14em;color:var(--mute);margin:0 0 6px}
.ln{display:grid;grid-template-columns:44px 1fr auto;gap:8px;padding:6px 0;border-bottom:1px dashed var(--rule);font-size:13px;align-items:baseline}
.ln:first-of-type{animation:print .35s ease-out}
@keyframes print{from{background:var(--bg);opacity:0;transform:translateY(-6px)}}
.ln .d{font:500 12px var(--mono);color:var(--mute)}
.ln .a{font:700 13px var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.ln .a.p{color:var(--plus)}.ln .a.n{color:var(--minus)}
.float{position:fixed;left:50%;top:22%;transform:translateX(-50%);font:700 30px var(--mono);pointer-events:none;z-index:30;animation:fl 1s forwards;text-shadow:0 2px 0 #0003}
.float.p{color:var(--plus)}.float.n{color:var(--minus)}
@keyframes fl{0%{opacity:0;transform:translate(-50%,10px) scale(.7)}20%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-50px)}}
/* setup + end */
.hero h1{font:900 40px/1.15 var(--serif);margin:0}
.hero h1 em{font-style:normal;color:var(--stamp)}
.hero p{margin:6px 0 0;color:var(--mute);font-size:15px;line-height:1.7}
.sal{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.sal button{border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:12px;padding:14px 10px;cursor:pointer;display:grid;gap:2px;text-align:left}
.sal button b{font:700 20px var(--mono)}
.sal button span{font-size:12px;color:var(--mute)}
.sal button:focus-visible{outline:3px solid var(--stamp);outline-offset:2px}
.btn{border:0;border-radius:12px;padding:15px;background:var(--stamp);color:#fff;font:900 17px var(--f);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.end{background:var(--paper);border-radius:16px;padding:22px 18px;display:grid;gap:12px;text-align:center}
.stampbig{justify-self:center;font:900 26px var(--serif);color:var(--stamp);border:4px double var(--stamp);border-radius:10px;padding:8px 16px;transform:rotate(-6deg);animation:stamp .4s cubic-bezier(.2,1.6,.5,1)}
@keyframes stamp{from{transform:rotate(-20deg) scale(2.4);opacity:0}}
.end .big{font:700 40px var(--mono)}
.end p{margin:0;color:var(--mute);font-size:14px;line-height:1.7}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rcard{width:100%;max-width:100%;border-radius:14px;box-shadow:0 14px 30px -18px #000a;animation:in .5s cubic-bezier(.2,1.3,.5,1)}
.lbl{margin:0;font:700 12px var(--f);color:var(--mute);letter-spacing:.1em}
.who{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sal.hid{grid-template-columns:repeat(3,1fr)}
.sal.hid button.lock{border-style:dashed;opacity:.85}
.sal.hid button.lock b{filter:blur(1px)}
.sal.hid button.gold{background:linear-gradient(135deg,#f6d77a,#c9962c);color:#2b1d00;border-color:#8a6414}
.sal.hid button.gold span{color:#3b2a06}
.qov{position:fixed;inset:0;z-index:50;background:#000b;display:flex;align-items:center;justify-content:center;padding:16px}
.qbox{background:var(--paper);color:var(--ink);border-radius:16px;padding:20px;max-width:400px;width:100%;display:grid;gap:12px;animation:in .35s cubic-bezier(.2,1.3,.5,1)}
.qbox h2{font:900 20px/1.45 var(--f);margin:0}
.qbox.shake{animation:shk .4s}
@keyframes shk{20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(3px)}}
.opt.right{background:#1f7a4d;color:#fff;border-color:#1f7a4d}.opt.wrong{opacity:.4;text-decoration:line-through}
.qmsg{margin:0;font-size:14px;line-height:1.6;min-height:1.2em}
.gold-c{position:fixed;top:-40px;font-size:28px;z-index:60;pointer-events:none;font-style:normal;animation:gfall 2s linear forwards}
@keyframes gfall{to{transform:translateY(110vh) rotate(360deg)}}
.who button{border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:12px;padding:12px 6px;font:700 14px var(--f);cursor:pointer}
.who button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.who button:focus-visible{outline:3px solid var(--stamp);outline-offset:2px}
.year{border:2px dashed var(--rule);border-radius:12px;padding:12px;display:grid;gap:4px}
.year span{font:700 12px var(--f);letter-spacing:.12em;color:var(--mute)}
.year p{font:700 17px var(--f)!important;color:var(--ink)!important}
.year p b{font:700 22px var(--mono);color:var(--stamp)}
.year small{font:500 12px var(--mono);color:var(--mute)}
.year em{font-style:normal;font-weight:700;font-size:14px}
.sal button span+span{font:500 11px var(--mono)}
.toast{min-height:1.2em;font:700 12px var(--f);color:var(--plus);margin:0}
.fixed{font:500 12px var(--mono);color:var(--mute);line-height:1.8;margin:0}
.mute{justify-self:end;border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;padding:0}
.mute svg{width:16px;height:16px}
@media (prefers-reduced-motion:reduce){.card.in,.ln,.float,.stampbig{animation:none}}
</style>
</head>

  if(site&&navigator.share){$('again').onclick=again;$('sh').onclick=async()=>{try{const b=await (await fetch(img.src)).blob(),f=new File([b],'薪水撐到月底.png',{type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],text:share});else await navigator.share({text:share,url:site})}catch(e){}}}
  else $('sh').onclick=again;
  $('cp').onclick=()=>{try{navigator.clipboard.writeText(share).then(()=>$('toast').textContent='已複製，配上圖片去 Threads 討拍',()=>$('toast').textContent='瀏覽器不讓複製，請長按圖片存起來')}catch(e){$('toast').textContent='瀏覽器不讓複製，請長按圖片存起來'}};

function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function drawCard(o){const W=1080,H=1350,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');

  x.fillStyle=red;x.font=`900 ${o.head.length>5?50:58}px ${SF}`;x.textAlign='center';x.textBaseline='middle';x.fillText(o.head,0,4);x.restore();x.textAlign='left';x.textBaseline='alphabetic';
  x.fillStyle=mute;x.font=`500 30px ${F}`;x.fillText('月底剩下',90,300);

function wrapT(c,t,x,y,mw,lh){let line='';for(const ch of t){const tt=line+ch;if(c.measureText(tt).width>mw&&line){c.fillText(line,x,y);line=ch;y+=lh}else line=tt}c.fillText(line,x,y)}
