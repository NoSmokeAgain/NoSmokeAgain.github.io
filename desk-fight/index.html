<style>
/* Layout: arcade screen on top, a beige computer keyboard as the control deck below. Single fixed look. */
:root{
  --ink:#16130f; --screen:#23201c; --plastic:#d8d0bb; --plastic-d:#b4ab93; --cap:#efe9d9; --cap-d:#a89f88;
  --marquee:#ffd23f; --hot:#d3127a; --blue:#1d4fc4; --txt:#f6f1e3;
  --display:'Noto Sans TC','PingFang TC',sans-serif; --num:'Bungee','Arial Black',sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--screen);color:var(--txt)}
body{font-family:var(--display);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
#app{height:100%;display:flex;flex-direction:column;position:relative;align-items:center}
#stage{position:relative;flex:none;overflow:hidden;background:#777}
canvas{display:block;width:100%;height:100%}
#overlay{position:absolute;inset:0;z-index:5;overflow-y:auto;touch-action:pan-y;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:10px;text-align:center;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:rgba(22,19,15,.74)}
#moves{margin:0;width:min(100%,430px);display:grid;gap:5px;text-align:left;font-size:14px}
#moves div{display:flex;gap:10px}#moves dt{flex:0 0 118px;font-weight:900;color:var(--marquee)}#moves dd{margin:0;min-width:0}
#lbBox,#shareBox{width:min(100%,380px);display:grid;gap:8px;flex:none}
#lbForm{display:flex;gap:8px}#lbName{flex:1;min-width:0;font:inherit;font-size:16px;padding:8px 10px;border:0;border-radius:5px;background:var(--cap);color:var(--ink);-webkit-user-select:text;user-select:text}
#lbSend{font-weight:900;padding:8px 16px;border:0;border-radius:5px;background:var(--marquee);color:var(--ink);cursor:pointer}
.tabs{display:flex;gap:4px}.tabs button{flex:1;font-size:13px;padding:5px;border:1px solid var(--plastic-d);background:none;color:var(--txt);border-radius:4px;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--cap);color:var(--ink);font-weight:900}
#lbList{margin:0;padding:0;list-style:none;font-size:14px;display:grid;gap:2px;font-variant-numeric:tabular-nums}
#lbList li{display:flex;gap:8px;padding:3px 8px;background:rgba(255,255,255,.08);border-radius:3px}#lbList li span:nth-child(2){flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#lbList li.me{background:var(--marquee);color:var(--ink);font-weight:900}#lbList li.note{justify-content:center;background:none}
.msg{font-size:13px!important;min-height:0}.msg:empty{display:none}
#shareImg{width:100%;max-width:260px;justify-self:center;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
#overlay h1{margin:0;font-size:clamp(34px,10.5vmin,64px);font-weight:900;line-height:1.05;color:var(--marquee);text-shadow:3px 3px 0 var(--hot),6px 6px 0 var(--ink);transform:skewX(-8deg);text-wrap:balance}
#overlay p{margin:0;font-size:15px;line-height:1.5;max-width:30em;font-weight:500}
#stats{font-family:var(--num);font-size:15px;line-height:1.6;font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button{font:inherit;touch-action:manipulation}
.cta{font-weight:900;font-size:18px;padding:10px 24px;color:var(--ink);background:var(--marquee);border:0;border-bottom:5px solid #a9811a;border-radius:6px;cursor:pointer}
.cta.alt{background:var(--cap);border-bottom-color:var(--cap-d)}
.cta:active{transform:translateY(3px);border-bottom-width:2px}
.cta:focus-visible,.key:focus-visible,#mute:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
#panel{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--plastic);border-top:3px solid var(--plastic-d)}
#panel.overlay{position:absolute;left:0;right:0;bottom:0;flex:none;background:none;border:0;opacity:.72;pointer-events:none}
#panel.overlay>*{pointer-events:auto}
#panel.none{display:none}
#joy{width:136px;height:136px;flex:none;border-radius:50%;background:var(--plastic-d);box-shadow:inset 0 3px 8px rgba(0,0,0,.35);position:relative;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:var(--ink);box-shadow:0 4px 0 #000,inset 0 3px 0 #4a443b}
#keys{display:grid;grid-template-columns:repeat(2,72px);gap:10px;flex:none}
.key{height:62px;border:0;border-radius:8px;background:var(--cap);color:var(--ink);box-shadow:0 6px 0 var(--cap-d),0 7px 3px rgba(0,0,0,.35);font-weight:900;font-size:24px;position:relative;padding:0;touch-action:none;cursor:pointer}
.key small{position:absolute;left:7px;top:4px;font:400 10px var(--num);color:#6b6452}
.key.on{transform:translateY(5px);box-shadow:0 1px 0 var(--cap-d)}
.key.sp{background:var(--hot);color:var(--txt);box-shadow:0 6px 0 #870a4d}
.key.sp small{color:var(--txt)}
#mute{position:absolute;left:50%;top:6px;transform:translateX(-50%);background:none;border:1px solid #6b6452;color:var(--ink);border-radius:4px;font-size:12px;font-weight:500;padding:2px 8px;cursor:pointer;touch-action:manipulation}
#panel.overlay #mute{color:var(--txt);border-color:var(--txt);top:-4px}
#legend{flex:none;height:34px;display:flex;align-items:center;gap:16px;font-size:13px;font-weight:500;color:#cfc8b4}
#legend b{font-family:var(--num);font-weight:400;color:var(--marquee);margin-right:3px}
#legend button{background:none;border:1px solid #6b6452;color:inherit;border-radius:4px;font-size:12px;padding:2px 8px;cursor:pointer}
@media (max-width:700px){#legend{display:none!important}}
@media (max-width:370px){#joy{width:116px;height:116px}#keys{grid-template-columns:repeat(2,62px)}}
@media (prefers-reduced-motion:reduce){.key,.cta{transition:none}}
</style>

<body>


<div id="app">
  <div id="stage">
    <canvas id="c"></canvas>
  </div>
  <div id="panel">
    <div id="joy" aria-label="移動搖桿"><div id="knob"></div></div>
    <button id="mute">音效開</button>
    <div id="keys">
      <button class="key sp" data-k="sp"><small>I</small>必</button>
      <button class="key" data-k="jump"><small>L</small>跳</button>
      <button class="key" data-k="p"><small>J</small>拳</button>
      <button class="key" data-k="k"><small>K</small>腳</button>
    </div>
  </div>
  <div id="legend">
    <span><b>方向鍵</b>移動</span><span><b>J</b>拳，連按三段</span><span><b>K</b>腳，破防</span><span><b>↑K</b>上挑</span><span><b>↓K</b>踩</span><span><b>→→</b>衝刺</span><span><b>L</b>跳</span><span><b>I</b>必殺，扣血</span>
    <button id="mute2">音效開</button>
  </div>
  <div id="overlay">
    <h1 id="ovT">桌上過關斬將</h1>
    <p id="ovP">火柴人站上你的電腦桌。打過桌面和鍵盤，再跳進螢幕裡找老大。</p>
    <div id="stats" hidden></div>
    <div class="row">
      <button class="cta" id="btnA">開始</button>
      <button class="cta alt" id="btnB" hidden>再來</button>
      <button class="cta alt" id="btnM">招式表</button>
    </div>
    <dl id="moves" hidden>
      <div><dt>拳 拳 拳</dt><dd>三段連擊，最後一下踢飛</dd></div>
      <div><dt>腳</dt><dd>重踢，可以破防</dd></div>
      <div><dt>上＋腳</dt><dd>上挑，把人打上天</dd></div>
      <div><dt>下＋腳</dt><dd>踩踏倒地的敵人</dd></div>
      <div><dt>跳＋拳／腳</dt><dd>空中連打／飛踢，打中會彈起再追</dd></div>
      <div><dt>方向連點兩下</dt><dd>衝刺，接拳撞人、接腳滑鏟</dd></div>
      <div><dt>貼著敵人往前推</dt><dd>抓住。拳是膝撞，腳是摔出去砸別人</dd></div>
      <div><dt>必</dt><dd>無敵旋風腳，扣 7 血</dd></div>
    </dl>
    <section id="lbBox" hidden aria-label="排行榜">
      <form id="lbForm" hidden><input id="lbName" maxlength="8" placeholder="暱稱，最多 8 字" autocomplete="nickname" aria-label="暱稱"><button id="lbSend" type="submit">上榜</button></form>
      <p class="msg" id="lbMsg" role="status"></p>
      <div class="tabs" id="tabBoard"><button type="button" data-v="score" aria-selected="true">最高分</button><button type="button" data-v="time" aria-selected="false">最快通關</button></div>
      <div class="tabs" id="tabPeriod"><button type="button" data-v="week" aria-selected="true">本週</button><button type="button" data-v="all" aria-selected="false">總榜</button></div>
      <ol id="lbList"></ol>
    </section>
    <p class="msg" id="lbOff" hidden>全站排行榜在 happydog.tw 版開放。</p>
    <div id="shareBox" hidden>
      <button class="cta alt" id="shareBtn" type="button">分享成績</button>
      <p class="msg" id="shareMsg"></p>
      <img id="shareImg" alt="成績圖" hidden>
    </div>
  </div>
</div>

<script>
'use strict';
const H=360, GT=238, ZMAX=96;
let W=640, scale=1;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const FN="Bungee,'Arial Black',sans-serif", FC="'Noto Sans TC','PingFang TC',sans-serif";
const rnd=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), rad=d=>d*Math.PI/180;
const pick=a=>a[Math.floor(Math.random()*a.length)];
let best=0; try{best=+localStorage.getItem('deskfight.best')||0}catch(e){}

/* ---------- layout ---------- */
const coarse=matchMedia('(pointer:coarse)').matches;
function resize(){
  const app=$('app'),cw=app.clientWidth,ch=app.clientHeight,st=$('stage'),pn=$('panel'),lg=$('legend');
  let w,h; const wide=cw/ch>1.35;
  lg.style.display=coarse?'none':'flex';
  if(!coarse){pn.className='none'; h=ch-34; w=Math.min(cw,h*2); h=Math.min(h,w/1.2);}
  else if(wide){pn.className='overlay'; h=ch; w=Math.min(cw,h*2.2);}
  else{pn.className=''; w=cw; h=Math.min(w/1.2,ch-180);}
  st.style.width=w+'px'; st.style.height=h+'px';
  W=clamp(H*w/h,400,800); scale=h/H;
  const dpr=Math.min(devicePixelRatio||1,2);
  cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr); scale=cv.height/H; W=cv.width/scale;
}
addEventListener('resize',resize); resize();

/* ---------- audio ---------- */
let ac=null,muted=false,noiseBuf=null;
function audioOn(){ try{ if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();
  noiseBuf=ac.createBuffer(1,ac.sampleRate*.4,ac.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  if(ac.state==='suspended')ac.resume(); }catch(e){} }
function nz(dur,f,g,type='lowpass'){ if(!ac||muted)return; const s=ac.createBufferSource(),fl=ac.createBiquadFilter(),a=ac.createGain();
  s.buffer=noiseBuf; fl.type=type; fl.frequency.value=f; a.gain.setValueAtTime(g,ac.currentTime); a.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);
  s.connect(fl);fl.connect(a);a.connect(ac.destination); s.start(); s.stop(ac.currentTime+dur); }
function tone(f0,f1,dur,g,type='square',delay=0){ if(!ac||muted)return; const o=ac.createOscillator(),a=ac.createGain(),t=ac.currentTime+delay;
  o.type=type; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(Math.max(f1,20),t+dur);
  a.gain.setValueAtTime(g,t); a.gain.exponentialRampToValueAtTime(.001,t+dur); o.connect(a);a.connect(ac.destination); o.start(t); o.stop(t+dur); }
const sfx={
  whoosh(){nz(.09,1800,.08,'bandpass')},
  hit(){const k=1+Math.min(G.combo,20)*.03;nz(.025,5200,.3,'highpass');nz(.08,1500,.38);tone(190*k,70,.09,.28,'square')},
  heavy(){nz(.02,6000,.3,'highpass');nz(.2,800,.6);tone(130,34,.24,.5,'sawtooth');tone(70,30,.3,.4,'sine')},
  knee(){nz(.1,600,.5);tone(110,50,.12,.45,'square')},
  dash(){nz(.16,900,.14,'bandpass')},
  block(){tone(1500,900,.06,.16,'square');nz(.04,5000,.12,'highpass')},
  ko(){tone(420,50,.4,.25,'sawtooth');nz(.3,600,.3)},
  pick(){tone(660,660,.07,.14);tone(990,990,.1,.14,'square',.07)},
  coin(){tone(988,988,.07,.16);tone(1319,1319,.25,.16,'square',.07)},
  slam(){nz(.35,300,.8);tone(90,28,.35,.6,'sawtooth')},
  click(){tone(2200,1800,.03,.2);tone(1400,1200,.03,.2,'square',.05)},
  hurt(){tone(240,110,.14,.2,'sawtooth');nz(.08,1200,.28)},
  fanfare(){[523,659,784,1047].forEach((f,i)=>tone(f,f,.16,.15,'square',i*.11))},
  lose(){[392,330,262,196].forEach((f,i)=>tone(f,f,.2,.15,'square',i*.16))}
};
const SONGS=[
 {bpm:132,b:[45,45,57,45,45,45,57,48,43,43,55,43,41,41,53,40],l:[69,0,72,0,76,0,74,72,69,0,0,67,69,0,0,0,65,0,69,0,72,0,71,69,64,0,67,0,71,0,0,0]},
 {bpm:150,b:[38,38,50,38,41,41,53,41,36,36,48,36,43,43,45,47],l:[74,0,74,77,0,74,72,0,69,0,72,0,74,0,0,0,77,0,76,74,0,72,74,0,79,0,77,0,74,0,72,0]},
 {bpm:118,b:[40,0,40,52,40,0,43,0,36,0,36,48,38,0,39,0],l:[76,0,0,79,0,0,83,0,81,0,79,0,76,0,0,0,72,0,0,76,0,0,79,0,78,0,75,0,71,0,0,0]},
 {bpm:172,b:[40,40,52,40,41,41,53,41,40,40,52,40,46,46,47,47],l:[76,76,0,79,76,0,82,81,0,76,0,79,0,74,76,0,88,0,86,0,84,0,83,0,82,0,83,0,84,0,86,0]}
];
const mus={on:false,song:null,step:0,next:0};
const hz=m=>440*Math.pow(2,(m-69)/12);
function musicPlay(i){mus.on=true;mus.song=SONGS[i];mus.step=0;mus.next=ac?ac.currentTime+.1:0}
function musicOff(){mus.on=false}
function musicTick(){ if(!mus.on||!ac||muted||document.hidden)return; const S=mus.song,d=60/S.bpm/2;
  if(mus.next<ac.currentTime)mus.next=ac.currentTime+.03;
  while(mus.next<ac.currentTime+.14){const i=mus.step,dl=mus.next-ac.currentTime,b=S.b[i%S.b.length],l=S.l[i%S.l.length];
    if(b)tone(hz(b),hz(b),d*.8,.05,'triangle',dl); if(l)tone(hz(l),hz(l),d*.75,.022,'square',dl);
    if(i%4===0)tone(120,45,.08,.07,'sine',dl);
    mus.step++;mus.next+=d;}
}
function setMute(){muted=!muted; $('mute').textContent=$('mute2').textContent=muted?'音效關':'音效開';}
$('mute').onclick=setMute; $('mute2').onclick=setMute;

/* ---------- poses: lean, armF, foreF, armB, foreB, thighF, shinF, thighB, shinB (deg, 0 = down, + = forward) ---------- */
const P={
  stance:[8,55,135,25,125,28,2,-22,-40], jab:[16,92,92,-15,110,35,5,-28,-48], cross:[22,-25,95,94,94,38,8,-32,-55],
  wind:[-6,-30,60,-40,40,20,-5,-15,-30], kick:[-14,-20,40,30,90,98,98,-6,-8], side:[-28,-40,20,35,90,105,112,-14,-16],
  fly:[-12,40,110,-50,-10,88,90,40,-70], jump:[4,130,170,-60,-20,70,-20,20,-60], fall:[2,100,140,-100,-70,30,-10,-10,-40],
  hurt:[-24,-60,-30,-30,-10,18,0,-14,-20], air:[-16,-120,-150,120,160,40,10,-30,-60], lie:[0,-20,-10,10,10,8,2,-6,-2],
  block:[4,70,165,55,160,22,4,-22,-40], crouch:[30,40,90,10,60,65,-25,-30,-70], whirl:[0,88,92,-88,-92,88,92,-12,-14],
  thrw:[10,160,130,-20,60,30,5,-25,-45], slam:[36,70,40,60,30,70,-25,-35,-65], up:[-6,150,170,-30,40,30,2,-20,-30],
  win:[0,150,175,150,175,8,0,-8,0],slide:[-38,-60,-30,-30,40,85,88,10,-70],upper:[-14,150,178,-20,70,30,0,-30,-40],airp:[14,92,92,-50,30,50,-20,10,-70],stomp:[6,30,80,-30,40,50,0,-8,-12],grab:[14,80,80,70,80,30,5,-25,-45],knee:[18,70,50,60,50,95,-20,-12,-20],sit:[6,60,92,30,88,86,4,84,2], idle2:[6,58,128,28,118,26,4,-20,-36]
};

/* ---------- moves ---------- */
const M={
  p1:{pose:'jab',wind:3,act:4,rec:8,dmg:5,r:42,kx:1,stun:16,next:'p2',tip:'hF',step:1.2},
  p2:{pose:'cross',wind:3,act:4,rec:9,dmg:6,r:44,kx:1.2,stun:18,next:'p3',tip:'hB',step:1.2},
  p3:{pose:'kick',wind:5,act:5,rec:14,dmg:10,r:54,kx:4.5,ky:5,launch:1,shake:4,stop:5,tip:'fF',step:2.4,sfx:'heavy'},
  k:{pose:'side',wind:7,act:5,rec:13,dmg:12,r:58,kx:5.5,ky:3.6,launch:1,brk:1,shake:4,stop:5,tip:'fF',step:3,sfx:'heavy'},
  fly:{pose:'fly',air:1,wind:2,act:60,rec:0,dmg:11,r:44,kx:4,ky:4.5,launch:1,shake:3,stop:4,tip:'fF',brk:1,sfx:'heavy'},
  whirl:{pose:'whirl',wind:4,act:30,rec:10,dmg:9,r:60,all:1,kx:5,ky:6,launch:1,shake:5,stop:3,inv:1,brk:1,sfx:'heavy',cost:7},
  dp:{pose:'cross',wind:1,act:12,rec:14,keep:5,dmg:10,r:46,kx:5,ky:5,launch:1,shake:4,stop:5,tip:'hB',brk:1,sfx:'heavy'},
  slide:{pose:'slide',wind:1,act:20,rec:14,keep:5,dmg:8,r:54,kx:2,ky:7,launch:1,tip:'fF',sfx:'heavy',low:1},

function tickCommon(e){

    case 'hurt': if(e.t>=e.stun){e.st='idle';e.t=0} break;

    case 'land': if(e.t>=6){e.st='idle';e.t=0} break;

  if(e.target&&e.target.tagName==='INPUT')return;
  if(e.code==='Enter'&&!$('overlay').hidden){audioOn();actA&&actA();return}
  const k=KMAP[e.code];if(!k)return;e.preventDefault();if(!held[k]&&'pkjumpsp'.includes(k)&&k.length!==1||k==='p'||k==='k'){if(!held[k])inp.edge[k]=1}held[k]=1;});
addEventListener('keyup',e=>{const k=KMAP[e.code];if(k)held[k]=0});
let jv={x:0,y:0,id:null};
const joy=$('joy'),knob=$('knob');
function joyMove(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,R=r.width/2-14;let dx=e.clientX-cx,dy=e.clientY-cy;const d=Math.hypot(dx,dy);if(d>R){dx*=R/d;dy*=R/d}
  knob.style.transform='translate('+dx+'px,'+dy+'px)';jv.x=dx/R;jv.y=dy/R;}
joy.addEventListener('pointerdown',e=>{e.preventDefault();audioOn();jv.id=e.pointerId;try{joy.setPointerCapture(e.pointerId)}catch(_){ }joyMove(e)});
joy.addEventListener('pointermove',e=>{if(e.pointerId===jv.id)joyMove(e)});
const joyEnd=e=>{if(e.pointerId===jv.id){jv={x:0,y:0,id:null};knob.style.transform=''}};
joy.addEventListener('pointerup',joyEnd);joy.addEventListener('pointercancel',joyEnd);
document.querySelectorAll('.key').forEach(b=>{const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();audioOn();inp.edge[k]=1;b.classList.add('on')});
  for(const ev of['pointerup','pointercancel','pointerleave'])b.addEventListener(ev,()=>b.classList.remove('on'));
  b.addEventListener('contextmenu',e=>e.preventDefault());});
addEventListener('contextmenu',e=>e.preventDefault());
function readInput(){
  let mx=(held.R?1:0)-(held.L?1:0),mz=(held.D?1:0)-(held.U?1:0);
  if(!mx&&!mz){mx=Math.abs(jv.x)>.2?jv.x:0;mz=Math.abs(jv.y)>.28?jv.y:0}
  else{const d=Math.hypot(mx,mz);if(d>1){mx/=d;mz/=d}}
  inp.mx=mx;inp.mz=mz;
  const dn=mx>.6?1:mx<-.6?-1:0;
  if(dn&&dn!==inp.lastDir){ if(dn===inp.tapDir&&G.frames-inp.tapF<16)inp.dash=dn; inp.tapDir=dn;inp.tapF=G.frames; }
  inp.lastDir=dn;
}

/* ---------- main loop ---------- */
startStage(0);G.mode='title';G.demo=true;G.banner=0;G.fade=0;
let last=performance.now(),acc=0;
const DT=1000/60;
function frame(now){
  acc+=Math.min(now-last,100);last=now;
  while(acc>=DT){readInput();const titleDone=G.demo&&G.mode==='clear';step();inp.edge={};animate();acc-=DT;
    if(G.demo&&titleDone&&G.clearT>90){startStage((G.stage+1)%3);G.mode='title'}}
  musicTick();render();requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
