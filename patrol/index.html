<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>抓壞人 1987</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* Layout: one-screen retro arcade cabinet. HUD strip on top, a low-res pixel canvas (180×320, integer-scaled, CRT scanlines) in the middle,
   and a single big siren button bottom-right; steer by dragging anywhere on the road. Committed single dark arcade look. */
:root{
  --bg:#07060c; --cab:#141022; --ink:#f4efe0; --mute:#8d86a3; --red:#ff3b3b; --blue:#3b8bff; --amber:#ffc23b; --green:#4bd88a;
  --f-pix:"Press Start 2P",ui-monospace,monospace; --f-tc:"Noto Sans TC",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-tc);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
.cab{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;background:var(--cab);box-sizing:border-box;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-block:10px;gap:8px}
.hud{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font:400 10px/1.4 var(--f-pix)}
.hud .lbl{color:var(--mute);font-size:8px;display:block;margin-bottom:3px}
.hud b{font-weight:400;font-variant-numeric:tabular-nums}
.quota{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
.quota i{width:12px;height:12px;border:2px solid var(--mute);box-sizing:border-box}
.quota i.on{background:var(--amber);border-color:var(--amber)}
.right{text-align:right}
.demer{color:var(--red);letter-spacing:2px}
.fuel{grid-column:1/-1;height:8px;background:#000;border:2px solid #2a2340;position:relative}
.fuel i{position:absolute;left:0;top:0;bottom:0;background:var(--green);transition:width .2s}
.fuel.low i{background:var(--red);animation:blink .4s steps(1) infinite}
@keyframes blink{50%{opacity:.3}}
.screen{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;background:#000;border:3px solid #2a2340;border-radius:6px;overflow:hidden}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
.crt{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,#0000 0 2px,#0000002e 2px 3px);box-shadow:inset 0 0 60px #000c}
.flash{position:absolute;inset:0;pointer-events:none;opacity:0}
.flash.r{animation:fl .35s}
@keyframes fl{0%{opacity:.55;background:var(--red)}100%{opacity:0;background:var(--red)}}
.pop{position:absolute;pointer-events:none;font:900 15px var(--f-tc);color:#fff;text-shadow:2px 2px 0 #000,-1px -1px 0 #000;white-space:nowrap;transform:translate(-50%,-100%);animation:up 1.2s forwards}
.pop.big{font:400 13px var(--f-pix);color:var(--amber)}
.pop.bad{color:var(--red)}
@keyframes up{0%{opacity:0;transform:translate(-50%,-80%) scale(.6)}12%{opacity:1;transform:translate(-50%,-100%) scale(1.1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-180%)}}
.ctrl{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.hint{font:500 12px var(--f-tc);color:var(--mute);line-height:1.5}
.siren{width:96px;height:96px;border-radius:50%;border:4px solid #000;background:radial-gradient(circle at 35% 30%,#ff8080,var(--red) 55%,#8a0000);
  color:#fff;font:900 18px var(--f-tc);box-shadow:0 6px 0 #4a0000,0 0 0 4px #2a2340;cursor:pointer;touch-action:none}
.siren:active,.siren.on{transform:translateY(4px);box-shadow:0 2px 0 #4a0000,0 0 0 4px #2a2340,0 0 30px var(--red)}
.siren:focus-visible{outline:3px solid var(--amber);outline-offset:4px}
.siren small{display:block;font:400 7px var(--f-pix);margin-top:4px;opacity:.85}
.mute{position:absolute;right:8px;top:8px;z-index:5;width:34px;height:34px;border-radius:4px;border:2px solid #2a2340;background:#000a;color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.mute svg{width:16px;height:16px}
.ov{position:absolute;inset:0;z-index:8;background:#07060ce8;display:flex;align-items:center;justify-content:center;padding:18px;text-align:center;overflow:auto}
.ov[hidden]{display:none}
.panel{display:grid;gap:14px;max-width:340px;width:100%}
.ttl{font:400 22px/1.5 var(--f-pix);color:var(--amber);text-shadow:3px 3px 0 var(--red);margin:0}
.ttl small{display:block;font:900 26px var(--f-tc);color:var(--ink);text-shadow:3px 3px 0 #000;letter-spacing:.1em;margin-top:6px}
.blink{font:400 11px var(--f-pix);color:var(--ink);animation:blink 1s steps(1) infinite}
.txt{font:500 14px/1.7 var(--f-tc);color:#d6d0e6;margin:0}
.txt b{color:var(--amber)}
.list{display:grid;gap:6px;text-align:left;font:500 13px var(--f-tc);color:#d6d0e6}
.list span{display:inline-block;min-width:54px;font-weight:900}
.btn{font:400 12px var(--f-pix);background:var(--amber);color:#000;border:0;padding:14px;cursor:pointer;box-shadow:0 5px 0 #8a5a00;touch-action:manipulation}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #8a5a00}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
.btn.ghost{background:#2a2340;color:var(--ink);box-shadow:0 5px 0 #000}
.big{font:400 28px var(--f-pix);color:var(--amber)}
.rank{font:900 24px var(--f-tc)}
.best{font:400 9px var(--f-pix);color:var(--mute)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{min-height:1.2em;font:700 12px var(--f-tc);color:var(--green);margin:0}
@media (prefers-reduced-motion:reduce){.blink,.fuel.low i,.pop{animation:none}}
</style>
</head>
<body>


<div class="cab">
  <div class="hud">
    <div><span class="lbl">DAY</span><b id="day">1</b></div>
    <div><span class="lbl" style="text-align:center">今日業績</span><div class="quota" id="quota"></div></div>
    <div class="right"><span class="lbl">SCORE</span><b id="score">0</b></div>
    <div class="fuel" id="fuelBar"><i id="fuel"></i></div>
    <div><span class="lbl">記過</span><b class="demer" id="demer">○○○</b></div>
    <div></div>
    <div class="right"><span class="lbl">HI</span><b id="hi">0</b></div>
  </div>
  <div class="screen" id="screen">
    <canvas id="cv" width="180" height="320"></canvas>
    <div class="crt"></div><div class="flash" id="flash"></div>
    <button class="mute" id="mute" aria-label="聲音開關"></button>

    <div class="ov" id="title">
      <div class="panel">
        <p class="ttl">PATROL 1987<small>抓壞人</small></p>
        <p class="txt">你是巡邏員警，長官說這個月<b>業績</b>很差。<br>開著巡邏車，把壞人一個一個攔下來。</p>
        <div class="list">
          <div><span>👆 拖曳</span>手指在路面左右滑，車子跟著走</div>
          <div><span>🚨 鳴笛</span>壞人在你正前方時按，直接攔下</div>
          <div><span>🍗 雞排</span>撿到補油，沒油就收班</div>
          <div><span>⚠️ 記過</span>撞車記一支、撞路人記兩支，三支被調去守離島</div>
        </div>
        <button class="btn" id="start">PRESS START</button>
        <p class="best" id="bestT"></p>
      </div>
    </div>
    <div class="ov" id="dayov" hidden><div class="panel" id="dayPanel"></div></div>
    <div class="ov" id="over" hidden><div class="panel" id="overPanel"></div></div>
  </div>
  <div class="ctrl">
    <div class="hint" id="hint">在路面上左右拖曳開車，壞人頭上會閃標誌</div>
    <button class="siren" id="siren" aria-label="鳴笛攔車">鳴笛<small>SIREN</small></button>
  </div>
</div>

<script>
(()=>{
const W=180,H=320,ROAD_L=22,ROAD_R=158,LANES=4,LW=(ROAD_R-ROAD_L)/LANES;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),screen=document.getElementById('screen');
const $=id=>document.getElementById(id);
ctx.imageSmoothingEnabled=false;
function fit(){const r=screen.getBoundingClientRect();const k=Math.max(1,Math.min((r.width-6)/W,(r.height-6)/H));const s=k>=2?Math.floor(k):k;cv.style.width=W*s+'px';cv.style.height=H*s+'px'}
addEventListener('resize',fit);
const laneX=i=>ROAD_L+LW*(i+.5);

/* ---------- audio ---------- */
let ac=null,master=null,bgmG=null,nb=null,unlockEl=null,muted=false,seq=null;
try{muted=localStorage.getItem('p87_mute')==='1'}catch(e){}
function silentWav(){const n=4000,b=new ArrayBuffer(44+n),v=new DataView(b);let o=0;const w=t=>{for(const c of t)v.setUint8(o++,c.charCodeAt(0))},u32=x=>{v.setUint32(o,x,true);o+=4},u16=x=>{v.setUint16(o,x,true);o+=2};
  w('RIFF');u32(36+n);w('WAVE');w('fmt ');u32(16);u16(1);u16(1);u32(8000);u32(8000);u16(1);u16(8);w('data');u32(n);for(let k=0;k<n;k++)v.setUint8(o++,128);return URL.createObjectURL(new Blob([b],{type:'audio/wav'}))}
function initAudio(){try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
  try{if(!unlockEl){unlockEl=new Audio(silentWav());unlockEl.loop=true;unlockEl.setAttribute('playsinline','')}unlockEl.play().catch(()=>{})}catch(e){}
  if(ac){ac.resume&&ac.resume();return}
  try{ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=muted?0:1;master.connect(ac.destination);
    bgmG=ac.createGain();bgmG.gain.value=.32;bgmG.connect(master);nb=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=nb.getChannelData(0);for(let k=0;k<d.length;k++)d[k]=Math.random()*2-1}catch(e){ac=null}}
function T(at){return at>10?at:ac.currentTime+(at||0)}
function tone(f,d,type='square',v=.06,at=0,dest,slide){if(!ac)return;const t=T(at),o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(dest||master);o.start(t);o.stop(t+d+.02)}
function noise(d,v,f,at=0,type='lowpass',dest){if(!ac)return;const t=T(at),s=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain();s.buffer=nb;fl.type=type;fl.frequency.value=f;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl).connect(g).connect(dest||master);s.start(t);s.stop(t+d+.02)}
const mtof=m=>440*Math.pow(2,(m-69)/12);
const sfx={
  siren(){for(let k=0;k<3;k++){tone(960,.16,'square',.06,k*.32,null,700);tone(700,.16,'square',.06,k*.32+.16,null,960)}},
  miss(){tone(330,.12,'square',.05);tone(250,.15,'square',.05,.1)},
  arrest(c){[72,76,79,84].forEach((m,k)=>tone(mtof(m+Math.min(c,5)),.1,'square',.06,k*.06))},
  crash(){noise(.45,.5,900);tone(110,.35,'sawtooth',.12,0,null,40)},
  ped(){noise(.3,.4,1200);tone(600,.3,'square',.07,0,null,150)},
  pick(){[84,88,91].forEach((m,k)=>tone(mtof(m),.07,'square',.05,k*.05))},
  low(){tone(220,.08,'square',.05)},
  clear(){[60,64,67,72,67,72,76,79,84].forEach((m,k)=>tone(mtof(m),.16,'square',.06,k*.1))},
  over(){[67,63,60,55,51].forEach((m,k)=>tone(mtof(m),.3,'triangle',.08,k*.2))},
  start(){[60,67,72].forEach((m,k)=>tone(mtof(m),.12,'square',.06,k*.08))}
};
/* chiptune drive loop */
const BAS=[45,45,57,45,43,43,55,43,41,41,53,41,43,43,55,47];
const MEL=[69,0,72,74,76,0,74,72,71,0,67,69,71,0,74,0, 72,0,76,79,81,0,79,76,74,0,71,72,74,0,71,0];
function bgmStart(){if(!ac||seq)return;let st=0,nt=ac.currentTime+.05;
  seq=setInterval(()=>{const bpm=132+(G.day-1)*6,dt=60/bpm/4;while(nt<ac.currentTime+.12){
    const b=BAS[(st>>1)%16];if(st%2===0)tone(mtof(b),dt*1.6,'triangle',.18,nt,bgmG);
    const m=MEL[st%32];if(m)tone(mtof(m),dt*.95,'square',.045,nt,bgmG);
    if(st%4===0)tone(130,.07,'sine',.25,nt,bgmG,45);if(st%4===2)noise(.05,.12,3500,nt,'highpass',bgmG);if(st%2===1)noise(.02,.05,8000,nt,'highpass',bgmG);
    nt+=dt;st++}},25)}
function bgmStop(){clearInterval(seq);seq=null}
const ICON=()=>muted?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg>';
function setMute(m){muted=m;try{localStorage.setItem('p87_mute',m?'1':'0')}catch(e){}if(master)master.gain.setTargetAtTime(m?0:1,ac.currentTime,.02);$('mute').innerHTML=ICON()}
$('mute').onclick=e=>{e.stopPropagation();initAudio();setMute(!muted)};setMute(muted);
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}

/* ---------- game data ---------- */
const CRIMES={
  red:{lab:'闖紅燈',icon:'red',kind:'scooter',col:'#e8e8e8',spd:1.25,pts:100},
  drunk:{lab:'酒駕',icon:'beer',kind:'car',col:'#c0392b',spd:.75,weave:1,pts:200},
  wrong:{lab:'逆向',icon:'stop',kind:'scooter',col:'#f1c40f',spd:-.55,pts:150},
  race:{lab:'飆車',icon:'fire',kind:'car',col:'#ff7f2a',spd:1.45,pts:250},
  park:{lab:'違停',icon:'P',kind:'car',col:'#8e44ad',spd:0,park:1,pts:80}
};
const EXCUSES=['我趕著接小孩啦','警察大人我只喝一杯','我阿伯是議員欸','我在找停車位','這條路我騎三十年了','我要去買雞排','綠燈剛變紅而已','我車子自己動的','我媽在家等我吃飯','可以算便宜一點嗎'];
const RANKS=[[0,'菜鳥警員','還在背交通法規'],[1500,'巡佐','路口的機車騎士認得你'],[4000,'派出所所長','每天雞排吃到飽'],[8000,'分局長','議員打電話來關說也沒用'],[14000,'警政署長','全台壞人看到你都繞路']];
const BOSS=['這個月業績很差喔','隔壁所已經抓了二十個','議員說最近飆車很吵','督察下午要來巡','雞排錢我出，給我抓'];
let hi=0;try{hi=+localStorage.getItem('p87_hi')||0}catch(e){}
const G={on:false,day:1,score:0,quota:3,caught:0,dem:0,fuel:100,v:70,t:0,inv:0,combo:0,spawnT:0,pedT:6,pickT:5,shake:0,roadY:0,shopY:0,dayCaught:[],totalCaught:0};
const P={x:laneX(1),tx:laneX(1),y:262,w:12,h:20};
let ents=[],peds=[],picks=[],parts=[];

/* ---------- spawning ---------- */
function rand(a,b){return a+Math.random()*(b-a)}
function pick(a){return a[Math.random()*a.length|0]}
function freeLane(y){const ls=[0,1,2,3].filter(l=>!ents.some(e=>!e.parked&&e.lane===l&&Math.abs(e.y-y)<40));return ls.length?pick(ls):-1}
function spawnCiv(){const kind=Math.random()<.45?'scooter':Math.random()<.15?'bus':'car',y=-40,l=freeLane(y);if(l<0)return;
  const cols=['#5dade2','#ecf0f1','#48c9b0','#f5b041','#a3a3a3','#ec7063','#58d68d'];
  ents.push({kind,crime:null,col:pick(cols),lane:l,x:laneX(l)+rand(-4,4),y,u:rand(.45,.8),w:kind==='scooter'?6:kind==='bus'?14:12,h:kind==='scooter'?12:kind==='bus'?34:20})}
function spawnCrime(){const pool=G.day<2?['red','park','drunk']:G.day<3?['red','park','drunk','wrong']:['red','park','drunk','wrong','race'];
  const c=pick(pool),C=CRIMES[c];
  if(C.park){const side=Math.random()<.5;ents.push({kind:'car',crime:c,col:C.col,lane:side?0:3,x:side?ROAD_L+7:ROAD_R-7,y:-30,u:0,w:12,h:20,park:1});return}
  const fromBack=C.spd>1,y=fromBack?H+30:-40,l=freeLane(y);if(l<0)return;
  ents.push({kind:C.kind,crime:c,col:C.col,lane:l,x:laneX(l),y,u:C.spd,w:C.kind==='scooter'?6:12,h:C.kind==='scooter'?12:20,weave:C.weave?rand(0,6):0,base:laneX(l)})}
function spawnPed(){const fromL=Math.random()<.5;const y=-20;peds.push({x:fromL?ROAD_L-6:ROAD_R+6,y,dir:fromL?1:-1,sp:rand(14,20),col:pick(['#f39c12','#e74c3c','#9b59b6','#1abc9c']),zebra:1})}
function spawnPick(){const l=pick([0,1,2,3]);picks.push({x:laneX(l),y:-20,t:Math.random()<.75?'chicken':'fuel'})}

/* ---------- input ---------- */
let drag=null;
function toWorld(cx){const r=cv.getBoundingClientRect();return (cx-r.left)/r.width*W}
screen.addEventListener('pointerdown',e=>{if(!G.on||e.target.closest('button'))return;drag={id:e.pointerId};P.tx=Math.max(ROAD_L+6,Math.min(ROAD_R-6,toWorld(e.clientX)));try{screen.setPointerCapture(e.pointerId)}catch(_){}});
screen.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;P.tx=Math.max(ROAD_L+6,Math.min(ROAD_R-6,toWorld(e.clientX)))});
const endDrag=e=>{if(drag&&drag.id===e.pointerId)drag=null};screen.addEventListener('pointerup',endDrag);screen.addEventListener('pointercancel',endDrag);
const keys={};addEventListener('keydown',e=>{keys[e.key]=1;if(e.key===' '){e.preventDefault();siren()}});addEventListener('keyup',e=>{keys[e.key]=0});
let sirenCd=0,sirenFx=0;
function siren(){if(!G.on||sirenCd>0)return;sirenCd=.55;sirenFx=.6;sfx.siren();$('siren').classList.add('on');setTimeout(()=>$('siren').classList.remove('on'),150);
  let best=null,bd=1e9;for(const e of ents){if(!e.crime||e.caught)continue;const dy=P.y-e.y,dx=Math.abs(e.x-P.x);if(dy>-20&&dy<110&&dx<26){const d=dy+dx*2;if(d<bd){bd=d;best=e}}}
  if(best)arrest(best);else{sfx.miss();G.combo=0;popAt(P.x,P.y-14,'沒人可抓','bad')}}
$('siren').addEventListener('pointerdown',e=>{e.preventDefault();initAudio();siren()});
function arrest(e){e.caught=1;e.u=0;e.pullX=e.x<W/2?ROAD_L+5:ROAD_R-5;G.combo++;const pts=CRIMES[e.crime].pts*(1+Math.min(G.combo-1,4)*.5)|0;
  G.score+=pts;G.caught++;G.totalCaught++;sfx.arrest(G.combo);buzz(25);
  popAt(e.x,e.y-12,`+${pts}${G.combo>1?' x'+G.combo:''}`,'big');setTimeout(()=>popAt(e.pullX,e.y-4,'「'+pick(EXCUSES)+'」'),250);
  for(let k=0;k<10;k++)parts.push({x:e.x,y:e.y,vx:rand(-40,40),vy:rand(-50,10),life:.6,col:k%2?'#ff3b3b':'#3b8bff'});
  hud();if(G.caught>=G.quota)setTimeout(dayClear,600)}

/* ---------- pops ---------- */
function popAt(x,y,t,cls=''){const r=cv.getBoundingClientRect(),s=screen.getBoundingClientRect();const d=document.createElement('div');d.className='pop '+cls;d.textContent=t;
  d.style.left=Math.max(70,Math.min(s.width-70,r.left-s.left+x/W*r.width))+'px';d.style.top=(r.top-s.top+y/H*r.height)+'px';screen.appendChild(d);setTimeout(()=>d.remove(),1200)}

/* ---------- update ---------- */
function hit(n,msg){if(G.inv>0)return;G.dem+=n;G.inv=1.6;G.combo=0;G.shake=.4;n>1?sfx.ped():sfx.crash();buzz([60,40,60]);
  const f=$('flash');f.classList.remove('r');void f.offsetWidth;f.classList.add('r');popAt(P.x,P.y-16,msg,'bad');hud();if(G.dem>=3)setTimeout(gameOver,500)}
function step(dt){
  G.t+=dt;if(G.inv>0)G.inv-=dt;if(sirenCd>0)sirenCd-=dt;if(sirenFx>0)sirenFx-=dt;if(G.shake>0)G.shake-=dt;
  if(keys.ArrowLeft)P.tx=Math.max(ROAD_L+6,P.tx-120*dt);if(keys.ArrowRight)P.tx=Math.min(ROAD_R-6,P.tx+120*dt);
  P.x+=(P.tx-P.x)*Math.min(1,dt*10);
  const v=G.v;G.roadY=(G.roadY+v*dt)%20;G.shopY=(G.shopY+v*dt)%48;
  const lowBefore=G.fuel<25;G.fuel-=dt*(2.1+G.day*.25);if(G.fuel<25&&!lowBefore)sfx.low();if(G.fuel<=0){G.fuel=0;hud();gameOver('沒油了');return}
  G.spawnT-=dt;if(G.spawnT<=0){G.spawnT=rand(.55,1.1)/(1+G.day*.12);Math.random()<.34+G.day*.03?spawnCrime():spawnCiv()}
  G.pedT-=dt;if(G.pedT<=0){G.pedT=rand(7,12)/(1+G.day*.1);spawnPed()}
  G.pickT-=dt;if(G.pickT<=0){G.pickT=rand(5,8);spawnPick()}
  for(const e of ents){
    if(e.caught){e.y+=v*dt;e.x+=(e.pullX-e.x)*Math.min(1,dt*4);continue}
    e.y+=(v-e.u*v)*dt;
    if(e.weave){e.weave+=dt*2.2;e.x=e.base+Math.sin(e.weave)*LW*.7}
    if(!e.crime&&!e.park){/* civilians avoid stalling into each other */}
    if(G.inv<=0&&Math.abs(e.x-P.x)<(e.w+P.w)/2-1&&Math.abs(e.y-P.y)<(e.h+P.h)/2-2){hit(1,e.crime?'撞到嫌犯了！記過':'追撞！記過一支');e.y+=e.u>1?-30:30;e.dead=e.crime?0:1}
  }
  ents=ents.filter(e=>!e.dead&&e.y<H+60&&e.y>-80);
  for(const p of peds){p.y+=v*dt;p.x+=p.dir*p.sp*dt;if(G.inv<=0&&Math.abs(p.x-P.x)<7&&Math.abs(p.y-P.y)<12){hit(2,'撞到路人！記過兩支');p.dead=1}}
  peds=peds.filter(p=>!p.dead&&p.y<H+20);
  for(const k of picks){k.y+=v*dt;if(Math.abs(k.x-P.x)<10&&Math.abs(k.y-P.y)<14){k.dead=1;G.fuel=Math.min(100,G.fuel+(k.t==='fuel'?40:25));G.score+=50;sfx.pick();popAt(k.x,k.y-8,k.t==='fuel'?'加滿！':'雞排補給 +油')}}
  picks=picks.filter(k=>!k.dead&&k.y<H+20);
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt+v*dt;p.vy+=60*dt;p.life-=dt}parts=parts.filter(p=>p.life>0);
  $('fuel').style.width=G.fuel+'%';$('fuelBar').classList.toggle('low',G.fuel<25);
}

/* ---------- draw (pixel art) ---------- */
function R(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)}
const SHOPS=[['#c0392b','檳'],['#27ae60','超'],['#2980b9','藥'],['#f39c12','茶'],['#8e44ad','KTV'],['#16a085','麵']];
function drawWorld(){
  R(0,0,W,H,'#3a3a46');
  /* sidewalks + shops */
  for(let s=0;s<2;s++){const x0=s?ROAD_R:0;R(x0,0,22,H,'#9c8f80');
    for(let y=-48+G.shopY;y<H;y+=48){const k=Math.abs(Math.floor((y-G.shopY)/48)+s*3)%SHOPS.length,[c]=SHOPS[k];
      R(s?ROAD_R+8:0,y+4,14,40,c);R(s?ROAD_R+9:1,y+8,12,6,'#ffe9a8');R(s?ROAD_R+8:0,y+20,14,2,'#00000055');
      R(s?ROAD_R+1:ROAD_L-4,y+30,3,3,'#3d6b2f')}}
  R(ROAD_L-1,0,1,H,'#e8e2c8');R(ROAD_R,0,1,H,'#e8e2c8');
  /* lane dashes */
  for(let l=1;l<LANES;l++){const x=ROAD_L+LW*l;for(let y=-20+G.roadY;y<H;y+=20)R(x,y,1,10,l===2?'#f5c542':'#d8d8d8')}
  /* scooter waiting zone stripes for flavor near top every so often */
}
function car(x,y,w,h,col,opt={}){x=Math.round(x-w/2);y=Math.round(y-h/2);
  R(x+1,y+h,w-1,2,'#0006');R(x,y,w,h,col);R(x+2,y+3,w-4,4,'#1b2635');R(x+2,y+h-6,w-4,3,'#1b2635');R(x+1,y+8,w-2,h-15,'#ffffff22');
  R(x-1,y+3,1,4,'#111');R(x+w,y+3,1,4,'#111');R(x-1,y+h-7,1,4,'#111');R(x+w,y+h-7,1,4,'#111');
  if(opt.wrong){R(x+2,y+h-2,2,2,'#fff6a8');R(x+w-4,y+h-2,2,2,'#fff6a8')}else{R(x+1,y+h-1,2,1,'#ff4040');R(x+w-3,y+h-1,2,1,'#ff4040')}}
function scooter(x,y,col,rider='#2c3e50',wrong){x=Math.round(x);y=Math.round(y);R(x-2,y+6,5,2,'#0006');R(x-1,y-6,3,12,'#222');R(x-2,y-3,5,7,col);R(x-2,y-6,5,3,rider);R(x-1,y-8,3,3,'#f4d03f');
  if(wrong)R(x-1,y+5,3,1,'#fff6a8')}
function bus(x,y,col){x=Math.round(x-7);y=Math.round(y-17);R(x+1,y+34,13,2,'#0006');R(x,y,14,34,col);for(let k=0;k<5;k++)R(x+2,y+4+k*6,10,3,'#1b2635');R(x,y,14,2,'#fff')}
function police(x,y,t){const w=12,h=20;x=Math.round(x-w/2);y=Math.round(y-h/2);R(x+1,y+h,w-1,2,'#0006');R(x,y,w,h,'#f4f4f4');R(x,y+6,w,8,'#1c3f94');
  R(x+2,y+2,w-4,3,'#1b2635');R(x+2,y+h-5,w-4,3,'#1b2635');const on=Math.floor(t*8)%2;R(x+2,y+8,4,2,on||sirenFx>0?'#ff2b2b':'#7a1010');R(x+6,y+8,4,2,!on||sirenFx>0?'#2b6bff':'#10307a');
  R(x-1,y+3,1,4,'#111');R(x+w,y+3,1,4,'#111');R(x-1,y+h-7,1,4,'#111');R(x+w,y+h-7,1,4,'#111');
  if(sirenFx>0){ctx.globalAlpha=sirenFx*.5;ctx.fillStyle=Math.floor(t*16)%2?'#ff2b2b':'#2b6bff';ctx.beginPath();ctx.moveTo(x+6,y);ctx.lineTo(x-14,y-110);ctx.lineTo(x+26,y-110);ctx.fill();ctx.globalAlpha=1}}
function icon(e,t){const x=Math.round(e.x),y=Math.round(e.y-e.h/2-9);if(Math.floor(t*5)%2&&!e.caught)return;
  const C=CRIMES[e.crime];R(x-5,y-4,11,9,'#000');R(x-4,y-3,9,7,e.caught?'#4bd88a':'#fff');
  const c=e.caught?'#0a5':'#d00';
  if(e.caught){R(x-2,y,2,2,c);R(x,y+1,1,1,c);R(x+1,y-1,2,2,c);return}
  if(C.icon==='red'){R(x-2,y-2,5,5,'#222');R(x-1,y-1,3,3,'#f22')}
  else if(C.icon==='beer'){R(x-2,y-2,4,5,'#e8a317');R(x-2,y-2,4,1,'#fff');R(x+2,y-1,1,3,'#e8a317')}
  else if(C.icon==='stop'){R(x-3,y-2,7,5,'#d00');R(x-2,y,5,1,'#fff')}
  else if(C.icon==='fire'){R(x-1,y-2,3,5,'#ff7f2a');R(x-2,y,5,3,'#ff3b00');R(x,y,1,2,'#ffd23b')}
  else{R(x-2,y-2,5,5,'#2b6bff');R(x-1,y-1,2,3,'#fff');R(x+1,y-1,1,1,'#fff')}}
function draw(){
  ctx.save();if(G.shake>0)ctx.translate(Math.round(rand(-2,2)),Math.round(rand(-2,2)));
  drawWorld();
  for(const k of picks){const x=Math.round(k.x),y=Math.round(k.y);if(k.t==='chicken'){R(x-4,y-3,8,7,'#c87533');R(x-3,y-2,6,1,'#e9a35d');R(x-1,y+4,2,2,'#f4e1c1')}else{R(x-3,y-4,6,8,'#d63031');R(x-1,y-3,2,2,'#fff');R(x+3,y-2,1,4,'#555')}}
  for(const p of peds){const x=Math.round(p.x),y=Math.round(p.y);R(x-1,y-5,3,3,'#f1c27d');R(x-2,y-2,5,5,p.col);R(x-2,y+3,2,3,'#333');R(x+1,y+3,2,3,'#333')}
  for(const e of ents){const wrong=e.u<0;if(e.kind==='scooter')scooter(e.x,e.y,e.col,'#2c3e50',wrong);else if(e.kind==='bus')bus(e.x,e.y,e.col);else car(e.x,e.y,e.w,e.h,e.col,{wrong})}
  for(const e of ents)if(e.crime)icon(e,G.t);
  if(!(G.inv>0&&Math.floor(G.t*12)%2))police(P.x,P.y,G.t);
  for(const p of parts)R(p.x,p.y,2,2,p.col);
  ctx.restore();
}

/* ---------- HUD / flow ---------- */
function hud(){$('day').textContent=G.day;$('score').textContent=G.score;$('hi').textContent=Math.max(hi,G.score);
  $('demer').textContent='●'.repeat(G.dem)+'○'.repeat(Math.max(0,3-G.dem));
  $('quota').innerHTML=Array.from({length:G.quota},(_,k)=>`<i class="${k<G.caught?'on':''}"></i>`).join('')}
let last=0;function loop(ts){const dt=Math.min(.05,(ts-(last||ts))/1000);last=ts;if(G.on)step(dt);draw();requestAnimationFrame(loop)}
function resetDay(){ents=[];peds=[];picks=[];parts=[];G.caught=0;G.quota=2+G.day;G.v=68+G.day*8;G.fuel=Math.max(G.fuel,70);G.spawnT=.5;G.pedT=5;G.pickT=4;G.combo=0;P.x=P.tx=laneX(1);hud()}
function dayIntro(){G.on=false;const ov=$('dayov');$('dayPanel').innerHTML=`<p class="ttl" style="font-size:16px">DAY ${G.day}</p>
  <p class="txt">長官：「${BOSS[(G.day-1)%BOSS.length]}」<br>今日業績：<b>抓 ${2+G.day} 個</b></p><p class="blink">TAP TO START</p>`;ov.hidden=false;
  const go=()=>{ov.hidden=true;ov.onclick=null;resetDay();G.on=true;sfx.start()};ov.onclick=go}
function dayClear(){if(!G.on)return;G.on=false;const bonus=Math.round(G.fuel)*10;G.score+=bonus;sfx.clear();hud();
  $('dayPanel').innerHTML=`<p class="ttl" style="font-size:14px">業績達標</p><p class="txt">所長很滿意，晚餐雞排加大。<br>剩餘油量獎金 <b>+${bonus}</b></p><p class="blink">TAP FOR DAY ${G.day+1}</p>`;
  const ov=$('dayov');ov.hidden=false;ov.onclick=()=>{G.day++;dayIntro()}}
function rank(s){let r=RANKS[0];for(const x of RANKS)if(s>=x[0])r=x;return r}
function gameOver(reason){if(!G.on&&reason!=='沒油了'&&G.dem<3)return;G.on=false;bgmStop();sfx.over();
  if(G.score>hi){hi=G.score;try{localStorage.setItem('p87_hi',hi)}catch(e){}}
  const [,title,desc]=rank(G.score),why=G.dem>=3?'記過三支，被調去守離島。':'巡邏車沒油了，今天收班。';
  const share=`我在《抓壞人 1987》當上「${title}」，第 ${G.day} 天抓了 ${G.totalCaught} 個壞人，${G.score} 分🚨\n你能升到哪一級？`;
  $('overPanel').innerHTML=`<p class="ttl" style="font-size:16px">GAME OVER</p><p class="txt">${why}</p>
    <div class="big">${G.score}</div><div class="rank">${title}</div><p class="txt">${desc}<br>撐到第 ${G.day} 天・共抓 ${G.totalCaught} 個壞人</p>
    <div class="row"><button class="btn ghost" id="cp">複製戰績</button><button class="btn" id="again">再巡一次</button></div><p class="toast" id="toast"></p><p class="best">HI-SCORE ${hi}</p>`;
  $('over').hidden=false;
  $('again').onclick=()=>{$('over').hidden=true;newGame()};
  $('cp').onclick=()=>{const site=/github\.io$/.test(location.hostname)?'\n'+location.origin+location.pathname:'';const t=share+site;
    const ok=()=>$('toast').textContent='已複製，去 Threads 炫耀';
    try{navigator.clipboard.writeText(t).then(ok,()=>$('toast').textContent='瀏覽器不讓複製，請截圖')}catch(e){$('toast').textContent='瀏覽器不讓複製，請截圖'}}}
function newGame(){initAudio();Object.assign(G,{day:1,score:0,dem:0,fuel:100,totalCaught:0,inv:0});bgmStart();dayIntro()}
$('start').onclick=()=>{$('title').hidden=true;newGame()};
$('bestT').textContent=hi?`HI-SCORE ${hi}`:'';
/* attract mode behind title */
G.v=60;for(let k=0;k<6;k++){spawnCiv();ents[ents.length-1]&&(ents[ents.length-1].y=rand(0,H))}
(function attract(){if(G.on||$('title').hidden)return;G.roadY=(G.roadY+1)%20;G.shopY=(G.shopY+1)%48;for(const e of ents)e.y+=(1-e.u)*1;ents=ents.filter(e=>e.y<H+40);if(Math.random()<.04)spawnCiv();setTimeout(attract,16)})();
hud();fit();requestAnimationFrame(loop);
})();
</script>
