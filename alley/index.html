/* Layout: one-screen toy. A square illustrated alley above a terrazzo counter holding six order tiles. Single fixed look. */

.dex{background:var(--temple);color:var(--paper)}.dex b{border-top-color:var(--ink);justify-content:center}.book{flex:1;display:flex;align-items:center;justify-content:center;font-size:clamp(14px,4vw,20px);font-weight:700;line-height:1.15;padding:6px 0;text-align:center}

#dex header{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:6px;background:var(--terrazzo);z-index:1}#dex h2{margin:0;font-size:22px}#dex h2 small{font-size:14px;font-weight:400;margin-left:8px;color:var(--muted)}

<script>
const cv=document.getElementById('cv');
let c=cv.getContext('2d'),t=0;
const INK='#3a2a1c',TAU=Math.PI*2,FONT='"LXGW WenKai TC","PingFang TC",serif';
const W=(f,p=0)=>Math.sin(t*f+p);
const lerp=(a,b,k)=>a+(b-a)*k;
let lwMul=1;

function el(x,y,rx,ry,f,lw=3,r=0){c.beginPath();c.ellipse(x,y,rx,ry,r,0,TAU);S(f,lw)}
function pl(p,f,lw=3,closed=true){c.beginPath();c.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)c.lineTo(p[i],p[i+1]);if(closed)c.closePath();S(f,lw)}

function sh(x,y,rx,ry=rx*.32){c.beginPath();c.ellipse(x,y,rx,ry,0,0,TAU);c.fillStyle='rgba(50,70,20,.28)';c.fill()}
function at(x,y,sx,sy,fn){c.save();c.translate(x,y);c.scale(sx,sy);fn();c.restore()}
function limb(x1,y1,x2,y2,w,col){ln(x1,y1,x2,y2,INK,w+4.5);ln(x1,y1,x2,y2,col,w)}
function tx(s,x,y,size,col=INK,al='center'){c.font=`700 ${size}px ${FONT}`;c.textAlign=al;c.textBaseline='middle';c.fillStyle=col;c.fillText(s,x,y)}
function blob(p,f,lw=3){const n=p.length/2;const m=i=>[(p[i*2%(n*2)]+p[(i*2+2)%(n*2)])/2,(p[i*2%(n*2)+1]+p[(i*2+2)%(n*2)+1])/2];c.beginPath();let a=m(n-1);c.moveTo(a[0],a[1]);for(let i=0;i<n;i++){const b=m(i);c.quadraticCurveTo(p[i*2],p[i*2+1],b[0],b[1])}c.closePath();S(f,lw)}

/* ---------- people ---------- */
const SK=['#f6cfa6','#eebd90','#dca878'];
function who(x,y,o={},s=1){
  const fl=o.flip?-1:1,ph=o.ph||0,pose=o.pose||'stand',skin=o.skin||SK[0],top=o.top||'#e5694f',bot=o.bot||'#47608c',shoe=o.shoe||'#fff7e6';
  at(x,y,s*fl,s,()=>{
    if(!o.nosh)sh(0,0,20,6);
    const bob=(pose==='walk'?Math.abs(W(8,ph))*2:W(2.2,ph)*.5);
    c.save();c.translate(0,-bob);
    if(pose==='walk'){const k=W(8,ph)*7;limb(-3,-18,-3+k,-3+bob,5,bot);limb(4,-18,4-k,-3+bob,5,bot);ln(-3+k,-1+bob,1+k,-1+bob,INK,6);ln(4-k,-1+bob,8-k,-1+bob,INK,6)}
    else if(pose==='sit'){c.translate(0,-3);limb(-3,-14,9,-14,5,bot);limb(9,-14,10,-1,5,bot);limb(3,-14,14,-14,5,bot);limb(14,-14,15,-1,5,bot);ln(10,1,15,1,shoe,5);ln(15,1,20,1,INK,5)}
    else if(pose==='squat'){c.translate(0,10);limb(-6,-17,-9,-10,6,bot);limb(5,-17,9,-10,6,bot);ln(-12,-9,-5,-9,INK,6);ln(6,-9,12,-9,INK,6)}
    else{limb(-4,-18,-4,-3,5,bot);limb(4,-18,4,-3,5,bot);ln(-7,-1,-2,-1,INK,6);ln(3,-1,8,-1,INK,6)}
    const aL=o.armL??(pose==='walk'?W(8,ph+3)*.6+.15:.25),aR=o.armR??(pose==='walk'?W(8,ph)*.6+.15:.25);
    const arm=(sx,a)=>{const ex=sx+Math.sin(a)*17*Math.sign(sx),ey=-33+Math.cos(a)*17;limb(sx,-33,ex,ey,4.5,o.sleeve||top);el(ex,ey,3.2,3.2,skin,2);return[ex,ey]};
    if(!o.armsFront)arm(-9,aL);
    c.beginPath();c.moveTo(-10,-37);c.quadraticCurveTo(0,-41,10,-37);c.lineTo(11,-15);c.quadraticCurveTo(0,-12,-11,-15);c.closePath();S(top,3);
    if(o.dots){c.fillStyle=o.dots;for(const d of[[-5,-31],[4,-27],[-3,-21],[6,-19],[1,-35]]){c.beginPath();c.arc(d[0],d[1],1.8,0,TAU);c.fill()}}
    if(o.stripe){ln(-10,-30,10,-30,o.stripe,3);ln(-10,-23,10,-23,o.stripe,3)}
    if(o.apron){rr(-7,-30,14,17,2,o.apron,2)}
    const hand=arm(9,aR);
    if(o.hold)at(hand[0],hand[1],1,1,o.hold);
    // head
    c.save();c.translate(0,-56);c.scale(1.32,1.32);if(o.tilt)c.rotate(o.tilt);
    const h=o.hair||'#2c2219',st=o.style||'short';
    if(st==='pony'){el(-16+W(3,ph)*1.5,-1,6,12,h,3,.5)}
    if(st==='long'){rr(-18,-8,36,28,10,h,3)}
    if(st==='bun'){el(0,-19,7,6,h)}
    el(0,0,17.5,16,skin);
    el(-17,2,3,4,skin,2.5);el(17,2,3,4,skin,2.5);
    if(st==='short'||st==='pony'||st==='bun'||st==='long'){c.beginPath();c.moveTo(-18,1);c.quadraticCurveTo(-19,-17,0,-17.5);c.quadraticCurveTo(19,-17,18,1);c.quadraticCurveTo(13,-8,5,-8);c.quadraticCurveTo(-4,-5,-10,-8);c.quadraticCurveTo(-15,-5,-18,1);c.closePath();S(h)}
    if(st==='spike'){pl([-18,0,-16,-14,-11,-11,-8,-21,-3,-13,3,-22,6,-13,12,-19,13,-9,18,0,10,-7,-8,-6],h)}
    if(st==='perm'){for(const q of[[-15,-4],[-11,-12],[-3,-15],[5,-15],[12,-11],[16,-4]])el(q[0],q[1],6.5,6.5,h,2.5);el(0,-9,14,6,h,0)}
    if(st==='bald'){el(-14,-3,4,4,h,2);el(14,-3,4,4,h,2);ln(-5,-11,5,-11,'#c99872',1.5);ln(-3,-8,3,-8,'#c99872',1.5)}
    if(st==='cap'){c.beginPath();c.moveTo(-18,-3);c.quadraticCurveTo(-16,-18,0,-18);c.quadraticCurveTo(16,-18,18,-3);c.closePath();S(o.capc||'#2f7a55');pl([6,-5,26,-3,26,0,6,-1],o.capc||'#2f7a55',2.5)}
    if(st==='helmet'){c.beginPath();c.moveTo(-19,0);c.quadraticCurveTo(-18,-20,0,-20);c.quadraticCurveTo(18,-20,19,0);c.closePath();S(o.capc||'#e0b52e');ln(-16,3,-5,14,INK,1.5);ln(16,3,5,14,INK,1.5);ln(-14,-9,14,-9,'rgba(255,255,255,.55)',3)}
    if(st==='hat'){c.beginPath();c.moveTo(-31,-5);c.lineTo(0,-27);c.lineTo(31,-5);c.quadraticCurveTo(0,-11,-31,-5);c.closePath();S('#e7cf8d');ln(-16,-7,-1,-25,'#a78e4f',1.5);ln(16,-7,1,-25,'#a78e4f',1.5);ln(0,-8,0,-24,'#a78e4f',1.5)}
    // face
    const e=o.eye||'dot';
    if(e==='dot'){el(-6,2,2,2.4,INK,0);el(6.5,2,2,2.4,INK,0)}
    if(e==='happy'){c.lineWidth=2;c.strokeStyle=INK;c.beginPath();c.arc(-6,3,3,Math.PI,0);c.stroke();c.beginPath();c.arc(6,3,3,Math.PI,0);c.stroke()}
    if(e==='shut'){ln(-9,2,-3,2,INK,2);ln(3,2,9,2,INK,2)}
    if(o.glasses){c.lineWidth=1.5;c.strokeStyle=INK;c.beginPath();c.arc(-6,2,4.5,0,TAU);c.stroke();c.beginPath();c.arc(6.5,2,4.5,0,TAU);c.stroke();ln(-1.5,2,2,2,INK,1.5)}
    el(-10,7,3,1.8,'rgba(232,110,90,.55)',0);el(10,7,3,1.8,'rgba(232,110,90,.55)',0);
    if(o.mouth==='o')el(0,9,2.5,3,'#8a2b20',1.5);else{c.lineWidth=1.8;c.strokeStyle=INK;c.beginPath();c.arc(0,6,3.2,.3,Math.PI-.3);c.stroke()}
    c.restore();
    c.restore();
  });
}
/* ---------- animals ---------- */
function dog(x,y,s=1,o={}){
  const fl=o.flip?-1:1,col=o.col||'#d9a44f',d=o.dk||'#b67f33',ph=o.ph||0;
  at(x,y,s*fl,s,()=>{
    sh(0,0,28,7);
    const wag=W(11,ph)*.5;
    if(o.pose==='sit'){
      c.save();c.translate(-15,-14);c.rotate(-.9+wag);rr(-3,-14,6,16,3,col,2.5);c.restore();
      el(-4,-14,16,14,col);limb(6,-14,8,-2,5,col);el(-12,-3,9,4,col,2.5);el(9,-1,5,2.5,col,2.5);
      c.save();c.translate(6,-32);
    }else if(o.pose==='lie'){
      c.save();c.translate(-26,-9);c.rotate(-1.3+wag);rr(-3,-12,5,13,3,col,2.5);c.restore();
      el(-4,-9,24,10,col);el(21,-3,8,3,col,2.5);c.save();c.translate(15,-16);
    }else{
      const k=o.run?W(13,ph)*6:0,b=o.run?Math.abs(W(13,ph))*3:0;
      c.translate(0,-b);
      limb(-13,-10,-13-k,-1+b,4.5,d);limb(11,-10,11+k,-1+b,4.5,d);
      c.save();c.translate(-22,-19);c.rotate(-.7+wag);rr(-3,-14,6,15,3,col,2.5);c.restore();
      el(-2,-16,23,11,col);
      limb(-8,-10,-8+k,-1+b,4.5,col);limb(16,-10,16-k,-1+b,4.5,col);
      c.save();c.translate(21,-29);
    }
    pl([-13,-6,-16,-20,-4,-13],d,2.5);pl([5,-13,14,-20,13,-6],d,2.5);
    el(0,0,15,13,col);el(5,4,8,6.5,'#fbeed2',2);el(9,2,3,2.3,INK,0);
    if(o.eye==='shut'){ln(-6,-3,-1,-3,INK,2);ln(3,-3,8,-3,INK,2)}else{el(-3,-3,2.2,2.5,INK,0);el(5,-3,2.2,2.5,INK,0)}
    if(o.tongue)rr(5,8,5,6,2,'#ee7f7a',1.5);
    if(o.collar){ln(-11,9,6,12,'#c43b2a',4)}
    c.restore();
  });
}
function cat(x,y,s=1,col='#6d6a68',fl=1){at(x,y,s*fl,s,()=>{
  sh(0,0,14,4);c.save();c.translate(-10,-6);c.rotate(-.7+W(3)*.3);rr(-2,-17,4,18,2,col,2.5);c.restore();
  el(0,-10,12,10,col);pl([-7,-23,-10,-34,-2,-29],col,2.5);pl([3,-29,10,-34,8,-23],col,2.5);el(1,-22,10,9,col);

document.getElementById('snd').addEventListener('click',e=>{sound=!sound;e.currentTarget.textContent='聲音：'+(sound?'開':'關');ensureAudio();if(bgm&&AC){bgm.gain.setTargetAtTime(sound?.85:0,AC.currentTime,.1);bgmNext=Math.max(bgmNext,AC.currentTime+.1)}});document.addEventListener('visibilitychange',()=>{if(!AC)return;if(document.hidden)AC.suspend();else if(sound){AC.resume();bgmNext=Math.max(bgmNext,AC.currentTime+.1)}});
document.getElementById('again').addEventListener('click',e=>{if(order.length)tries++;e.currentTarget.classList.remove('go');reset()});
document.getElementById('resbtn').addEventListener('click',openResult);document.getElementById('resclose').addEventListener('click',()=>{document.getElementById('res').hidden=true});document.getElementById('rescopy').addEventListener('click',async e=>{const txt=`我在《巷仔內》排出「${ending.name}」，總等級 ${total()}/35，稱號是「${ending.title}」。你排得出全巷滿級嗎？`;try{await navigator.clipboard.writeText(txt);e.target.textContent='已複製'}catch(err){document.getElementById('resnote').textContent=txt;e.target.textContent='請手動選取'}});document.getElementById('dexclose').addEventListener('click',()=>{document.getElementById('dex').hidden=true});updDex();
try{best=+localStorage.getItem('alley-best')||0}catch(e){}
reset();{const d=document.createElement('button');d.type='button';d.className='card dex';d.id='dexbtn';d.innerHTML='<div class="book">圖<br>鑑</div><b><em style="font-style:normal" id="dexn"></em></b>';d.addEventListener('click',openDex);CARDS.append(d)}updDex();fit();requestAnimationFrame(frame);addEventListener('resize',()=>{size=0;fit()});
