<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>領養日</title><meta name="description" content="你是一隻狗。認養會上，3 組人類會給你評分。">
<meta property="og:title" content="領養日"><meta property="og:description" content="你是一隻狗。尿在拖鞋上，還是翻肚裝可愛？看你會被誰帶回家。">
<style>
:root{--ink:#263c32;--bg:#f6efe1;--card:#fffaf0;--line:#e3d4b8;--g:#3d5a3a;--red:#d2533c;--yel:#f2b632;--sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;--serif:"Noto Serif TC","Songti TC",serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#1d1f24;color:var(--ink);font-family:var(--sans);overscroll-behavior:none;user-select:none;-webkit-user-select:none}
body{display:flex;justify-content:center}
#app{width:100%;max-width:520px;height:100dvh;position:relative;overflow:hidden;background:var(--bg)}
button{font-family:inherit;cursor:pointer}[hidden]{display:none!important}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.hud{position:absolute;left:0;right:0;top:0;z-index:5;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0;display:grid;gap:6px;pointer-events:none}
.hrow{display:flex;align-items:center;gap:8px;font-weight:900;font-size:13px;color:#fff;text-shadow:0 1px 3px #000a}
.bar{flex:1;height:12px;border-radius:8px;background:#0005;overflow:hidden;border:1px solid #fff6}.bar i{display:block;height:100%;width:100%;transition:width .15s}
#prog{display:block;height:100%;background:#fff;width:0}.pbar{height:5px;border-radius:4px;background:#0004;overflow:hidden}
#ctrl{position:absolute;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:space-between;padding:0 16px calc(18px + env(safe-area-inset-bottom,0px));pointer-events:none}
#ctrl button,#final button{pointer-events:auto;border:0;border-radius:50%;width:84px;height:84px;font-size:20px;font-weight:900;color:#fff;background:#0006;border:2px solid #fff8;touch-action:none}
#ctrl button:active{background:#000a}
#final{position:absolute;left:0;right:0;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;justify-content:center}
#final button{width:auto;height:auto;border-radius:18px;padding:18px 28px;font-size:18px;background:#355a4dee}
#banner{position:absolute;inset:0;z-index:20;display:grid;place-content:center;text-align:center;gap:10px;padding:24px;background:#000a;color:#fff}
#banner .lv{font:900 34px var(--serif)}#banner span{font:500 17px/1.6 var(--serif)}#banner em{font-style:normal;font-size:13px;color:#f3d27a;line-height:1.6}#banner small{opacity:.6;margin-top:10px}
#banner.in{animation:fi .5s}@keyframes fi{from{opacity:0}to{opacity:1}}
.ov{position:absolute;inset:0;z-index:40;background:#14281f80;backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px}
#card{background:var(--card);border-radius:22px;padding:20px 18px;width:100%;max-width:420px;max-height:92%;overflow:auto;display:grid;gap:12px;text-align:center;box-shadow:0 20px 50px #0006}
#card h2{margin:0;font:900 22px var(--serif)}#card p{margin:0;line-height:1.6}.sub{color:#7c6b55;font-size:14px}
.big{border:0;border-radius:14px;padding:14px 20px;font-size:17px;font-weight:900;background:#355a4d;color:#fff;width:100%;display:block;text-align:center}
.big.alt{background:#fff;color:#355a4d;border:2px solid #355a4d}.big:disabled{opacity:.5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
img.full{width:100%;border-radius:14px;display:block}
.cta{background:#fff3df;border:2px dashed var(--yel);border-radius:16px;padding:12px;display:grid;gap:8px}.cta small{color:#7c6b55}
.mem{background:#2e2418;color:#f8ecd6;border-radius:14px;padding:12px;display:grid;gap:6px;text-align:left;font:500 14px/1.6 var(--serif)}.mem .lock{opacity:.4}
.real{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:left}
.ra{background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px;display:grid;gap:2px;font-size:12.5px}.ra img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}.ra small{color:#7c6b55}.ra a{color:#355a4d;font-weight:700}
.fl{position:absolute;pointer-events:none;font-weight:900;font-size:16px;color:#fff;text-shadow:0 1px 3px #000a;animation:fl 1s ease-out forwards;white-space:nowrap;z-index:8;transform:translateX(-50%)}
@keyframes fl{to{transform:translate(-50%,-40px);opacity:0}}
.toast{position:absolute;left:50%;top:90px;transform:translateX(-50%);z-index:9;background:#2e2418ee;color:#fff;font-weight:700;font-size:14px;border-radius:12px;padding:9px 14px;max-width:88%;text-align:center;animation:tin 2.4s ease forwards;pointer-events:none}
@keyframes tin{0%{opacity:0}10%,80%{opacity:1}100%{opacity:0}}
#title{position:absolute;inset:0;z-index:30;display:grid;align-content:center;justify-items:center;gap:14px;padding:24px;background:linear-gradient(#f3a76bdd,#f8d4a0ee 60%,#cdb688);text-align:center}
#title h1{margin:0;font:900 48px var(--serif);color:#2e2418;letter-spacing:.06em}#title p{margin:0;font:500 16px/1.7 var(--serif);color:#4a3a28}
#tcv{width:min(80vw,380px);aspect-ratio:840/420}
.hrow{color:#263c32;text-shadow:none;font-size:14px}
#tray{position:absolute;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px));background:#2e2418}
#tray button{border:0;border-radius:14px;background:#fffaf0;padding:8px 4px;font-size:22px;display:grid;justify-items:center;gap:2px;touch-action:manipulation}#tray button b{font-size:13px;color:#263c32}#tray button:active{background:#f2d79c}
#banner .no,.no{font-size:13px;color:#a08a6a;font-weight:700;letter-spacing:.08em}#banner .no{color:#f3d27a}#banner .tg{font-size:14px;opacity:.8}
.stars{font-size:34px;color:#f2b632;letter-spacing:2px}.stars small{font-size:16px;color:#7c6b55}.rv{font:700 18px/1.7 var(--serif);color:#263c32}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;font-size:13px;color:#7c6b55}.chips button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font-weight:700;color:#355a4d}.chips button.on{background:#355a4d;color:#fff}
label.big{box-sizing:border-box}
.toast.big{font-size:16px;background:#d2533cee;top:70px}
#mute{position:absolute;right:12px;top:calc(40px + env(safe-area-inset-top,0px));z-index:7;border:0;background:#0005;color:#fff;border-radius:50%;width:34px;height:34px}
</style><link rel="stylesheet" href="style.css"></head><body><div id="app">
<canvas id="cv"></canvas>
<div class="hud"><div class="hrow"><span class="visitor-icon" aria-hidden="true"></span><div class="visitor-info"><small id="visit-label">認養會 · 第 1 組</small><span id="who"></span></div><span id="time-left" aria-label="剩餘秒數">15<small>秒</small></span></div><div class="pbar" id="tbar" hidden><i id="tb" style="display:block;height:100%;background:#d2533c;width:100%"></i></div></div>
<div id="tray" hidden><div class="tray-head"><span id="context-hint">點地板移動，靠近人或物品再互動</span><span id="action-status">自由活動</span></div><button data-a="bark" type="button">🗣️<b>吠</b></button><button data-a="pee" type="button">💦<b>尿</b></button><button data-a="bite" type="button">🦷<b>咬</b></button><button data-a="love" type="button">💗<b>撒嬌</b></button><button data-a="roll" type="button">🙃<b>翻肚</b></button><button data-a="lie" type="button">💤<b>躺平</b></button></div>
<div id="banner" hidden></div>
<div id="title"><div class="title-scenery" aria-hidden="true"></div><div class="edition">阿聰主演 · 自由互動小遊戲</div><h1>領養日<span>今天，換你當狗。</span></h1><div class="cover-stamp">一隻狗<br>好多種狗生</div><canvas id="tcv" width="840" height="420"></canvas><p>你是一隻狗，叫阿聰。<br>今天是認養會，3 組人類會來給你打分數。<br>乖巧、兇猛、還是尿在拖鞋上——你決定。</p><button class="big" id="bNew" type="button" style="max-width:300px">走進認養會</button><button class="big alt" id="bMy" type="button" style="max-width:300px">📷 用我家的狗玩</button></div>
<div class="ov" id="ov" hidden><div id="card"></div></div>
</div>
<script src="game.js"></script><script>(function(){var last=0;document.addEventListener('touchend',function(e){var t=e.target;if(t.closest&&t.closest('button,a,input,select,textarea,label,canvas'))return;var n=Date.now();if(n-last<350)e.preventDefault();last=n},{passive:false});['gesturestart','gesturechange'].forEach(function(k){document.addEventListener(k,function(e){e.preventDefault()},{passive:false})});document.addEventListener('dblclick',function(e){e.preventDefault()},{passive:false})})();</script><div class="desktop-note"><b>領養日</b><span>當一天狗。<br>做一次自己的選擇。</span><small>點地板自由走動<br>靠近人或物品，試試不同互動</small><i>阿聰主演 · 認養代替購買</i></div></body></html>
