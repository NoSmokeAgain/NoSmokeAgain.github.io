"use strict";
/* ---------- noise ---------- */
function RNG(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function noise2(seed){const R=RNG(seed),N=64,P=new Float32Array(N*N);for(let i=0;i<P.length;i++)P[i]=R();const L=(a,b,t)=>a+(b-a)*t;
  const v=(x,y)=>{const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),w=yf*yf*(3-2*yf),g=(i,j)=>P[((j&63)*N)+(i&63)];return L(L(g(xi,yi),g(xi+1,yi),u),L(g(xi,yi+1),g(xi+1,yi+1),u),w)};
  return(x,y,o=3)=>{let s=0,a=1,f=1,t=0;for(let i=0;i<o;i++){s+=v(x*f,y*f)*a;t+=a;a*=.5;f*=2}return s/t-.5}}

/* ---------- route shapes (unit square) ---------- */
const loop=(cx,cy,rx,ry,wob,seed,n=80)=>{const nz=noise2(seed),p=[];for(let i=0;i<=n;i++){const a=i/n*Math.PI*2,k=1+nz(Math.cos(a)*1.5+3,Math.sin(a)*1.5+3,2)*wob;p.push([cx+Math.cos(a)*rx*k,cy+Math.sin(a)*ry*k])}p[n]=p[0];return p};
const curve=(pts,n=60)=>{const out=[];for(let i=0;i<pts.length-1;i++){const[a,b]=[pts[i],pts[i+1]];for(let j=0;j<n/(pts.length-1);j++){const t=j/(n/(pts.length-1));out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t])}}out.push(pts[pts.length-1]);return out};

 gain: target climb in metres for the route (vertical scale is fitted to it). */

 {city:"tc",id:"autumn",zone:["xitun"],n:"秋紅谷",area:"西屯・七期",cat:["park","flat"],type:"短圈恢復跑",dist:"1",distNote:"環湖一圈，約",distEst:1,gain:6,gainEst:1,
  surface:"環湖步道、木棧道",time:"夜跑、晚餐前短跑",supply:"周邊百貨、超商很多",workout:["恢復跑","短間歇"],

 {city:"tc",id:"fazi",zone:["nantun","xitun"],n:"筏子溪迎賓水岸",area:"南屯・西屯",cat:["flat","long"],type:"河堤配速",dist:"10",distNote:"單程 5 km 來回，可再延長，約",distEst:1,gain:8,gainEst:1,

  const P=(u,v,h)=>{const x=u-.5,y=v-.5,rx=x*cy-y*sy,ry=x*sy+y*cy;return[W/2+rx*S,Hh*(small?.56:.6)+ry*S*tilt-(h-b.lo)/rel*vert*S]};
  const depth=(u,v)=>{const x=u-.5,y=v-.5;return x*sy+y*cy};
  const quads=[];for(let j=0;j<G;j++)for(let i=0;i<G;i++)quads.push([i,j,depth((i+.5)/G,(j+.5)/G)]);quads.sort((a,c)=>a[2]-c[2]);
  const wc=css("--water"),hcol="rgba(255,255,255,.035)";
  for(const[i,j]of quads){const k=j*(G+1)+i,h00=b.H[k],h10=b.H[k+1],h01=b.H[k+G+1],h11=b.H[k+G+2];
    const u0=i/G,v0=j/G,u1=(i+1)/G,v1=(j+1)/G;const p=[P(u0,v0,h00),P(u1,v0,h10),P(u1,v1,h11),P(u0,v1,h01)];
    const water=b.Wt[k]&&b.Wt[k+1]&&b.Wt[k+G+1]&&b.Wt[k+G+2];
    const dx=(h10+h11-h00-h01)/2/rel,dy=(h01+h11-h00-h10)/2/rel;const lx=-.6*cy+.4*sy,ly=.6*sy+.4*cy;const shade=Math.max(.72,Math.min(1.12,1+(dx*lx+dy*ly)*-2.4*vert*10));
    const c=water?null:ramp(((h00+h11)/2-b.lo)/rel,shade);
    ctx.beginPath();ctx.moveTo(...p[0]);ctx.lineTo(...p[1]);ctx.lineTo(...p[2]);ctx.lineTo(...p[3]);ctx.closePath();
    ctx.fillStyle=water?wc:`rgb(${c})`;ctx.fill();if(!small){ctx.strokeStyle=hcol;ctx.lineWidth=.5;ctx.stroke()}else{ctx.strokeStyle=ctx.fillStyle;ctx.lineWidth=.6;ctx.stroke()}}
  // route
  const lift=small?1:2,pts=b.R.map(([u,v])=>{const q=P(u,v,b.at(u,v));return[q[0],q[1]-lift]});
  ctx.lineJoin="round";ctx.lineCap="round";
  ctx.strokeStyle="rgba(255,106,43,.28)";ctx.lineWidth=small?4:10;ctx.beginPath();pts.forEach((q,i)=>i?ctx.lineTo(...q):ctx.moveTo(...q));ctx.stroke();
  ctx.strokeStyle=css("--run");ctx.lineWidth=small?1.8:3.4;ctx.beginPath();pts.forEach((q,i)=>i?ctx.lineTo(...q):ctx.moveTo(...q));ctx.stroke();
  if(!small){const s0=pts[0],e0=pts[pts.length-1];const pin=(q,t,col)=>{ctx.fillStyle=col;ctx.beginPath();ctx.arc(q[0],q[1],7,0,7);ctx.fill();ctx.strokeStyle="#0a0b0d";ctx.lineWidth=2;ctx.stroke();ctx.font="700 12px "+css("--sans");ctx.fillStyle=css("--ink");ctx.textAlign="center";ctx.fillText(t,q[0],q[1]-12)};
    const same=Math.hypot(s0[0]-e0[0],s0[1]-e0[1])<10;if(!same)pin(e0,"終點","#f3f4f6");pin(s0,same?"起終點":"起點",css("--run"))}}

/* ---------- profile ---------- */
function drawProfile(cv,s){const b=build(s),ctx=cv.getContext("2d"),dpr=Math.min(2,devicePixelRatio||1),W=cv.clientWidth,H=cv.clientHeight;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
  const pr=b.prof,mn=Math.min(...pr),mx=Math.max(...pr),span=Math.max(mx-mn,Math.max(12,s.gain*.6)),base=mn-(span-(mx-mn))*(mx-mn<1?.5:.25);
  const L=38,R=8,T=10,B=22,x=t=>L+t*(W-L-R),y=h=>T+(1-(h-base)/span)*(H-T-B),dist=parseFloat(s.dist);
  ctx.strokeStyle=css("--line");ctx.lineWidth=1;ctx.fillStyle=css("--mute");ctx.font="500 11px "+css("--sans");
  ctx.textAlign="right";for(const h of(mx-mn>16?[mn,(mn+mx)/2,mx]:[mn,mx])){const yy=y(h);ctx.beginPath();ctx.moveTo(L,yy);ctx.lineTo(W-R,yy);ctx.stroke();
    const lab=s.peak?Math.round(s.peak-(mx-h)):Math.round(h-mn);ctx.fillText(s.peak?`${lab}m`:`+${lab}m`,L-5,yy+4)}
  ctx.textAlign="center";const steps=dist<=2?[0,.5,1]:[0,.25,.5,.75,1];for(const t of steps){ctx.fillText((dist*t).toFixed(dist<5?1:0)+" km",Math.min(W-R-14,Math.max(L+14,x(t))),H-5)}
  const g=ctx.createLinearGradient(0,T,0,H-B);const rc=css("--run");g.addColorStop(0,rc+"55");g.addColorStop(1,rc+"08");
  ctx.beginPath();ctx.moveTo(x(0),H-B);pr.forEach((h,i)=>ctx.lineTo(x(b.cum[i]),y(h)));ctx.lineTo(x(1),H-B);ctx.closePath();ctx.fillStyle=g;ctx.fill();
  ctx.beginPath();pr.forEach((h,i)=>i?ctx.lineTo(x(b.cum[i]),y(h)):ctx.moveTo(x(0),y(h)));ctx.strokeStyle=rc;ctx.lineWidth=2.2;ctx.stroke();
  const im=pr.indexOf(mx);ctx.fillStyle=rc;ctx.beginPath();ctx.arc(x(b.cum[im]),y(mx),3.5,0,7);ctx.fill()}

/* ---------- UI ---------- */
const ZONES={tc:[["all","全部"],["xitun","西屯"],["beitun","北屯"],["nantun","南屯"],["central","中區"],["tanya","潭子・大雅"],["shancheng","豐原・山城"]],
 tp:[["all","全部"],["daan","大安"],["zz","中正・萬華"],["ss","中山・松山"],["dt","大同・士林"],["xy","信義"],["ws","文山"],["bt","北投・陽明山"]],
 ks:[["all","全部"],["gs","鼓山"],["qj","前金・苓雅"],["zy","左營"],["fs","鳳山"],["ns","鳥松"],["gsn","岡山"]]};
let city="tc",cat="all",zone="all",cur="central",yaw=.6;
try{const s=JSON.parse(localStorage.getItem("tcrun")||"{}");if(s.cur&&SPOTS.some(x=>x.id===s.cur))cur=s.cur;if(s.cat)cat=s.cat;if(s.zone)zone=s.zone;if(s.city)city=s.city}catch(e){}
const H0=location.hash.slice(1),HC={taipei:"tp",taichung:"tc",kaohsiung:"ks"};if(HC[H0]&&HC[H0]!==city){city=HC[H0];zone="all";cat="all";cur=""}
if(!SPOTS.some(x=>x.id===cur&&x.city===city))cur="";
const RM=matchMedia("(prefers-reduced-motion:reduce)").matches;
const maps=q=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q);
const save=()=>{try{localStorage.setItem("tcrun",JSON.stringify({cur,cat,zone,city}))}catch(e){}};
function detailHTML(s){const est=f=>f?"約":"";const word=s.gain>=150?"大爬升":s.gain>=30?"緩起伏":"平路";
  return`<div class="dh"><div><h2>${s.n}</h2><p>${s.area}・${s.type}</p></div><a class="nav" href="${maps(s.q)}" target="_blank" rel="noopener">導航</a></div>
  <div class="terrain"><canvas aria-label="${s.n} 地形示意圖"></canvas><span class="tag">TERRAIN</span><span class="hint">左右拖曳旋轉</span></div>
  <div class="stats"><div class="st"><small>${est(s.distEst)}距離</small><b>${s.dist}<em>km</em></b></div><div class="st"><small>${est(s.gainEst)}爬升</small><b>${s.gain}<em>m</em></b></div>
  ${s.grade?`<div class="st"><small>平均坡度</small><b>${s.grade}<em>%</em></b></div><div class="st"><small>最高點</small><b>${s.peak}<em>m</em></b></div>`:`<div class="st"><small>地形</small><b class="t">${word}</b></div><div class="st"><small>路面</small><b class="t">${s.cat.includes("trail")?"土徑石階":"鋪面"}</b></div>`}</div>
  <div class="prof"><h3>高度剖面</h3><canvas aria-label="${s.n} 高度剖面示意"></canvas></div>
  <div class="info"><div><h3>距離</h3><p>${s.distNote}${s.distEst?` ${s.dist} km`:""}</p></div><div><h3>路面</h3><p>${s.surface}</p></div><div><h3>建議時段</h3><p>${s.time}</p></div><div><h3>廁所／補給</h3><p>${s.supply}</p></div></div>
  <div class="chips">${s.workout.map(w=>`<span>${w}</span>`).join("")}</div>
  <div class="tip"><b>跑者筆記</b>${s.tip}</div>`}
const D=document.getElementById("detail");let tc=null,pc=null,curSpot=null,raf=0,spin=0;
function frame(){raf=0;if(tc&&curSpot)drawTerrain(tc,curSpot,yaw,false)}
const req=()=>{if(!raf)raf=requestAnimationFrame(frame)};
function showDetail(s,animate){curSpot=s;const go=()=>{D.innerHTML=detailHTML(s);tc=D.querySelector(".terrain canvas");pc=D.querySelector(".prof canvas");bindDrag();
    drawProfile(pc,s);if(animate&&!RM){const y0=yaw-.9,t0=performance.now();cancelAnimationFrame(spin);const step=t=>{const k=Math.min(1,(t-t0)/650),e=1-Math.pow(1-k,3);yaw=y0+.9*e;drawTerrain(tc,s,yaw,false);if(k<1)spin=requestAnimationFrame(step)};spin=requestAnimationFrame(step)}else frame();D.classList.remove("swap")};
  if(animate&&!RM&&D.innerHTML){D.classList.add("swap");setTimeout(go,120)}else go()}
function bindDrag(){let on=false,lx=0;tc.addEventListener("pointerdown",e=>{on=true;lx=e.clientX;cancelAnimationFrame(spin);tc.setPointerCapture(e.pointerId);tc.style.cursor="grabbing"});
  tc.addEventListener("pointermove",e=>{if(!on)return;yaw+=(e.clientX-lx)*.012;lx=e.clientX;req()});
  const up=()=>{on=false;tc.style.cursor=""};tc.addEventListener("pointerup",up);tc.addEventListener("pointercancel",up)}
const inZone=(s,z)=>s.city===city&&(z==="all"||s.zone.includes(z)),inCat=(s,c)=>c==="all"||s.cat.includes(c);
function renderFilters(){document.getElementById("cities").innerHTML=CITIES.map(([k,l])=>`<button type="button" class="c" aria-pressed="${k===city}" data-k="${k}">${l}<small>${SPOTS.filter(s=>s.city===k).length}</small></button>`).join("");
  const cc=CITIES.find(c=>c[0]===city);
  document.getElementById("zones").innerHTML=ZONES[city].filter(([k])=>SPOTS.some(s=>inZone(s,k))).map(([k,l])=>`<button type="button" class="f" aria-pressed="${k===zone}" data-z="${k}">${l}<small>${SPOTS.filter(s=>inZone(s,k)).length}</small></button>`).join("");
  document.getElementById("filters").innerHTML=CATS.filter(([k])=>k==="all"||SPOTS.some(s=>inZone(s,zone)&&inCat(s,k))).map(([k,l])=>`<button type="button" class="f" aria-pressed="${k===cat}" data-c="${k}">${l}</button>`).join("")}
function renderList(){const vis=SPOTS.filter(s=>inZone(s,zone)&&inCat(s,cat));if(!vis.length){if(cat!=="all")cat="all";else zone="all";return renderList()}if(!vis.some(s=>s.id===cur))cur=vis[0].id;const L=document.getElementById("list");
  L.innerHTML=vis.map(s=>`<button type="button" class="spot" data-id="${s.id}" aria-pressed="${s.id===cur}"><canvas aria-hidden="true"></canvas><div><b>${s.n}</b><span><span class="k">${s.distEst?"~":""}${s.dist} KM</span>　<span class="k">↑ ${s.gain} M</span></span></div></button>`).join("");
  L.querySelectorAll(".spot").forEach(b=>drawTerrain(b.querySelector("canvas"),SPOTS.find(x=>x.id===b.dataset.id),.6,true))}
function select(id,animate){if(id===cur&&curSpot&&curSpot.id===id)return;cur=id;save();
  document.querySelectorAll(".spot").forEach(b=>b.setAttribute("aria-pressed",b.dataset.id===cur));
  const btn=document.querySelector(`.spot[data-id="${cur}"]`);if(btn&&innerWidth<=860)btn.scrollIntoView({behavior:RM?"auto":"smooth",block:"nearest",inline:"center"});
  showDetail(SPOTS.find(x=>x.id===cur),animate)}
document.getElementById("cities").addEventListener("click",e=>{const b=e.target.closest(".c");if(!b||b.dataset.k===city)return;city=b.dataset.k;zone="all";cat="all";cur="";curSpot=null;try{history.replaceState(null,"","#"+{tp:"taipei",tc:"taichung",ks:"kaohsiung"}[city])}catch(err){}refilter()});
function refilter(){if(!SPOTS.some(s=>inZone(s,zone)&&inCat(s,cat)))cat="all";save();renderFilters();renderList();if(!curSpot||curSpot.id!==cur)showDetail(SPOTS.find(x=>x.id===cur),true)}
document.getElementById("zones").addEventListener("click",e=>{const b=e.target.closest(".f");if(!b||b.dataset.z===zone)return;zone=b.dataset.z;refilter()});
document.getElementById("filters").addEventListener("click",e=>{const b=e.target.closest(".f");if(!b||b.dataset.c===cat)return;cat=b.dataset.c;refilter()});
document.getElementById("list").addEventListener("click",e=>{const b=e.target.closest(".spot");if(b)select(b.dataset.id,true)});
let rt;addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{renderList();if(curSpot){frame();drawProfile(pc,curSpot)}},150)});
renderFilters();renderList();showDetail(SPOTS.find(x=>x.id===cur),false);
</script>
