<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@900&family=LXGW+WenKai+TC:wght@400;700&display=swap">
<style>
/* Layout: Taiwanese stir-fry stall. Charcoal kitchen, red-and-yellow shop signage, a cool-lit fridge interior, a wooden prep board, a live stove canvas, and a paper recipe card at the end. Single committed dark look. */
:root{
  --bg:#16110d;--panel:#211913;--panel2:#2c221a;--line:#3d3027;--ink:#f7efe4;--mute:#b9a896;--dim:#7d6e60;
  --red:#d7261e;--redD:#9e160f;--yel:#ffcf3a;--ok:#6cc070;--warn:#f0a03a;--bad:#ef5350;
  --fridge:#eaf2f5;--fridge2:#d5e3e9;--fink:#1f2d33;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC","Songti TC",serif;--hand:"LXGW WenKai TC","Kaiti TC","STKaiti",serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
input,textarea,[contenteditable]{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,.tile:focus-visible{outline:2px solid var(--yel);outline-offset:2px}
.scr{min-height:100%;display:flex;flex-direction:column}
.wrap{width:100%;max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:env(safe-area-inset-top,0px)}
.topin{display:flex;align-items:center;gap:10px;padding-block:10px}
.topin h2{margin:0;font-size:18px;font-weight:900;flex:1}
.back{border:0;background:var(--panel2);border-radius:12px;width:40px;height:40px;font-size:18px}
.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:900;font-size:16px;background:var(--panel2);min-height:48px}
.btn.pri{background:var(--red);color:#fff;box-shadow:0 4px 0 var(--redD)}
.btn.pri:active{transform:translateY(3px);box-shadow:0 1px 0 var(--redD)}
.btn.yel{background:var(--yel);color:#2a1d10;box-shadow:0 4px 0 #b88c14}
.btn:disabled{opacity:.4}
.bar{position:sticky;bottom:0;z-index:5;background:linear-gradient(transparent,var(--bg) 30%);padding-top:18px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.barin{display:flex;gap:10px;align-items:center}
.barin .btn.pri{flex:1}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;display:grid;gap:6px;pointer-events:none;width:min(92vw,420px)}
.toast div{background:#000d;border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:700;font-size:14px;text-align:center;animation:tin .25s ease both}
@keyframes tin{from{opacity:0;transform:translateY(6px)}}

#askM .rbtns .btn{grid-column:1/3}
.steps{display:flex;gap:4px;padding-bottom:8px;font-size:12px;font-weight:700}
.steps button{flex:1;border:0;border-radius:999px;padding:4px 0;background:var(--panel2);color:var(--dim)}
.steps button.on{background:var(--yel);color:#2a1d10}
.steps button.done{color:var(--ink)}
#fridge .steps button{background:#fff;color:#9fb1b8}#fridge .steps button.done{color:var(--fink)}#fridge .steps button.on{background:var(--fink);color:#fff}
/* title */
#tbg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.55}
#title{justify-content:center;background:
  linear-gradient(90deg,#ffffff06 1px,transparent 1px) 0 0/44px 44px,linear-gradient(#ffffff06 1px,transparent 1px) 0 0/44px 44px,var(--bg)}
.sign{margin:0 auto;background:var(--red);border:6px solid var(--yel);border-radius:10px;padding:18px 26px 22px;text-align:center;box-shadow:0 0 0 6px var(--red),0 20px 50px #0008;transform:rotate(-1.5deg)}
.sign small{display:block;font:900 20px var(--sans);color:var(--yel);letter-spacing:.3em}
.sign b{display:block;font:900 clamp(64px,20vw,96px)/1.05 var(--serif);color:#fff;letter-spacing:.06em;text-shadow:0 4px 0 #0004}
.tdesc{text-align:center;color:var(--mute);margin:30px auto 0;max-width:24em}
.tbtns{display:grid;gap:12px;margin:26px auto 0;max-width:340px}
.tnote{text-align:center;color:var(--dim);font-size:12.5px;margin-top:18px}

/* fridge */
#fridge{background:var(--fridge);color:var(--fink)}
#fridge .top{background:var(--fridge)}
#fridge .back{background:var(--fridge2);color:var(--fink)}
.search{flex:1;border:0;border-radius:12px;background:#fff;padding:10px 14px;font:500 15px var(--sans);color:var(--fink);min-width:0;box-shadow:inset 0 0 0 1.5px var(--fridge2)}
.cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;border:0;background:#fff;color:var(--fink);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;box-shadow:inset 0 0 0 1.5px var(--fridge2)}
.cat[aria-pressed="true"]{background:var(--fink);color:#fff;box-shadow:none}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;padding:12px 0 6px;border-bottom:6px solid #c9d8df;margin-bottom:14px}
.tile{position:relative;border:0;background:#fff;border-radius:16px;padding:8px 6px 8px;display:grid;justify-items:center;gap:2px;box-shadow:0 2px 0 #c3d3da;color:var(--fink);min-height:104px}
.tile .ic{font-size:40px;line-height:1.2;height:60px;display:grid;place-items:center}
.tile .nm{font-weight:700;font-size:13.5px;line-height:1.3;text-align:center}
.tile .un{font-size:11px;color:#6b7f88}
.tile[aria-pressed="true"]{background:#fff6d6;box-shadow:0 0 0 2.5px var(--red),0 2px 0 #c3d3da}
.tile .qb{position:absolute;right:6px;top:6px;background:var(--red);color:#fff;border-radius:999px;font-size:11px;font-weight:900;padding:0 7px;line-height:20px}
.icimg{width:62px;height:62px;display:block;object-fit:contain}
.row .icimg{width:46px;height:46px;margin:0 auto}.tr .icimg{width:38px;height:38px}.basket .icimg{width:26px;height:26px;display:inline-block;vertical-align:middle}
.chipi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font:900 16px var(--sans);color:#fff;text-shadow:0 1px 2px #0006}
.shname{font-weight:900;font-size:15px;color:#4a5e66;margin-top:4px}
#fridge .bar{background:linear-gradient(transparent,var(--fridge) 30%)}
.basket{flex:1;display:flex;gap:2px;overflow:hidden;font-size:22px;min-width:0;white-space:nowrap}
.doors{position:fixed;inset:0;z-index:40;pointer-events:none;perspective:1400px;display:flex}
.door{flex:1;background:linear-gradient(90deg,#f4f7f8,#dfe8ec);border:1px solid #c9d6dc;transition:transform .8s cubic-bezier(.6,.05,.3,1);position:relative}
.door.l{transform-origin:left center}.door.r{transform-origin:right center}
.door::after{content:"";position:absolute;top:38%;width:10px;height:120px;border-radius:6px;background:#b8c6cc}
.door.l::after{right:18px}.door.r::after{left:18px}
.doors.open .door.l{transform:rotateY(-100deg)}.doors.open .door.r{transform:rotateY(100deg)}

/* prep */
#prep{background:
  repeating-linear-gradient(90deg,#00000010 0 2px,transparent 2px 46px),linear-gradient(#8a5a33,#73482a)}
#prep .top{background:#7a4d2d}
.rows{display:grid;gap:10px;padding-block:10px 4px}
.row{background:#fffaf1;color:#2a1d10;border-radius:16px;padding:12px;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:4px 10px;align-items:center;box-shadow:0 3px 0 #0003}
.row .ic{font-size:30px;text-align:center}
.row b{font-size:16px}
.row .g{font-size:12px;color:#7a6650}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:36px;height:36px;border-radius:10px;border:0;background:#f0e3cc;font-size:20px;font-weight:900;color:#2a1d10}
.qty span{min-width:62px;text-align:center;font-weight:900;font-size:15px;font-variant-numeric:tabular-nums}
.cuts{grid-column:2/4;display:flex;gap:6px;flex-wrap:wrap}
.cuts button{border:0;border-radius:999px;padding:4px 11px;font-size:13px;font-weight:700;background:#f0e3cc;color:#5a4630}
.cuts button[aria-pressed="true"]{background:#2a1d10;color:#fff}
.rm{border:0;background:none;color:#a08a70;font-size:18px;width:30px;height:30px}
.hint{background:#0004;border-radius:12px;padding:10px 12px;font-size:13.5px;color:#fff1dc;margin-top:6px}

/* cook */
#cook{background:radial-gradient(ellipse at 50% 30%,#2a2019,var(--bg) 70%)}
.hud{display:flex;gap:8px;align-items:center;font-variant-numeric:tabular-nums}
.pill{background:var(--panel2);border-radius:999px;padding:4px 12px;font-weight:900;font-size:14px;white-space:nowrap}
.pill.t{color:var(--yel)}
.tools{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:6px}
.tools::-webkit-scrollbar{display:none}
.tool{flex:none;border:1.5px solid var(--line);background:var(--panel);border-radius:12px;padding:6px 12px;font-weight:700;font-size:14px}
.tool[aria-pressed="true"]{border-color:var(--yel);color:var(--yel)}
.stage{position:relative;display:grid;place-items:center}
#cv{width:100%;max-width:440px;aspect-ratio:1;touch-action:none;display:block}
.donen{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-height:40px;padding-block:4px}
.donen::-webkit-scrollbar{display:none}
.dn{flex:none;background:var(--panel);border-radius:10px;padding:4px 9px;font-size:12px;font-weight:700;display:grid;gap:3px;min-width:76px}
.dn i{display:block;height:5px;border-radius:3px;background:#3a2e25;overflow:hidden}
.dn i span{display:block;height:100%}
.heat{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;margin-top:6px}
.heat b{font-size:13px;color:var(--mute);font-weight:700}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:36px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:12px;border-radius:6px;background:linear-gradient(90deg,#3b6bff,#ffb03a,#ff3b1f)}
input[type=range]::-moz-range-track{height:12px;border-radius:6px;background:linear-gradient(90deg,#3b6bff,#ffb03a,#ff3b1f)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;border-radius:50%;background:#fff;border:4px solid #2a1d10;margin-top:-11px;box-shadow:0 2px 6px #0008}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;border:4px solid #2a1d10}
.hv{font-weight:900;color:var(--yel);min-width:52px;text-align:right}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.acts .btn{padding:10px 4px;font-size:14px;display:grid;justify-items:center;gap:0;line-height:1.3}
.acts .btn span{font-size:20px}
.acts .btn[aria-pressed="true"]{background:var(--yel);color:#2a1d10}
.tray{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-block:10px 2px}
.tray::-webkit-scrollbar{display:none}
.tr{flex:none;border:1.5px dashed var(--line);background:var(--panel);border-radius:14px;padding:6px 10px;display:grid;justify-items:center;min-width:72px}
.tr .ic{font-size:26px}
.tr small{font-size:11.5px;color:var(--mute);white-space:nowrap}
.tr b{font-size:12.5px;white-space:nowrap}
.trh{font-size:12.5px;color:var(--mute);margin-top:8px}

#cook{height:100%;min-height:0;overflow:hidden}
#cook .top{position:static;flex:none}
#cook [data-steps]{display:none}
#cook .topin{padding-block:8px 6px}
.cookbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
#cook .stage{flex:1;min-height:150px;position:relative;display:flex;justify-content:center;align-items:center}
#cv{width:100%;height:100%;object-fit:contain;max-width:none;aspect-ratio:auto}
#cook .donen{position:absolute;left:0;right:0;bottom:0;padding-inline:2px;pointer-events:auto}
#cook .dn{background:rgba(33,25,19,.88)}
#cook .tray{padding-block:0;flex:none}
#cook .trh{margin:0;flex:none}
#cook .heat{margin:0;flex:none}
#cook .acts{grid-template-columns:repeat(5,1fr);gap:6px;margin:0;flex:none}
#cook .acts .btn{padding:7px 2px;font-size:13px;min-height:52px}
#cook .acts .btn span{font-size:18px}
#cook .tools{padding-bottom:4px}
#cook .tools.gone{display:none}
.tip{flex:none;background:rgba(255,207,58,.12);border:1px solid rgba(255,207,58,.35);color:var(--yel);border-radius:12px;padding:5px 12px;font-size:13.5px;font-weight:700;text-align:center;animation:tin .25s ease}
.tip.warn{background:rgba(239,83,80,.15);border-color:rgba(239,83,80,.5);color:#ff8a80}
/* plate & result */
.plates{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.plate{border:1.5px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 2px;font-size:12px;font-weight:700;display:grid;justify-items:center;gap:2px}
.plate[aria-pressed="true"]{border-color:var(--yel);color:var(--yel)}
.plate i{font-style:normal;font-size:22px}
#pc,#rc{width:100%;max-width:440px;aspect-ratio:1;display:block;margin:0 auto}
.dish{display:grid;gap:12px;padding-bottom:10px}
.nameBox{display:flex;gap:8px;align-items:center}
.nameBox input{flex:1;min-width:0;background:transparent;border:0;border-bottom:2px dashed var(--line);color:var(--ink);font:700 clamp(26px,7.4vw,34px)/1.3 var(--hand);padding:4px 0}
.dice{border:0;background:var(--panel2);border-radius:12px;width:46px;height:46px;font-size:22px;flex:none}
.alts{display:flex;gap:6px;flex-wrap:wrap}
.alts button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;font:500 14px var(--hand);color:var(--ink)}
.by{display:flex;gap:8px;align-items:center;color:var(--mute)}
.by input{flex:1;min-width:0;background:var(--panel);border:1.5px solid var(--line);border-radius:10px;color:var(--ink);font:700 15px var(--sans);padding:8px 10px}
.score{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center;background:var(--panel);border-radius:18px;padding:14px 16px}
.score.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}@keyframes pop{0%{transform:scale(.92)}100%{transform:none}}
#conf{position:fixed;inset:0;z-index:45;pointer-events:none;width:100%;height:100%}
.score .n{grid-row:1/3;font:900 54px/1 var(--serif);color:var(--yel)}
.score .tier{font-weight:900;font-size:18px}
.score .st{color:var(--yel);letter-spacing:2px}
.cmt{background:#fffaf1;color:#2a1d10;border-radius:16px;padding:14px 16px;font:500 16px/1.7 var(--hand);position:relative}
.cmt b{font-family:var(--sans);font-size:12px;color:#a0281e;display:block;margin-bottom:4px;letter-spacing:.1em}
.flv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px;background:var(--panel);border-radius:16px;padding:12px 16px}
.fl{display:grid;grid-template-columns:30px 1fr 52px;gap:8px;align-items:center;font-size:13px}
.fl i{display:block;height:8px;border-radius:4px;background:#3a2e25;overflow:hidden}
.fl i span{display:block;height:100%;border-radius:4px}
.fl em{font-style:normal;color:var(--mute);font-size:12px;text-align:right}
.like{background:var(--panel);border-radius:16px;padding:12px 16px;font-size:14.5px}
.like b{color:var(--yel)}
.rbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rbtns .btn.pri{grid-column:1/3}
.modal{position:fixed;inset:0;z-index:50;background:#000d;display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.mbox{width:min(100%,460px);display:grid;gap:12px}
.mbox img{width:100%;border-radius:12px;box-shadow:0 20px 60px #000}
.mbox p{margin:0;text-align:center;color:var(--mute);font-size:13px}
.book{display:grid;gap:10px;max-height:70vh;overflow-y:auto}
.bk{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;background:var(--panel);border-radius:14px;padding:8px;border:0;text-align:left;width:100%}
.bk img{width:64px;height:64px;border-radius:10px;object-fit:cover}
.bk b{font:700 17px var(--hand)}
.bk small{display:block;color:var(--mute)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>


<!-- TITLE -->
<section class="scr" id="title"><canvas id="tbg" aria-hidden="true"></canvas><div class="wrap" style="padding-block:40px;position:relative;z-index:1">
  <div class="sign"><small>拿出你的</small><b>手路菜</b></div>
  <p class="tdesc">冰箱裡有 230 種食材。份量、刀工、火候都由你決定，煮出只屬於你的一道菜，再拿食譜卡去炫耀。</p>
  <div class="tbtns"><button class="btn pri" id="goFridge" type="button">打開冰箱</button><button class="btn" id="goBook" type="button">我的食譜本</button></div>
  <p class="tnote">建議開聲音。作品只存在你自己的手機。</p>
</div></section>

<!-- FRIDGE -->
<section class="scr" id="fridge" hidden>
  <div class="top"><div class="wrap"><div class="topin"><button class="back" data-back type="button" aria-label="上一步">←</button><input class="search" id="q" type="search" placeholder="找食材：雞腿、九層塔、可樂…" autocomplete="off"></div>
  <div class="steps" data-steps></div><div class="cats" id="cats"></div></div></div>
  <div class="wrap" id="shelves" style="flex:1"></div>
  <div class="bar"><div class="wrap barin"><div class="basket" id="basket"></div><button class="btn pri" id="toPrep" type="button" style="flex:none">備料 →</button></div></div>
</section>
<div class="doors" id="doors" hidden><div class="door l"></div><div class="door r"></div></div>

<!-- PREP -->
<section class="scr" id="prep" hidden>
  <div class="top"><div class="wrap"><div class="topin"><button class="back" data-back type="button" aria-label="上一步">←</button><h2>砧板：份量和刀工</h2></div><div class="steps" data-steps></div></div></div>
  <div class="wrap" style="flex:1"><div class="rows" id="rows"></div><div class="hint" id="phint"></div></div>
  <div class="bar"><div class="wrap barin"><button class="btn" data-go="fridge" type="button">再拿</button><button class="btn pri" id="toCook" type="button">開火 →</button></div></div>
</section>

<!-- COOK -->
<section class="scr" id="cook" hidden>

function cutsFor(i){if(!has(i,"c"))return null;
  if(i.n==="蔥")return["section","flower"];
  if(i.n==="蒜苗")return["section","slice"];
  if(i.n==="乾魷魚")return["strip","slice","shred"];
  if(i.cat==="aro")return["whole","smash","slice","mince"].filter(c=>i.n==="蒜頭"||c!=="smash");
  if(i.n==="檸檬"||i.n==="萊姆")return["juice","slice"];
  if(i.cat==="fruit")return["chunk","slice","dice"];
  if(i.cat==="egg")return["chunk","dice"];
  return["chunk","slice","shred","dice","whole"]}
function defaultCut(i){const c=cutsFor(i);if(!c)return null;if(i.n==="蒜頭")return"mince";if(i.n==="蔥"||i.n==="蒜苗")return"section";if(i.cat==="aro")return"slice";if(i.n==="檸檬"||i.n==="萊姆")return"juice";return c[0]}

  case"noodles":{I.shadow(g,48,86,30,5);g.strokeStyle=c;g.lineCap="round";const w=2+(a||1)*1.4;for(let j=0;j<12;j++){g.lineWidth=w;g.strokeStyle=S(c,(j%3-1)*.12);g.beginPath();g.moveTo(22,40+j*3);g.bezierCurveTo(40,30+j*4,56,52+j*2,76,40+j*3);g.stroke()}g.fillStyle="#d7261e";g.fillRect(44,32,8,40);return}

  case"citrus":{I.shadow(g,48,84,28,5);g.fillStyle=I.rg(g,40,56,22,c,.35,.3);g.beginPath();g.arc(40,56,22,0,7);g.fill();g.fillStyle="#e9f5c8";g.beginPath();g.arc(62,58,17,0,7);g.fill();g.fillStyle=S(c,.1);for(let j=0;j<8;j++){const an=j/8*6.283;g.beginPath();g.moveTo(62,58);g.arc(62,58,14,an+.08,an+.7);g.closePath();g.fill()}return}
  case"curry":{I.shadow(g,48,84,30,5);for(let j=0;j<2;j++)for(let q=0;q<3;q++){const x=26+q*16,y=42+j*16;g.fillStyle=I.sh(c,-.2);g.beginPath();g.roundRect(x,y+3,15,14,3);g.fill();g.fillStyle=I.rg(g,x+7,y+6,10,c,.3,.15);g.beginPath();g.roundRect(x,y,15,13,3);g.fill()}return}

  case"burdock":{I.shadow(g,48,86,32,4);for(let j=0;j<2;j++){g.save();g.translate(48,48+j*14);g.rotate(-.4);g.fillStyle=I.lg(g,0,-5,0,5,[[0,"#9a7a56"],[1,"#5a3e24"]]);g.beginPath();g.moveTo(-40,-4);g.lineTo(38,-2);g.lineTo(40,2);g.lineTo(-40,4);g.closePath();g.fill();g.restore()}return}

<script>
"use strict";
const $=s=>document.querySelector(s);
const cl=(v,a=0,b=1)=>v<a?a:v>b?b:v;
const R=()=>Math.random();
function toast(m){const t=$("#toast"),d=document.createElement("div");d.textContent=m;t.appendChild(d);while(t.children.length>2)t.firstChild.remove();setTimeout(()=>d.remove(),2200)}
function hex(c){const n=parseInt(c.slice(1),16);return[n>>16&255,n>>8&255,n&255]}
function mix(a,b,t){const A=typeof a==="string"?hex(a):a,B=typeof b==="string"?hex(b):b;return A.map((v,i)=>Math.round(v+(B[i]-v)*cl(t)))}
const rgb=(c,al=1)=>`rgba(${c[0]},${c[1]},${c[2]},${al})`;
function icon(i){return typeof iconHTML==="function"?iconHTML(i):(i.e||"•")}

/* ---------- screens ---------- */
let screen="title";
const FLOW=["title","fridge","prep","cook","plate","result"],FLOWN=["","冰箱","砧板","開火","擺盤","成品"];
const NAV=["title"];let suppress=false;
function show(id,quiet){document.querySelectorAll(".scr").forEach(s=>s.hidden=s.id!==id);screen=id;scrollTo(0,0);
  if(id==="fridge")renderFridge();if(id==="prep")renderPrep();if(id==="cook")enterCook();if(id==="plate")renderPlate();renderSteps();
  if(!quiet){NAV.push(id);try{location.hash=id==="title"?"top":id}catch(e){}}}
function renderSteps(){const k=FLOW.indexOf(screen);document.querySelectorAll("[data-steps]").forEach(el=>{el.innerHTML=FLOWN.slice(1).map((n,j)=>{const idx=j+1;return`<button type="button" data-step="${idx}" class="${idx===k?"on":idx<k?"done":""}" ${idx>=k?"tabindex='-1'":""}>${idx}・${n}</button>`}).join("")})}
function ask(t,p,yes,cb){$("#askT").textContent=t;$("#askP").textContent=p;$("#askYes").textContent=yes;$("#askM").hidden=false;$("#askYes").onclick=()=>{$("#askM").hidden=true;cb(true)};$("#askNo").onclick=()=>{$("#askM").hidden=true;cb(false)}}
function needsAsk(ti){return FLOW.indexOf(screen)>=3&&ti<=2&&P&&P.items.length}
function perform(target){const ti=FLOW.indexOf(target);if(ti<=2&&P)P=null;if(ti===3&&P)P.log=P.log.filter(e=>e.k!=="end");while(NAV.length>1&&NAV[NAV.length-1]!==target)NAV.pop();if(NAV[NAV.length-1]!==target)NAV.push(target);SND.click();show(target,true)}
function askThen(ti,cb){if(!needsAsk(ti))return cb(true);ask(ti===0?"回首頁？":"回去重新備料？",ti===0?"鍋裡的料理會倒掉，籃子裡的食材會保留。":"鍋裡的東西會倒掉，砧板上的食材和份量會保留，可以重新下鍋。","倒掉，回去",cb)}
/* in-app back to an earlier step */
function goBack(target){const cur=FLOW.indexOf(screen),ti=FLOW.indexOf(target);if(ti<0||ti>=cur)return;
  askThen(ti,ok=>{if(!ok)return;const prev=NAV[NAV.length-2];perform(target);
    if(prev===target){suppress=true;history.back()}else{try{history.replaceState(null,"","#"+(target==="title"?"top":target))}catch(e){}}})}
function back(){const cur=FLOW.indexOf(screen);if(cur>0)goBack(FLOW[cur-1])}
document.addEventListener("click",e=>{const b=e.target.closest("[data-go]");if(b){SND.click();show(b.dataset.go);return}
  if(e.target.closest("[data-back]")){back();return}const st=e.target.closest("[data-step]");if(st)goBack(FLOW[+st.dataset.step])});
addEventListener("hashchange",()=>{if(suppress){suppress=false;return}let h=location.hash.slice(1);if(h==="top"||!h)h="title";if(h===screen)return;
  const ti=FLOW.indexOf(h),cur=FLOW.indexOf(screen);
  if(ti>-1&&ti<cur){askThen(ti,ok=>{if(ok)perform(h);else{try{location.hash=screen}catch(e){}NAV.push(screen)}})}
  else{try{history.replaceState(null,"","#"+(screen==="title"?"top":screen))}catch(e){}}});

/* ---------- basket ---------- */
const basket=new Map(); // id -> {q, cut}
function grams(i,q){return i.gpu*q}
function amt(i,q){return i.unit==="g"||i.unit==="ml"?`${q}${i.unit}`:`${q} ${i.unit}`}
function amtG(i,q){const g=grams(i,q);return i.unit==="g"||i.unit==="ml"?"":`≈${Math.round(g)}${has(i,"l")?"ml":"g"}`}

/* ---------- fridge ---------- */
let curCat="meat";
$("#goFridge").onclick=()=>{SND.init();SND.fridge();const d=$("#doors");d.hidden=false;d.classList.remove("open");show("fridge");requestAnimationFrame(()=>requestAnimationFrame(()=>d.classList.add("open")));setTimeout(()=>d.hidden=true,900)};
function tileIcon(i){return`<span class="ic">${iconHTML(i)}</span>`}
function renderFridge(){const q=$("#q").value.trim();
  $("#cats").innerHTML=CATS.map(([k,l])=>`<button class="cat" type="button" data-c="${k}" aria-pressed="${!q&&k===curCat}">${l}</button>`).join("");
  const list=q?ING.filter(i=>i.n.includes(q)):ING.filter(i=>i.cat===curCat);
  const sh=$("#shelves");
  sh.innerHTML=(q?`<div class="shname">找到 ${list.length} 樣</div>`:"")+`<div class="shelf">${list.map(i=>{const b=basket.get(i.id);return`<button class="tile" type="button" data-id="${i.id}" aria-pressed="${!!b}">${b?`<span class="qb">${amt(i,b.q)}</span>`:""}${tileIcon(i)}<span class="nm">${i.n}</span><span class="un">${i.unit==="g"||i.unit==="ml"?"":"1"+i.unit}</span></button>`}).join("")}</div>`+(list.length?"":`<p style="color:#6b7f88">冰箱裡沒有這個。換個說法試試。</p>`);
  renderBasket()}
function renderBasket(){const ids=[...basket.keys()];$("#basket").innerHTML=ids.length?ids.map(id=>`<span>${icon(ING[id])}</span>`).join(""):`<span style="font-size:14px;color:#6b7f88">點食材放進籃子</span>`;$("#toPrep").textContent=`備料 (${ids.length}) →`;$("#toPrep").disabled=!ids.length}

  function silent(){const n=4410,b=new ArrayBuffer(44+n*2),v=new DataView(b);const w=(o,s)=>[...s].forEach((ch,i)=>v.setUint8(o+i,ch.charCodeAt(0)));w(0,"RIFF");v.setUint32(4,36+n*2,true);w(8,"WAVEfmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,44100,true);v.setUint32(28,88200,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,"data");v.setUint32(40,n*2,true);return URL.createObjectURL(new Blob([b],{type:"audio/wav"}))}
  function init(){if(ac){if(ac.state!=="running")ac.resume().catch(()=>{});return}try{if(navigator.audioSession)navigator.audioSession.type="playback"}catch(e){}try{el=new Audio(silent());el.loop=true;el.play().catch(()=>{})}catch(e){}
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return;ac=new C();m=ac.createGain();m.gain.value=.8;m.connect(ac.destination);
    const buf=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate),d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(Math.random()<.02?3:1);
    siz=ac.createBufferSource();siz.buffer=buf;siz.loop=true;const f=ac.createBiquadFilter();f.type="highpass";f.frequency.value=2500;sizG=ac.createGain();sizG.gain.value=0;siz.connect(f);f.connect(sizG);sizG.connect(m);siz.start();upd()}
  const tone=(f,d=.15,v=.15,type="sine",dt=0,f2)=>{if(!ac||muted)return;const t=ac.currentTime+dt,o=ac.createOscillator(),gn=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);gn.gain.setValueAtTime(.0001,t);gn.gain.exponentialRampToValueAtTime(v,t+.008);gn.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(gn);gn.connect(m);o.start(t);o.stop(t+d+.05)};
  const noise=(d=.1,v=.2,lo=500,hi=4000,dt=0)=>{if(!ac||muted)return;const t=ac.currentTime+dt,n=ac.createBufferSource(),b=ac.createBuffer(1,Math.max(1,ac.sampleRate*d),ac.sampleRate),c=b.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=Math.random()*2-1;n.buffer=b;const f=ac.createBiquadFilter();f.type="bandpass";f.frequency.value=(lo+hi)/2;f.Q.value=.7;const gn=ac.createGain();gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.0001,t+d);n.connect(f);f.connect(gn);gn.connect(m);n.start(t)};
  const btn=$("#snd");function upd(){btn.textContent=muted?"🔇":ac?"🔊":"🔈"}btn.onclick=()=>{if(!ac){init();return}muted=!muted;m.gain.setTargetAtTime(muted?0:.8,ac.currentTime,.05);upd()};
  return{init,click(){tone(1100,.04,.05,"triangle")},pop(){tone(620,.08,.12,"sine",0,940)},tick(){tone(900,.03,.05,"square")},chop(){noise(.05,.35,300,1500);tone(140,.06,.15,"sine",0,80)},
    fridge(){init();tone(70,.5,.25,"sine");noise(.3,.08,200,800,.05)},drop(){tone(180,.1,.2,"sine",0,90);noise(.06,.15,400,2000)},pour(){noise(.6,.12,600,2400)},sizzleBurst(){noise(.9,.35,3000,9000)},
    stir(){noise(.2,.18,800,3000);tone(320,.05,.04,"triangle",.05)},clank(){tone(620,.25,.12,"triangle");tone(930,.2,.06,"triangle",.02)},toss(){noise(.12,.22,300,1200);tone(90,.12,.18,"sine",0,60);noise(.5,.3,2500,8000,.42)},flare(){noise(.5,.28,150,900)},rattle(){tone(1500,.03,.035,"square");tone(1250,.03,.03,"square",.05)},ignite(){init();noise(.4,.3,200,1200)},
    ding(){[1047,1319,1568].forEach((f,i)=>tone(f,.5,.1,"sine",i*.07))},fanfare(sc){const seq=sc>=85?[523,659,784,1047,1319]:sc>=60?[523,659,784]:[392,349,330];seq.forEach((f,i)=>tone(f,.45,.11,"triangle",i*.11))},
    cook(P){if(!ac)return;let v=0;if(P&&!muted){const hot=P.T>120&&P.liq<12&&P.items.length;if(hot)v=cl((P.T-120)/120)*(.12+cl(P.oil/150)*.25);}sizG.gain.setTargetAtTime(v,ac.currentTime,.1);
      if(P&&!muted&&P.T>=99&&P.liq>12){boilT-=1/60;if(boilT<=0){boilT=.05+Math.random()*.12;tone(140+Math.random()*120,.07,.05,"sine",0,320)}}}}})();
