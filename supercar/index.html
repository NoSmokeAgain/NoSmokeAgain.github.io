<title>超跑情人夢</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Noto+Sans+TC:wght@500;700;900&family=Noto+Serif+TC:wght@500;900&display=swap">
<style>
/* Layout: 台灣公路標誌語言。瀝青底、雙黃線分隔、省道盾牌標路線；比賽時全螢幕 3D，選單是一張路線圖加車庫。 */
:root{
  --asphalt:#1b1e1f; --asphalt2:#272b2c; --line:#3b4142; --fg:#f2f1ea; --mute:#a3a9a6;
  --yellow:#f6c21c; --sign:#0b6b4f; --sign2:#0e8a66; --red:#e5482f; --blue:#1f6fd1;
  --display:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --num:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--asphalt);color:var(--fg);font-family:var(--display);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
.screen{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--asphalt);z-index:20}
.wrap{max-width:1040px;margin:0 auto;padding-block:max(18px,env(safe-area-inset-top,0px)) 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:clamp(34px,7vw,56px);font-weight:900;line-height:1;letter-spacing:.01em;text-wrap:balance}
.dbl{height:7px;border-top:2px solid var(--yellow);border-bottom:2px solid var(--yellow)}
.count{font-family:var(--num);font-weight:800;font-size:22px;color:var(--yellow);font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:16px}
.panel{background:var(--asphalt2);border-radius:6px;min-width:0}
.mission{background:var(--sign);border:3px solid var(--fg);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px}
.mission .eyebrow{font-size:13px;letter-spacing:.08em;opacity:.85}
.mission h2{margin:0;font-size:24px;font-weight:900;line-height:1.25;text-wrap:balance}
.mission p{margin:0;font-size:15px;line-height:1.5}
.mission .goal{font-family:var(--num);font-weight:800;font-size:40px;line-height:1;color:var(--yellow);font-variant-numeric:tabular-nums}
.go{background:var(--yellow);color:#17190f;font-weight:900;font-size:20px;padding:13px;border-radius:6px;width:100%}
.go:hover{filter:brightness(1.08)}
#preview{width:100%;height:clamp(170px,26vh,230px);display:block}
.mapbox{padding:8px;position:relative}
.mapbox svg{display:block;width:100%;max-height:420px}
.pin{cursor:pointer}
.pin text{font-family:var(--display);font-weight:700;font-size:21px;fill:var(--fg);paint-order:stroke;stroke:var(--asphalt2);stroke-width:5px}
.pin.locked{cursor:not-allowed;opacity:.42}
.pin circle{fill:var(--yellow);stroke:var(--asphalt);stroke-width:3}
.pin.sel circle{fill:var(--red);stroke:var(--fg)}
.pin:focus-visible circle{stroke:var(--fg);stroke-width:5}
.cars{padding:6px;display:flex;flex-direction:column}
.car{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:9px 8px;text-align:left;border-bottom:1px solid var(--line);width:100%}
.car:last-child{border-bottom:0}
.car .no{font-family:var(--num);font-weight:800;font-size:22px;color:var(--mute);font-variant-numeric:tabular-nums}
.car b{font-weight:700;font-size:16px;display:block}
.car small{color:var(--mute);font-size:12.5px;display:block;line-height:1.35}
.car .t{font-family:var(--num);font-weight:800;font-size:20px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.car .t.gold{color:var(--yellow)}
.car.sel{background:var(--line);border-radius:4px}
.car.lock{opacity:.42;cursor:not-allowed}
.tier{font-size:12px;letter-spacing:.08em;color:var(--yellow);padding:12px 8px 4px;display:flex;align-items:center;gap:8px}
.shield{display:inline-flex;align-items:center;justify-content:center;background:var(--fg);color:#17190f;font-family:var(--num);font-weight:800;font-size:13px;padding:1px 7px;border-radius:9px 9px 13px 13px;letter-spacing:0}
.how{font-size:14px;line-height:1.7;color:var(--mute);padding:12px 14px}
.how kbd{font-family:var(--num);font-weight:800;background:var(--line);color:var(--fg);border-radius:3px;padding:0 6px}
.src{font-size:12px;line-height:1.6;color:var(--mute)}
.garage{display:flex;flex-direction:column;gap:12px;padding-bottom:14px}
.gTop{position:sticky;top:0;z-index:5;background:var(--asphalt2);padding-bottom:10px;border-bottom:2px solid var(--line);border-radius:6px 6px 0 0}
#wallet b{font-size:22px!important}
#stats{display:flex;flex-direction:column;gap:6px;padding-inline:14px}
.st{display:grid;grid-template-columns:40px minmax(0,1fr) 78px;gap:8px;align-items:center;font-size:13px}
.st small{grid-column:2/4;color:var(--yellow)}
.st em{font-family:var(--num);font-style:normal;font-weight:800;font-size:16px;text-align:right;font-variant-numeric:tabular-nums}
.sb{height:8px;background:var(--line);border-radius:2px;overflow:hidden}.sb i{display:block;height:100%;background:var(--yellow)}
#slots{display:flex;flex-direction:column;gap:12px;padding-inline:14px}
.sl{display:flex;gap:8px;align-items:baseline;margin-bottom:6px}.sl b{font-size:15px}.sl small{color:var(--mute);font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);border-radius:4px;padding:6px 10px;font-size:14px;font-weight:700}
.chip.on{background:var(--yellow);border-color:var(--yellow);color:#17190f}
.chip span{display:block;font-family:var(--num);font-size:14px;font-weight:600;opacity:.75;font-variant-numeric:tabular-nums}.chip.over{opacity:.5;border-style:dashed}.chip.on.over{opacity:1;background:var(--red);border-color:var(--red);color:#fff}
#signText{margin-top:8px}
#carName,#signText{width:100%;box-sizing:border-box;background:var(--asphalt);border:1.5px solid var(--line);border-radius:4px;color:var(--fg);font:700 16px var(--display);padding:8px 10px;user-select:text;-webkit-user-select:text}
.go:disabled{background:var(--red);color:#fff;cursor:not-allowed}
#wallet{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding-inline:14px}#wallet small{display:block;color:var(--mute);font-size:12.5px}#wallet b{font-family:var(--num);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums}#wallet .left b{color:var(--yellow)}#wallet .neg b{color:var(--red)}
.grid.intro{grid-template-columns:minmax(0,560px);justify-content:center}.grid.intro #rightCol{display:none}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1px var(--line)}
.sw.on{border-color:var(--fg)}
/* 開場：超跑情人夢 */
#splash{position:fixed;inset:0;z-index:60;background:#05070b center 62%/cover no-repeat;color:#f4f2ec;display:flex;flex-direction:column;align-items:center;font-family:"Noto Serif TC","Noto Serif CJK TC","Songti TC",serif;text-align:center;padding-top:max(11vh,env(safe-area-inset-top,0px));padding-bottom:max(44px,calc(env(safe-area-inset-bottom,0px) + 24px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box;gap:12px}
#splash h2,#splash .en,#spGo{animation:spIn 1.2s ease-out both}
#splash h2{margin:0;font-weight:900;font-size:clamp(42px,11vw,76px);letter-spacing:.14em;margin-right:-.14em;line-height:1.15;text-shadow:0 2px 24px #000c}
#splash .en{font-size:clamp(11px,2.6vw,14px);letter-spacing:.42em;margin-right:-.42em;opacity:.8;font-family:"Barlow Condensed",Arial,sans-serif;font-weight:600}
#spGo{margin-top:auto;border:1px solid #f4f2ecb0;background:#0007;padding:13px 38px;font:500 15px/1 "Noto Serif TC","Noto Serif CJK TC",serif;letter-spacing:.32em;color:#f4f2ec;cursor:pointer}
#spGo:hover{background:#f4f2ec;color:#05070b}
@keyframes spIn{from{opacity:0}to{opacity:1}}
#spBlack{position:fixed;inset:0;z-index:61;background:#000}
@media (prefers-reduced-motion:reduce){#splash h2,#splash .en,#spGo{animation:none}}
/* HUD */
#hud{position:fixed;inset:0;z-index:10;pointer-events:none;font-family:var(--num);font-variant-numeric:tabular-nums}
#hud[hidden]{display:none}
.hudtop{position:absolute;top:max(10px,env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.time{font-weight:800;font-size:clamp(38px,8vw,56px);line-height:.95;text-shadow:0 2px 0 #0008}
.goalt{font-weight:600;font-size:19px;color:var(--yellow);text-shadow:0 1px 0 #000a}
.goalt.over{color:var(--red)}
.corner{font-family:var(--display);font-weight:900;font-size:16px;background:var(--sign);border:2px solid var(--fg);border-radius:5px;padding:2px 8px;display:inline-block;margin-top:6px}
#mini{width:112px;height:112px;background:#0006;border-radius:6px}
.pause{pointer-events:auto;font-family:var(--display);font-weight:700;font-size:13px;background:#0008;padding:6px 10px;border-radius:5px;margin-top:6px;width:112px}
.speed{position:absolute;left:50%;transform:translateX(-50%);bottom:max(14px,calc(env(safe-area-inset-bottom,0px) + 8px));text-align:center;width:min(40vw,240px)}
.speed .v{font-weight:800;font-size:clamp(36px,7vw,50px);line-height:.9;text-shadow:0 2px 0 #0008}
.speed .u{font-size:14px;font-weight:600;opacity:.8}
.bar{height:11px;background:#0009;border:2px solid var(--fg);border-radius:3px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;width:0;background:var(--blue)}
.bar.full i{background:var(--yellow)}
#toast{position:absolute;top:22%;left:0;right:0;text-align:center;font-family:var(--display);font-weight:900;font-size:clamp(18px,4vw,26px);text-shadow:0 2px 6px #000;opacity:0;transition:opacity .2s;padding-inline:16px}
#toast.on{opacity:1}
#cd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:clamp(90px,24vw,180px);color:var(--yellow);text-shadow:0 5px 0 #000}
.pads{position:absolute;bottom:max(14px,calc(env(safe-area-inset-bottom,0px) + 8px));display:flex;gap:10px;pointer-events:auto;touch-action:none;font-family:var(--display)}
.pads.l{left:max(12px,env(safe-area-inset-left,0px))}
.pads.r{right:max(12px,env(safe-area-inset-right,0px));align-items:flex-end}
.pad{width:clamp(66px,19vw,88px);height:clamp(66px,19vw,88px);border-radius:50%;background:#0007;border:3px solid #fff9;font-weight:900;font-size:17px;display:flex;align-items:center;justify-content:center;touch-action:none}
.pad.on{background:#fff5}
#pdrift{border-color:var(--yellow);color:var(--yellow)}
#pnitro{border-color:#6aa9ff;color:#9cc7ff}
#pnitro.ready{background:var(--blue);color:#fff;border-color:#fff}
.nopad .pads{display:none}
/* result */
.modal{position:fixed;inset:0;z-index:30;background:#0009;display:flex;align-items:center;justify-content:center;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-y:auto}
.card{background:var(--sign);border:3px solid var(--fg);border-radius:10px;padding:14px;width:min(460px,100%);box-sizing:border-box;margin:auto;display:flex;flex-direction:column;gap:10px}
.heroM{background:#000}
.flashfx{position:fixed;inset:0;background:#fff;pointer-events:none;animation:fl .7s ease-out forwards}
@keyframes fl{0%{opacity:1}100%{opacity:0;visibility:hidden}}
.hero{width:min(720px,100%);display:flex;flex-direction:column;gap:12px;margin:auto}
.heroT{display:flex;justify-content:space-between;align-items:baseline;gap:12px}.heroT span{font-weight:900;font-size:clamp(30px,7vw,44px);color:var(--yellow)}.heroT em{font-style:normal;font-weight:700;font-size:17px}
.frame{position:relative;border:3px solid var(--fg);line-height:0}.frame img{width:100%;display:block}
.stamp{position:absolute;left:8px;top:8px;background:#c8102e;color:#fff;font-family:var(--display);line-height:1.2;padding:4px 10px;border-radius:4px;font-size:15px;transform:rotate(-3deg)}.stamp b{font-family:var(--num);font-weight:800;font-size:30px}.stamp small{display:block;font-size:13px}
.thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.th{position:relative;border:3px solid transparent;padding:0;line-height:0}.th img{width:100%;display:block}.th.on{border-color:var(--yellow)}.th span{position:absolute;left:0;bottom:0;background:#000b;color:#fff;font:800 16px/1.3 var(--num);padding:0 6px}
@media (prefers-reduced-motion:reduce){.flashfx{display:none}}
.resM{background:#000d}
.res{width:min(440px,100%);display:flex;flex-direction:column;gap:10px;margin:auto}
.resB{display:grid;grid-template-columns:2fr 1fr;gap:8px}.resB .ghostbtn{padding:0;font-size:15px}
.resL{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}.lk{font-size:14px;font-weight:700;color:var(--fg);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px 0;background:none;border:0}
.hint{text-align:center;color:var(--yellow)}
#shareImg{display:block;width:100%;max-height:calc(100dvh - 150px);object-fit:contain;background:var(--asphalt);user-select:auto;-webkit-user-select:auto;-webkit-touch-callout:default}
.hint{font-size:14px;margin:0}
.filebtn{display:block;text-align:center;box-sizing:border-box;cursor:pointer}
.card.fail{background:var(--asphalt2)}
.card h2{margin:0;font-size:28px;font-weight:900;text-wrap:balance}
.big{font-family:var(--num);font-weight:800;font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
.card p{margin:0;font-size:15px;line-height:1.55}
.rows{display:flex;flex-direction:column;gap:8px}
.ghostbtn{border:2px solid var(--fg);border-radius:6px;padding:10px;font-weight:700;font-size:16px;width:100%}
@media (max-width:640px){.speed{bottom:max(100px,calc(env(safe-area-inset-bottom,0px) + 100px))}}
@media (max-width:760px){.grid{grid-template-columns:minmax(0,1fr)}.mapbox svg{max-height:340px}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>

const STEP=1.5;
const wrap=a=>{while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a};
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function hash(x,z){const s=Math.sin(x*12.9898+z*78.233)*43758.5453;return s-Math.floor(s)}
function noise(x,z){return Math.sin(x*.021+1.3)*Math.cos(z*.017+.4)*.6+Math.sin(x*.057+z*.043)*.3+Math.sin(z*.11-x*.09)*.1}
function buildTrack(def){
  const xs=[],zs=[],hs=[];let x=0,z=0,h=0;const cIdx=[];
  const push=()=>{xs.push(x);zs.push(z);hs.push(h)};
  const straight=l=>{const n=Math.round(l/STEP);for(let i=0;i<n;i++){x+=Math.sin(h)*STEP;z+=Math.cos(h)*STEP;push()}};
  push();straight(50);
  def.corners.forEach((c,i)=>{
    const rad=c[0]*Math.PI/180,R=c[1],n=Math.max(4,Math.round(Math.abs(rad)*R/STEP)),d=rad/n;
    cIdx.push({at:xs.length,apex:xs.length+Math.floor(n/2),dir:Math.sign(c[0]),end:xs.length+n});
    for(let k=0;k<n;k++){h-=d;x+=Math.sin(h)*STEP;z+=Math.cos(h)*STEP;push()}
    straight(def.straights[i]);
  });
  const n=xs.length,ys=new Float32Array(n);
  for(let i=0;i<n;i++){const t=i/(n-1),s=t*t*(3-2*t);ys[i]=def.y0+(def.y1-def.y0)*s+Math.sin(t*19)*def.wig*Math.sin(t*Math.PI)}
  const T={def,n,xs,zs,hs,ys,hw:def.hw,corners:cIdx,len:n*STEP};
  // 道具與路面物件用固定 seed，所有人跑同一條
  T.pads=[];T.cams=[];
  for(let i=0;i<def.corners.length;i+=2){const a=cIdx[i].end+8;T.pads.push({i:a,lat:(hash(i,3)-.5)*def.hw*.9})}
  [.27,.58,.86].forEach(f=>T.cams.push({i:Math.floor(n*f)}));
  T.traffic=[];const tr=def.traffic;
  for(let k=0;k<tr.n;k++){T.traffic.push({kind:"big",label:tr.label,v:tr.v,i0:Math.floor(n*(.1+.84*k/tr.n)),lat:(k%2?1:-1)*def.hw*.5,w:tr.w,len:tr.len,weave:0,ph:0})}
  for(let k=0;k<9;k++){T.traffic.push({kind:"scooter",label:"機車",v:11+hash(k,7)*3,i0:Math.floor(n*(.06+.88*(k+.4)/9)),lat:(hash(k,8)-.5)*def.hw*.7,w:1,len:2.2,weave:1.8,ph:k*1.7})}
  T.monkeys=[];const MN={jiuwan:8,suhua:6,wuling:4,alishan:8,nanhui:5}[def.id];
  for(let k=0;k<MN;k++){T.monkeys.push({i:Math.floor(n*(.08+.86*(k+hash(k,11)*.6)/MN)),lat0:(hash(k,12)-.5)*def.hw*.8,amp:def.hw*.35,w:.8+hash(k,13)*.5,ph:k*2.1})}
  return T;
}

function newCar(stat,T){
  return {stat,x:T.xs[8],z:T.zs[8],h:T.hs[8],vd:T.hs[8],v:0,st:0,i:8,lat:0,drifting:false,dir:0,driftT:0,gauge:0,boostT:0,miniT:0,wall:false,t:0,done:false,bump:0,mh:{},bento:0};
}
function trafficPos(tr,T,t){const i=(tr.i0+t*tr.v/STEP);return Math.min(i,T.n-1)}
const trLat=(tr,t)=>tr.lat+(tr.weave?Math.sin(t*.9+tr.ph)*tr.weave:0);
const mkLat=(m,t)=>m.lat0+Math.sin(t*m.w+m.ph)*m.amp;
function step(c,inp,dt,T){
  const s=c.stat;
  c.t+=dt;
  let topMul=1,accMul=1;
  if(c.boostT>0){topMul=1.38;accMul=2.4;c.boostT-=dt}else if(c.miniT>0){topMul=1.18;accMul=1.6;c.miniT-=dt}
  const top=s.top*topMul;
  if(inp.brake)c.v=Math.max(0,c.v-42*dt);else c.v+=s.acc*accMul*(1-c.v/top)*dt;
  if(c.v>top)c.v-=(c.v-top)*1.6*dt;
  c.gauge=Math.min(1,c.gauge+.035*(s.nr||1)*dt);
  c.st+=(inp.steer-c.st)*Math.min(1,11*dt);
  if(inp.nitro&&c.gauge>=1){c.gauge=0;c.boostT=2.4*(s.nd||1);c.fired=true}
  if(inp.drift&&!c.drifting&&Math.abs(c.st)>.18&&c.v>10){c.drifting=true;c.dir=Math.sign(c.st);c.driftT=0}
  if(c.drifting&&(!inp.drift||c.v<8)){
    if(c.driftT>.45){c.miniT=.3+Math.min(c.driftT,1.6)*.42;c.gauge=Math.min(1,c.gauge+.05);c.miniFired=true}
    c.drifting=false;
  }
  let rate=2.15*s.hand*(1-.42*c.v/56);
  if(c.v<6)rate*=c.v/6;
  let steer=c.st,grip=9.5;
  if(c.drifting){c.driftT+=dt;steer=clamp(c.dir*.55+c.st*.75,-1.3,1.3);rate*=1.5;grip=2.3;c.v-=c.v*.09*dt;c.gauge=Math.min(1,c.gauge+.3*(s.nr||1)*dt)}
  c.h=wrap(c.h-rate*steer*dt);
  const dif=wrap(c.h-c.vd);
  c.vd=wrap(c.vd+dif*(1-Math.exp(-grip*dt)));
  c.v-=Math.abs(Math.sin(dif))*c.v*.22*dt;
  c.x+=Math.sin(c.vd)*c.v*dt;c.z+=Math.cos(c.vd)*c.v*dt;
  // 投影到賽道（只看附近，避免跳到隔壁彎）
  let best=1e12,bi=c.i;
  for(let k=Math.max(0,c.i-14);k<=Math.min(T.n-1,c.i+16);k++){const dx=c.x-T.xs[k],dz=c.z-T.zs[k],d=dx*dx+dz*dz;if(d<best){best=d;bi=k}}
  c.i=bi;
  const th=T.hs[bi],rx=-Math.cos(th),rz=Math.sin(th);
  c.lat=(c.x-T.xs[bi])*rx+(c.z-T.zs[bi])*rz;
  c.wall=false;const lim=T.hw-1.15;
  if(Math.abs(c.lat)>lim){
    const sgn=Math.sign(c.lat);c.x-=rx*(c.lat-sgn*lim);c.z-=rz*(c.lat-sgn*lim);c.lat=sgn*lim;
    const ang=Math.abs(Math.sin(wrap(th-c.vd)));
    c.v*=1-dt*(1+6*ang);c.h=wrap(c.h+wrap(th-c.h)*3.2*dt);c.vd=wrap(c.vd+wrap(th-c.vd)*5*dt);
    c.wall=true;if(c.drifting)c.drifting=false;
  }
  // 加速帶
  for(const p of T.pads){if(!p.used&&Math.abs(c.i-p.i)<4&&Math.abs(c.lat-p.lat)<2.6&&c.v>5){c.miniT=Math.max(c.miniT,1);c.padT=c.t}}
  // 來車：同向慢車
  if(c.bump>0)c.bump-=dt;
  for(const tr of T.traffic){const ti=trafficPos(tr,T,c.t);if(Math.abs(ti-c.i)*STEP<tr.len/2+1.4&&Math.abs(c.lat-trLat(tr,c.t))<tr.w/2+1.05&&c.bump<=0){c.v*=s.tough>0?.78:s.tough<0?.42:.55;c.bump=.9;c.hit=`撞到${tr.label}`;c.drifting=false}}
  T.monkeys.forEach((m,k)=>{if(!c.mh[k]&&Math.abs(c.i-m.i)*STEP<2.4&&Math.abs(c.lat-mkLat(m,c.t))<1.7){c.mh[k]=1;c.bento++;c.v*=.62;c.drifting=false;c.hit="獼猴跳上引擎蓋，便當被搶了"}});
  if(c.i>=T.n-3)c.done=true;
}
/* 機器人：用來校準秒數 */
function bot(c,T,st){
  const la=Math.min(T.n-1,c.i+Math.round((6+c.v*.52)/STEP));
  let lat=0;
  for(const tr of T.traffic){const ti=trafficPos(tr,T,c.t);const gap=(ti-c.i)*STEP;if(gap>-4&&gap<34){lat=trLat(tr,c.t)>0?-T.hw*.42:T.hw*.42}}
  T.monkeys.forEach((m,k)=>{if(c.mh[k])return;const gap=(m.i-c.i)*STEP;if(gap>0&&gap<24)lat=mkLat(m,c.t+gap/Math.max(c.v,10))>0?-T.hw*.5:T.hw*.5});
  const rx=-Math.cos(T.hs[la]),rz=Math.sin(T.hs[la]),tx=T.xs[la]+rx*lat,tz=T.zs[la]+rz*lat;
  const a=wrap(Math.atan2(tx-c.x,tz-c.z)-c.h);
  const steer=clamp(-a*2.6,-1,1);
  if(!st.dr&&Math.abs(a)>.5&&c.v>17)st.dr=true;
  if(st.dr&&Math.abs(a)<.16)st.dr=false;
  const ahead=Math.abs(wrap(T.hs[Math.min(T.n-1,c.i+36)]-T.hs[c.i]));
  return {steer,drift:st.dr,brake:Math.abs(a)>.95&&c.v>20,nitro:ahead<.45};
}
function simBot(build,ti){
  const T=getTrack(ti),c=newCar(buildStat(build),T),st={};let wall=0,hit=0;
  while(!c.done&&c.t<300){const inp=bot(c,T,st);step(c,inp,1/60,T);if(c.wall)wall++;if(c.hit){hit++;c.hit=false}}
  return {t:+c.t.toFixed(2),wall,hit,done:c.done};
}

  const dt=Math.min(.05,(now-last)/1000||0);last=now;
  if(race&&!paused){updateRace(dt);if(race)renderRace(dt);if(race)R.render(scene,cam)}
  else if(race){R.render(scene,cam)}
  if(!race)previewTick(dt);
}

/* ---------- 操作 ---------- */
const keymap={ArrowLeft:"l",KeyA:"l",ArrowRight:"r",KeyD:"r",Space:"drift",ShiftLeft:"nitro",ShiftRight:"nitro",ArrowUp:"nitro",KeyW:"nitro",ArrowDown:"brake",KeyS:"brake"};
addEventListener("keydown",e=>{
  if(!race)return;
  const k=keymap[e.code];
  if(k){e.preventDefault();input[k]=(k==="l"||k==="r")?1:true}
  if(e.code==="KeyR"&&race.phase!=="end")startRace();
  if(e.code==="Escape"||e.code==="KeyP")togglePause();
});
addEventListener("keyup",e=>{const k=keymap[e.code];if(k){input[k]=(k==="l"||k==="r")?0:false}});
addEventListener("blur",()=>{input.l=input.r=0;input.drift=input.nitro=input.brake=false;if(race&&race.phase==="go"&&!paused)togglePause()});
function bindPad(id,key){const el=$(id);const set=v=>{input[key]=(key==="l"||key==="r")?(v?1:0):v;el.classList.toggle("on",v)};
  el.addEventListener("pointerdown",e=>{e.preventDefault();try{el.setPointerCapture(e.pointerId)}catch(_){}set(true)});
  ["pointerup","pointercancel","lostpointercapture"].forEach(n=>el.addEventListener(n,()=>set(false)));
}
bindPad("pl","l");bindPad("pr","r");bindPad("pdrift","drift");bindPad("pnitro","nitro");
if(!("ontouchstart" in window)&&!(navigator.maxTouchPoints>0))$("hud").classList.add("nopad");
function togglePause(){
  if(!race||race.phase==="end")return;paused=!paused;$("pause").textContent=paused?"繼續":"暫停";
  if(paused){engineGain(0);showPause()}else $("modal").hidden=true;
}
function showPause(){
  const m=$("modal");m.hidden=false;m.className="modal";
  m.innerHTML=`<div class="card fail"><h2>路邊暫停</h2><p>${esc(race.cname)}｜${TRACKS[race.ti].name}</p><div class="rows"><button class="go" id="pGo">繼續</button><button class="ghostbtn" id="pRe">重來</button><button class="ghostbtn" id="pMenu">回車庫</button></div></div>`;
  $("pGo").onclick=togglePause;$("pRe").onclick=startRace;$("pMenu").onclick=()=>{paused=false;toMenu()};
}
$("pause").addEventListener("click",togglePause);

/* ---------- 選單 ---------- */
const TW=[[121.56,25.3],[121.75,25.15],[121.93,25.02],[121.85,24.85],[121.87,24.6],[121.72,24.25],[121.62,24],[121.5,23.45],[121.38,23.05],[121.15,22.72],[120.98,22.5],[120.88,22.1],[120.84,21.9],[120.72,21.94],[120.68,22.2],[120.45,22.5],[120.28,22.6],[120.12,23],[120.12,23.5],[120.32,23.95],[120.52,24.28],[120.72,24.6],[120.92,24.85],[121.05,25.05],[121.4,25.2]];
const px=lon=>(lon-119.75)*175,py=lat=>(25.42-lat)*205;
function renderMap(){
  const d="M"+TW.map(p=>px(p[0]).toFixed(1)+" "+py(p[1]).toFixed(1)).join("L")+"Z";
  const pts=TRACKS.map((t,i)=>{const lock=false,seln=sel.track===i;return `<g class="pin ${lock?"locked":""} ${seln?"sel":""}" data-t="${i}" tabindex="${lock?-1:0}" role="button" aria-label="${t.name}${lock?"（未解鎖）":""}" transform="translate(${px(t.lon).toFixed(1)} ${py(t.lat).toFixed(1)})"><circle r="${seln?11:9}"></circle><text x="${t.lx}" y="${t.ly+7}">${t.name}</text></g>`}).join("");
  $("map").innerHTML=`<path d="${d}" fill="#3b4142" stroke="#f2f1ea" stroke-width="3" stroke-linejoin="round"/>${pts}`;
  $("map").querySelectorAll(".pin").forEach(el=>{const i=+el.dataset.t;
    const act=()=>{sel.track=i;renderMenu()};el.addEventListener("click",act);el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();act()}})});
}
function renderMenu(){
  const intro=!save.started;
  $("menuGrid").classList.toggle("intro",intro);
  $("count").textContent=intro?"":`預算 ${BUDGET} 萬`;
  const t=TRACKS[sel.track],best=save.best[sel.track],m=MEDALS[sel.track];
  $("mission").innerHTML=intro?`<div class="eyebrow">每個人同一筆錢</div><h2>NT$${BUDGET} 萬，配一台你自己的車</h2><p>零件沒有絕對好壞，只有取捨：要過彎順、直線快，還是耐撞。配好就能跑全部賽道，拿秒數跟朋友比。</p><button class="go" id="goBtn">配好了，上路</button>`:
    `<div class="eyebrow"><span class="shield">${t.road}</span>　${t.sub}</div>
    <h2>${t.name}</h2>
    <div class="goal">${best?best.t.toFixed(2)+" 秒":"尚未完賽"}</div>
    <p>${best?`${esc(best.name)}　${medalOf(sel.track,best.t)||"完賽"}<br>`:""}金牌 ${m[0].toFixed(1)}　銀牌 ${m[1].toFixed(1)}　銅牌 ${m[2].toFixed(1)}</p>
    <button class="go" id="goBtn">出發</button>`;
  $("goBtn").onclick=()=>{if(leftover()<0)return;if(!save.started){save.started=true;persist();renderMenu();return}startRace()};
  renderGarage();
  $("cars").innerHTML=TRACKS.map((tr,i)=>{const b=save.best[i];return `<button class="car ${i===sel.track?"sel":""}" data-t="${i}"><span class="shield">${tr.road}</span><span><b>${tr.name}</b><small>${b?esc(b.name)+"　"+(medalOf(i,b.t)||"完賽"):tr.sub}</small></span><span class="t ${b&&medalOf(i,b.t)==="金牌"?"gold":""}">${b?b.t.toFixed(2):"—"}</span></button>`}).join("");
  $("cars").querySelectorAll(".car").forEach(el=>el.addEventListener("click",()=>{sel.track=+el.dataset.t;renderMenu()}));
  renderMap();
}
function renderGarage(){
  const b=save.build,S=buildStat(b),F=BUDGET,C=buildCost(b),L=F-C;
  $("wallet").innerHTML=`<div><small>預算</small><b>${F} 萬</b></div><div><small>這台車</small><b>${C} 萬</b></div><div class="${L<0?"neg":"left"}"><small>${L<0?"超支":"剩餘"}</small><b>${Math.abs(L)} 萬</b></div>`;
  const go=$("goBtn");if(go){go.disabled=L<0;go.textContent=L<0?`超支 ${-L} 萬，先降配`:save.started?"出發":"配好了，上路"}
  const bars=[["極速",(S.top-30)/10,Math.round(S.top*5)+" km/h"],["加速",(S.acc-10)/10,S.acc.toFixed(1)],["過彎",(S.hand-.7)/.65,S.hand.toFixed(2)],["氮氣",(S.nr*S.nd-.5)/1.6,"×"+(S.nr*S.nd).toFixed(2)]];
  $("stats").innerHTML=bars.map(x=>`<div class="st"><span>${x[0]}</span><div class="sb"><i style="width:${Math.min(100,x[1]*100)}%"></i></div><em>${x[2]}</em></div>`).join("")+`<div class="st"><span>車型</span><small>${carType(b)}</small></div>`;
  let h=`<div class="slot"><div class="sl"><b>車名</b><small>會出現在戰績上</small></div><input id="carName" maxlength="10" placeholder="我的車" value="${esc(save.name)}" aria-label="車名"></div>`;
  for(const sl of ["body","engine","tire","nitro"]){
    const P=PARTS[sl],cur=P.items[b[sl]];
    h+=`<div class="slot"><div class="sl"><b>${P.label}</b><small>${cur.d}</small></div><div class="chips">`+P.items.map((it,i)=>{const after=C-cur.p+it.p;return `<button class="chip ${i===b[sl]?"on":""} ${after>F?"over":""}" data-s="${sl}" data-i="${i}">${it.n}<span>${it.p} 萬</span></button>`}).join("")+`</div></div>`;
  }
  h+=`<div class="slot"><div class="sl"><b>只有帥的配件</b><small>零性能，${accSpend(b)?"帥度 "+accSpend(b)+" 萬":"可多選"}</small></div><div class="chips">`+ACCS.map(a=>{const on=b.acc.includes(a.id);return `<button class="chip ${on?"on":""} ${!on&&C+a.p>F?"over":""}" data-a="${a.id}">${a.n}<span>${a.p} 萬</span></button>`}).join("")+`</div>${b.acc.includes("betel")?`<input id="signText" maxlength="8" placeholder="檳榔" value="${esc(b.signText||"")}" aria-label="招牌文字">`:""}</div>`;
  h+=`<div class="slot"><div class="sl"><b>烤漆</b><small>免費</small></div><div class="chips">`+COLORS.map((c,i)=>`<button class="sw ${i===b.color?"on":""}" aria-label="${c[0]}色" data-s="color" data-i="${i}" style="background:#${c[1].toString(16).padStart(6,"0")}"></button>`).join("")+`</div></div>`;
  $("slots").innerHTML=h;
  $("slots").querySelectorAll("button").forEach(el=>el.addEventListener("click",()=>{if(el.dataset.a){const a=save.build.acc,i=a.indexOf(el.dataset.a);i<0?a.push(el.dataset.a):a.splice(i,1)}else save.build[el.dataset.s]=+el.dataset.i;persist();renderGarage();setPreview()}));
  if($("signText"))$("signText").addEventListener("input",e=>{save.build.signText=e.target.value;persist();setPreview()});
  $("carName").addEventListener("input",e=>{save.name=e.target.value.trim();persist()});
  setPreview();
}
/* 車庫轉盤 */
let P=null,pCar=null,pIdx=-1,pPulse=0;
function setupPreview(){
  try{
    const c=$("preview"),r=new THREE.WebGLRenderer({canvas:c,antialias:true,alpha:true});r.setPixelRatio(Math.min(devicePixelRatio||1,2));
    const s=new THREE.Scene();s.add(new THREE.HemisphereLight(0xffffff,0x555555,1));const d=new THREE.DirectionalLight(0xffffff,.7);d.position.set(3,5,4);s.add(d);
    const pc=new THREE.PerspectiveCamera(30,2,.1,50);pc.position.set(0,4.6,15.5);pc.lookAt(0,2,0);
    const floor=new THREE.Mesh(new THREE.CircleGeometry(3.6,32),new THREE.MeshBasicMaterial({color:0x3b4142}));floor.rotation.x=-Math.PI/2;s.add(floor);
    P={r,s,pc,c};
  }catch(e){P=null}
}
function setPreview(){if(!P)return;const k=JSON.stringify(save.build);if(pIdx===k)return;pIdx=k;const a=pCar?pCar.rotation.y:.6;if(pCar)P.s.remove(pCar);pCar=makeCar(carSpec(save.build));pCar.rotation.y=a;P.s.add(pCar);pPulse=1}
function previewTick(dt){
  if(!P||!pCar||$("menu").hidden)return;
  const w=P.c.clientWidth,h=P.c.clientHeight;if(P.c.width!==Math.floor(w*P.r.getPixelRatio())){P.r.setSize(w,h,false);P.pc.aspect=w/h;P.pc.updateProjectionMatrix()}
  pCar.rotation.y+=dt*.6;pPulse=Math.max(0,pPulse-dt*3.5);pCar.scale.setScalar(1+Math.sin(pPulse*Math.PI)*.14);P.r.render(P.s,P.pc);
}

setupPreview();renderMenu();
$("spGo").addEventListener("click",()=>{
  $("spBlack").hidden=false;$("splash").hidden=true;
  let stop=()=>{};
  try{initAudio();if(actx){const t=actx.currentTime,o=actx.createOscillator(),f=actx.createBiquadFilter(),g=actx.createGain();o.type="sawtooth";o.frequency.setValueAtTime(42,t);o.frequency.exponentialRampToValueAtTime(190,t+1);f.type="lowpass";f.frequency.value=650;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.26,t+.15);o.connect(f);f.connect(g);g.connect(actx.destination);o.start(t);stop=()=>{g.gain.cancelScheduledValues(actx.currentTime);g.gain.value=0;o.stop()}}}catch(e){}
  setTimeout(()=>{stop();$("spBlack").hidden=true},1050);
});
requestAnimationFrame(loop);
window.__TW={simBot,rankBuilds,TRACKS,state:()=>race,save:()=>save,setTrack:t=>{sel.track=t},start:startRace,menu:()=>renderMenu()};
</script>
