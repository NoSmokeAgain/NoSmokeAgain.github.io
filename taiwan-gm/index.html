  <div class="top-actions">
    <button class="snd-btn" id="musicBtn" aria-label="背景音樂開關" title="背景音樂">♫</button>
    <button class="snd-btn" id="sfxBtn" aria-label="音效與播報開關" title="音效與播報">🔊</button>
    <button class="ghost-btn" id="help">玩法</button>
  </div>
</header>

<!-- 1. 開場 -->
<section class="screen" id="screenIntro">
  <div class="intro">
    <div class="intro-cards" id="introCards" aria-hidden="true"></div>
    <p class="kicker">2026 跨世代選秀</p>
    <h1>組一支<span class="hot">最強戰隊</span><br>然後，建你的黨。</h1>
    <ol class="intro-steps">
      <li><b>220</b><span>點預算</span></li>
      <li><b>20</b><span>個位置</span></li>
      <li><b>58</b><span>位球員</span></li>
    </ol>
    <button class="cta" id="start">開始選秀 <span>→</span></button>
    <button class="link-btn" id="resume" hidden></button>
    <button class="link-btn" id="introAuto">懶得選？先幫我湊一隊</button>
    <button class="price-teaser" id="introRules"><b>身價只看選票，不看黨派</b><span>為什麼某某某這麼便宜？看公式與完整身價表 →</span></button>
  </div>
</section>

<!-- 2. 選秀 -->
<section class="screen" id="screenDraft" hidden>
  <div class="hud" id="hud">
    <div class="hud-main">
      <div class="hud-cell"><small>剩餘點數</small><strong id="hudBudget">220.0</strong></div>
      <div class="hud-cell"><small>戰力</small><strong id="hudPower">0</strong></div>
      <div class="hud-cell"><small>陣容</small><strong id="hudCount">0<em>/20</em></strong></div>
    </div>
    <div class="budget-bar"><i id="budgetFill"></i></div>
  </div>

  <div class="draft">
    <div class="board-wrap">
      <div class="board-tools">
        <button class="chip-btn" id="autofill">🎲 自動補滿</button>
        <button class="chip-btn" id="reset">重來</button>
      </div>
      <div class="board" id="board"></div>
    </div>

    <aside class="picker" id="picker" aria-label="選擇球員">
      <div class="picker-head">
        <div class="sheet-grip" aria-hidden="true"></div>
        <div class="picker-title">
          <div>
            <small id="pickerGroup">隊長</small>
            <h2>誰來當 <span id="pickerRole">總統</span>？</h2>
          </div>
          <button class="close-sheet" id="closePicker" aria-label="收起">×</button>
        </div>
        <p class="picker-hint" id="pickerHint"></p>
        <div class="party-chips" id="partyChips" role="tablist" aria-label="依黨籍篩選"></div>
      </div>
      <div class="picker-list" id="list"></div>
      <p class="picker-foot">卡面黨籍為該次選舉時的身分。戰力是遊戲數值，不代表真實能力。</p>
    </aside>
  </div>

  <div class="dock">
    <div class="dock-text"><small id="dockHint">先挑你的總統</small></div>
    <button class="cta small" id="toParty" disabled>成軍！去建黨 <span>→</span></button>
  </div>
  <div class="scrim" id="scrim" hidden></div>
</section>

<!-- 3. 建黨 -->
<section class="screen" id="screenParty" hidden>
  <div class="party">
    <div class="friend-banner" id="friendBanner" hidden>
      <span>這是朋友組的黨。換你了？</span>
      <button class="cta small" id="myTurn">我也要組一隊 →</button>
    </div>

    <div class="party-layout">
      <div class="party-form" id="partyForm">
        <p class="kicker">戰隊成軍</p>
        <h2 class="party-h">現在，建立你的政黨</h2>

        <div class="field">
          <label for="partyName">黨名</label>
          <div class="name-row">
            <input id="partyName" maxlength="8" placeholder="例如：島嶼行動" autocomplete="off">
            <span class="suffix">黨</span>
            <button class="dice" id="rollName" aria-label="隨機黨名">🎲</button>
          </div>
        </div>

        <div class="field">
          <label>黨徽</label>
          <div class="emblems" id="emblems"></div>
        </div>

        <div class="field">
          <label>黨色</label>
          <div class="swatches" id="swatches"></div>
        </div>

        <div class="field">
          <label>政策主張 <small id="plankCount">選 3 條</small> <button class="dice inline" id="rollPlanks" aria-label="隨機黨綱">🎲</button></label>
          <div class="planks" id="planks"></div>
          <div class="custom-row">
            <input id="customPlank" maxlength="18" placeholder="或自己寫一條（18 字內）" autocomplete="off">
            <button class="chip-btn" id="addPlank">加入</button>
          </div>
        </div>

        <button class="link-btn back" id="backDraft">← 回去調整陣容</button>
      </div>

      <div class="party-preview">
        <div class="poster" id="poster"></div>
        <div class="share-actions">
          <button class="cta" id="makeImage">產生分享圖</button>
          <button class="chip-btn" id="copyLink">複製連結</button>
        </div>
        <div id="imageOutput"></div>
      </div>
    </div>
  </div>
</section>

<footer>娛樂用架空組隊・頭像為 AI 漫畫創作・無任何政黨或人物背書</footer>

<div class="reveal" id="reveal" hidden>
  <div class="reveal-top"><span class="kicker">陣容公布</span><button class="ghost-btn" id="skipReveal">跳過</button></div>
  <div class="reveal-stage" id="revealStage"></div>
  <div class="reveal-bar" id="revealBar">
    <div class="reveal-grade" id="revealGrade"></div>
    <div class="reveal-actions"><button class="chip-btn" id="replay">再看一次</button><button class="cta small" id="goParty">建立政黨 →</button></div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<dialog id="detail"><div id="detailContent"></div></dialog>
<dialog id="rules" class="wide"><div id="rulesContent"></div></dialog>
<dialog id="info"><div id="infoContent"></div></dialog>

<script src="data.js"></script>
<script src="audio.js"></script>
<script src="app.js"></script>
</body>
</html>
