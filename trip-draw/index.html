<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>下一站抽籤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&family=Bebas+Neue&display=swap">
<style>
/* Layout: one column app. Gate screen splits into two doors (她 / 他). Each side has its own skin:
   她 = boarding-pass on blush paper (serif, soft); 他 = neon departure board (condensed caps, dark).
   Draw = split-flap style city roll → ticket card with 6-month price bars + 5 picks. Committed per-side looks, not light/dark themes. */
:root{
  --f-sans:"Noto Sans TC",system-ui,sans-serif; --f-serif:"Noto Serif TC","Songti TC",serif; --f-board:"Bebas Neue","Noto Sans TC",sans-serif;
  /* gate */
  --g-bg:#16151a; --g-ink:#f4f1ec;
  /* her */
  --h-bg:#f7ece6; --h-paper:#fffaf6; --h-ink:#3a2a2c; --h-mute:#8c7377; --h-acc:#c8536b; --h-rule:#ead6d0; --h-soft:#f3dcd8;
  /* him */
  --m-bg:#0c0f14; --m-panel:#141a22; --m-ink:#e9eef4; --m-mute:#7f8a99; --m-acc:#ffb020; --m-hot:#ff3d5a; --m-rule:#232c38;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--g-bg);color:var(--g-ink);font-family:var(--f-sans);-webkit-tap-highlight-color:transparent}
body.her{background:var(--h-bg);color:var(--h-ink)}
body.him{background:var(--m-bg);color:var(--m-ink);color-scheme:dark}
.wrap{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:grid;gap:16px}

/* ---------- gate ---------- */
.gate h1{font:900 40px/1.15 var(--f-sans);margin:6px 0 0;text-wrap:balance}
.gate p{margin:0;color:#b8b2aa;font-size:15px;line-height:1.7}
.doors{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.door{border:0;border-radius:18px;padding:22px 14px 18px;cursor:pointer;display:grid;gap:8px;justify-items:center;text-align:center;min-height:220px;align-content:center;transition:transform .15s}
.door:active{transform:scale(.97)}
.door:focus-visible{outline:3px solid #fff;outline-offset:3px}
.door.her{background:var(--h-bg);color:var(--h-ink);font-family:var(--f-serif)}
.door.him{background:var(--m-bg);color:var(--m-ink);border:1px solid #2a3442}
.door .big{font-size:56px;line-height:1}
.door.her .big{font:900 56px var(--f-serif);color:var(--h-acc)}
.door.him .big{font:400 64px var(--f-board);color:var(--m-acc);text-shadow:0 0 18px #ffb02088}
.door b{font-size:17px}
.door small{font:500 12px var(--f-sans);opacity:.75;line-height:1.5}
.note{font-size:12px;line-height:1.65;margin:0;opacity:.75}
.door.locked{filter:grayscale(.85) brightness(.7);position:relative}
.door.locked::after{content:"🔒";position:absolute;top:10px;right:12px;font-size:20px}
.door.nope{animation:nope .4s}
@keyframes nope{20%{transform:translateX(-10px) rotate(-2deg)}40%{transform:translateX(9px) rotate(2deg)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.block{margin:0;min-height:0;font:900 17px/1.5 var(--f-sans);text-align:center;color:#ff6b6b;opacity:0}
.block.on{animation:blk .35s cubic-bezier(.2,1.6,.5,1) forwards}
@keyframes blk{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}

/* ---------- shared bits ---------- */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.back{background:none;border:0;cursor:pointer;font:500 14px var(--f-sans);color:inherit;opacity:.7;padding:6px 0}
.mute{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;cursor:pointer;padding:0;border:1px solid currentColor;background:transparent;color:inherit;opacity:.8}
.mute svg{width:18px;height:18px}
.filters{display:grid;gap:8px}
.flab{font:700 12px var(--f-sans);letter-spacing:.12em;opacity:.7}
.seg{display:grid;grid-template-columns:repeat(4,1fr);border-radius:12px;overflow:hidden}
.seg button{border:0;background:transparent;color:inherit;font:700 13px var(--f-sans);padding:10px 2px;cursor:pointer}
.seg.n3{grid-template-columns:repeat(3,1fr)}
.draw{border:0;border-radius:16px;padding:18px;cursor:pointer;font:900 22px var(--f-sans);letter-spacing:.06em;touch-action:manipulation}
.draw:disabled{opacity:.6;cursor:default}
.draw:focus-visible,.seg button:focus-visible,.back:focus-visible,.mute:focus-visible{outline:3px solid currentColor;outline-offset:2px}

/* her skin */
body.her .seg{border:1.5px solid var(--h-acc)}
body.her .seg button[aria-pressed="true"]{background:var(--h-acc);color:#fff}
body.her .draw{background:var(--h-acc);color:#fff;box-shadow:0 10px 24px -10px #c8536b99;font-family:var(--f-serif)}
body.her h2{font:900 30px/1.2 var(--f-serif);margin:0;color:var(--h-ink)}
body.her h2 em{font-style:normal;color:var(--h-acc)}
/* him skin */
body.him .seg{border:1px solid var(--m-rule);background:var(--m-panel)}
body.him .seg button[aria-pressed="true"]{background:var(--m-acc);color:#111}
body.him .draw{background:var(--m-acc);color:#111;font-family:var(--f-board);font-size:30px;letter-spacing:.12em;box-shadow:0 0 30px -6px #ffb020aa}
body.him h2{font:400 46px/1 var(--f-board);margin:0;letter-spacing:.04em}
body.him h2 em{font-style:normal;color:var(--m-acc)}

/* ---------- roller ---------- */
.roller{border-radius:16px;padding:18px 14px;text-align:center;display:grid;gap:4px;min-height:116px;align-content:center;overflow:hidden;position:relative}
body.her .roller{background:var(--h-paper);border:1.5px dashed var(--h-rule)}
body.him .roller{background:#05070a;border:1px solid var(--m-rule);box-shadow:inset 0 0 30px #000}
.roller .city{font-size:42px;line-height:1.1;font-weight:900}
body.her .roller .city{font-family:var(--f-serif);color:var(--h-ink)}
body.him .roller .city{font:400 56px var(--f-board);color:var(--m-acc);letter-spacing:.06em;text-shadow:0 0 14px #ffb02066}
.roller .ctry{font-size:13px;opacity:.7}
.roller.spin .city{animation:flick .07s steps(1) infinite}
@keyframes flick{50%{opacity:.55}}
.roller.land .city{animation:land .45s cubic-bezier(.2,1.6,.5,1)}
@keyframes land{0%{transform:scale(1.5);filter:blur(3px)}100%{transform:scale(1)}}

/* ---------- ticket ---------- */
.ticket{border-radius:18px;overflow:hidden;display:grid;animation:rise .5s cubic-bezier(.2,1.2,.5,1)}
@keyframes rise{from{transform:translateY(24px);opacity:0}}
.tk-head{padding:18px 18px 14px;display:grid;gap:4px;position:relative}
.tk-route{display:flex;align-items:center;gap:10px;font-weight:900}
.tk-route .code{font-size:34px;line-height:1}
.tk-route .arrow{flex:1;height:2px;position:relative;opacity:.5;background:currentColor}
.tk-route .arrow::after{content:"✈";position:absolute;right:-4px;top:-11px;font-size:16px}
.tk-name{font-size:14px;opacity:.8}
.tease{font-size:15px;font-weight:700;margin-top:4px}
body.him .tease{font-family:var(--f-sans);color:var(--m-ink);opacity:.9}
.tk-body{padding:14px 18px 18px;display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.tk-body>*{min-width:0}
.tk-cut{height:0;border-top:2px dashed;position:relative;margin:0 14px}
.tk-cut::before,.tk-cut::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%}
.tk-cut::before{left:-24px}.tk-cut::after{right:-24px}
.sec{font:700 12px var(--f-sans);letter-spacing:.14em;opacity:.65;margin:0}
.price-now{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.price-now b{font-size:30px;font-variant-numeric:tabular-nums}
.price-now span{font-size:13px;opacity:.7}
.bars{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;align-items:end;height:120px}
.bars .bc{display:grid;grid-template-rows:auto 1fr auto;gap:4px;height:100%;text-align:center;min-width:0}
.bars .v{font:700 10px var(--f-sans);font-variant-numeric:tabular-nums;white-space:nowrap}
.bars .col{align-self:end;border-radius:6px 6px 2px 2px;transition:height .6s cubic-bezier(.2,1.2,.5,1)}
.bars .m{font:500 11px var(--f-sans);opacity:.75}
.bars .bc.best .m{opacity:1;font-weight:900}
.evt{font-size:12px;line-height:1.6;margin:0;opacity:.85;overflow-wrap:anywhere}
.picks{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:p}
.picks li{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;counter-increment:p}
.picks li::before{content:counter(p);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:900 13px var(--f-sans)}
.picks b{display:block;font-size:15px}
.picks span{font-size:13px;opacity:.75;line-height:1.55}
.links{display:flex;gap:8px;flex-wrap:wrap}
.cbar{display:flex;justify-content:space-between;align-items:center;gap:10px;font:700 13px var(--f-sans);color:var(--m-hot);margin:-4px 0 -2px}
.cbar button{border:1px solid var(--m-hot);background:transparent;color:var(--m-hot);font:700 12px var(--f-sans);border-radius:999px;padding:6px 12px;cursor:pointer}
.cbar.done{display:none}
.picks.censor li{position:relative;cursor:pointer;border-radius:8px}
.picks.censor li>div{transition:filter .35s}
.picks.censor li:not(.rev)>div{filter:blur(7px);-webkit-user-select:none;user-select:none}
.picks.censor li:not(.rev)::after{content:"";position:absolute;left:40px;right:0;top:-4px;bottom:-4px;border-radius:6px;
  background:repeating-conic-gradient(#ffffff1c 0 25%,#00000033 0 50%) 0 0/14px 14px;pointer-events:none}
.picks.censor li.rev>div{animation:dec .4s ease-out}
@keyframes dec{0%{filter:blur(7px)}100%{filter:blur(0)}}
.picks.censor li:focus-visible{outline:2px solid var(--m-acc);outline-offset:2px}
.links a{font:700 13px var(--f-sans);text-decoration:none;padding:9px 12px;border-radius:10px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts button{border-radius:12px;padding:13px;font:900 15px var(--f-sans);cursor:pointer}
.toast{font:700 13px var(--f-sans);min-height:1.2em;margin:0;text-align:center;opacity:0}
.toast.on{animation:toast 2.4s forwards}
@keyframes toast{8%,80%{opacity:1}100%{opacity:0}}
#shareTxt{position:absolute;left:-9999px}

body.her .ticket{background:var(--h-paper);box-shadow:0 18px 40px -22px #8c4a5588}
body.her .tk-head{background:var(--h-acc);color:#fff;font-family:var(--f-serif)}
body.her .tk-cut{border-color:var(--h-rule)}
body.her .tk-cut::before,body.her .tk-cut::after{background:var(--h-bg)}
body.her .bars .col{background:var(--h-soft)} body.her .bars .best .col{background:var(--h-acc)}
body.her .picks li::before{background:var(--h-soft);color:var(--h-acc)}
body.her .links a{background:var(--h-soft);color:var(--h-ink)}
body.her .acts button{border:1.5px solid var(--h-acc);background:transparent;color:var(--h-acc)}
body.her .acts button.pri{background:var(--h-acc);color:#fff}
body.her .toast{color:var(--h-acc)}

body.him .ticket{background:var(--m-panel);border:1px solid var(--m-rule)}
body.him .tk-head{background:#05070a;color:var(--m-acc);font-family:var(--f-board);border-bottom:1px solid var(--m-rule)}
body.him .tk-head .code{font-size:44px;letter-spacing:.06em}
body.him .tk-name{font-family:var(--f-sans);color:var(--m-ink)}
body.him .tk-cut{border-color:var(--m-rule)}
body.him .tk-cut::before,body.him .tk-cut::after{background:var(--m-bg)}
body.him .bars .col{background:#2a3442} body.him .bars .best .col{background:var(--m-acc);box-shadow:0 0 14px #ffb02088}
body.him .picks li::before{background:var(--m-hot);color:#fff}
body.him .links a{background:#1f2833;color:var(--m-ink)}
body.him .acts button{border:1px solid var(--m-rule);background:transparent;color:var(--m-ink)}
body.him .acts button.pri{background:var(--m-acc);color:#111;border-color:var(--m-acc)}
body.him .toast{color:var(--m-acc)}

.fxl{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.cf{position:absolute;top:-16px;width:9px;height:14px;border-radius:2px;animation:fall var(--d) cubic-bezier(.25,.6,.5,1) forwards}
@keyframes fall{to{transform:translate(var(--x),105vh) rotate(var(--r))}}
@media (prefers-reduced-motion:reduce){.roller .city,.ticket,.cf{animation:none!important}}
</style>
</head>

<script>
(()=>{
const app=document.getElementById('app');
/* ---------- data ----------

function cost(c,m,nights){const k=(SEASON[c.s]||{})[m]||1;return Math.round((c.f*k+c.h*k*nights/2)/100)*100}

function tripDates(m){const now=new Date();let y=now.getFullYear();if(m<=now.getMonth()+1)y++;const a=new Date(y,m-1,15),b=new Date(y,m-1,15+nights);return[a,b]}
const ymd=(d,sep)=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join(sep);
function skyUrl(c,m){const[a,b]=tripDates(m),f=d=>ymd(d,'').slice(2);return`https://www.skyscanner.com.tw/transport/flights/tpe/${AP[c.id]}/${f(a)}/${f(b)}/?adultsv2=1&cabinclass=economy`}
function agodaUrl(c,m){const[a]=tripDates(m);return`https://www.agoda.com/zh-tw/search?textToSearch=${encodeURIComponent(c.city)}&checkIn=${ymd(a,'-')}&los=${nights}&rooms=1&adults=2`}


/* ---------- audio ---------- */
let ac=null,master=null,nb=null,unlockEl=null,muted=false;
try{muted=localStorage.getItem('td_mute')==='1'}catch(e){}
function silentWav(){const n=4000,b=new ArrayBuffer(44+n),v=new DataView(b);let o=0;const w=t=>{for(const c of t)v.setUint8(o++,c.charCodeAt(0))},u32=x=>{v.setUint32(o,x,true);o+=4},u16=x=>{v.setUint16(o,x,true);o+=2};
  w('RIFF');u32(36+n);w('WAVE');w('fmt ');u32(16);u16(1);u16(1);u32(8000);u32(8000);u16(1);u16(8);w('data');u32(n);for(let k=0;k<n;k++)v.setUint8(o++,128);return URL.createObjectURL(new Blob([b],{type:'audio/wav'}))}
function initAudio(){try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
  try{if(!unlockEl){unlockEl=new Audio(silentWav());unlockEl.loop=true;unlockEl.setAttribute('playsinline','')}unlockEl.play().catch(()=>{})}catch(e){}
  if(ac){ac.resume&&ac.resume();return}
  try{ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=muted?0:1;master.connect(ac.destination);
    nb=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=nb.getChannelData(0);for(let k=0;k<d.length;k++)d[k]=Math.random()*2-1}catch(e){ac=null}}
function tone(f,d,t='triangle',v=.06,at=0,slide){if(!ac)return;const s=ac.currentTime+at,o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.setValueAtTime(f,s);if(slide)o.frequency.exponentialRampToValueAtTime(slide,s+d);g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g).connect(master);o.start(s);o.stop(s+d+.02)}
function noise(d,v,f,at=0,type='bandpass'){if(!ac)return;const s=ac.currentTime+at,src=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain();src.buffer=nb;fl.type=type;fl.frequency.value=f;g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.0001,s+d);src.connect(fl).connect(g).connect(master);src.start(s);src.stop(s+d+.02)}
const mtof=m=>440*Math.pow(2,(m-69)/12);
const SFX={
 her:{tick(){tone(1800+Math.random()*300,.04,'sine',.035)},land(){[76,79,83,88].forEach((m,k)=>tone(mtof(m),.5,'sine',.06,k*.09))},chime(){tone(mtof(88),.8,'sine',.05);tone(mtof(95),.8,'sine',.03,.05)},pick(){tone(1200,.06,'sine',.05)}},
 him:{tick(){noise(.025,.18,2500,0,'highpass');tone(140,.03,'square',.04)},land(){tone(70,.35,'sine',.35,0,40);[60,63,67,72].forEach((m,k)=>tone(mtof(m),.2,'sawtooth',.05,k*.07));noise(.5,.12,800,.05)},chime(){tone(mtof(72),.15,'square',.05);tone(mtof(79),.25,'square',.05,.12)},pick(){tone(200,.05,'square',.06)}}
};
function setMute(m,btn){muted=m;try{localStorage.setItem('td_mute',m?'1':'0')}catch(e){}if(master)master.gain.setTargetAtTime(m?0:1,ac.currentTime,.02);if(btn)btn.innerHTML=icon()}
const icon=()=>muted?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg>';
const fxl=document.createElement('div');fxl.className='fxl';document.body.appendChild(fxl);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function confetti(cols,n=70){if(reduce)return;for(let k=0;k<n;k++){const e=document.createElement('i');e.className='cf';e.style.left=Math.random()*100+'vw';e.style.background=cols[k%cols.length];
  e.style.setProperty('--x',(Math.random()*160-80)+'px');e.style.setProperty('--r',(Math.random()*900-450)+'deg');e.style.setProperty('--d',(1.4+Math.random()*1.3)+'s');e.style.animationDelay=Math.random()*.25+'s';fxl.appendChild(e);setTimeout(()=>e.remove(),3000)}}

/* ---------- state ---------- */
let side=null,budget=0,nights=4,last=null,mineMem=null;
try{budget=+(localStorage.getItem('td_budget')||0);nights=+(localStorage.getItem('td_nights')||4)}catch(e){}
const BUDGETS=[[0,'不限'],[20000,'2萬內'],[35000,'3.5萬內'],[60000,'6萬內']];
const NIGHTS=[[3,'3晚'],[4,'4晚'],[6,'6晚']];

function gate(){
  side=null;document.body.className='';
  app.innerHTML=`<div class="gate">
    <h1>你的下一張機票，<br>早就寫好了。</h1>
    <p>抽一下就知道是哪裡。順便幫你算好半年內什麼時候飛最便宜，省下來的錢，剛好拿去多買一點。</p>
  </div>
  <div class="doors">
    <button class="door her" id="dHer"><span class="big">她</span><b>抽城市＋必買清單</b><small>行李箱記得留一半空位</small></button>
    <button class="door him" id="dHim"><span class="big">HIS</span><b>抽城市＋夜晚行程</b><small>這頁不要給她看到</small></button>
  </div>
  <p class="block" id="block" role="alert"></p>
  <p class="note">價格是估的，衝動是真的。實際票價以訂票網站為準。</p>`;
  let mine=mineMem;try{mine=localStorage.getItem('td_side')||mineMem}catch(e){}
  const BLOCK={her:'女生不准偷看男生行程 🙈<br>他去哪裡玩，妳不需要知道。',him:'男生不准偷看女生行程 🙅<br>她的必買清單是秘密。'};
  const open=s=>{initAudio();
    if(mine&&mine!==s){const d=document.getElementById(s==='her'?'dHer':'dHim'),bl=document.getElementById('block');
      d.classList.remove('nope');void d.offsetWidth;d.classList.add('nope');bl.innerHTML=BLOCK[mine];bl.classList.remove('on');void bl.offsetWidth;bl.classList.add('on');
      tone(220,.18,'square',.07);tone(180,.25,'square',.07,.12);try{navigator.vibrate&&navigator.vibrate([40,40,40])}catch(e){}return}
    mine=s;mineMem=s;try{localStorage.setItem('td_side',s)}catch(e){}room(s)};
  document.getElementById('dHer').onclick=()=>open('her');
  document.getElementById('dHim').onclick=()=>open('him');
  if(mine)document.getElementById(mine==='her'?'dHim':'dHer').classList.add('locked');
}
function segHTML(id,list,cur,n3){return`<div class="seg${n3?' n3':''}" id="${id}">${list.map(([v,l])=>`<button data-v="${v}" aria-pressed="${v===cur}">${l}</button>`).join('')}</div>`}
function room(s){
  side=s;document.body.className=s;last=null;
  const H=s==='her';
  app.innerHTML=`<div class="top"><button class="back" id="bk">← 回大廳</button><button class="mute" id="mu" aria-label="聲音開關">${icon()}</button></div>
  <h2>${H?'她的<em>下一站</em>':'HIS <em>NEXT STOP</em>'}</h2>
  <div class="filters">
    <span class="flab">${H?'預算（妳說了算）':'預算（別讓她知道）'}</span>${segHTML('fb',BUDGETS,budget)}
    <span class="flab">${H?'要待幾晚':'要消失幾晚'}</span>${segHTML('fn',NIGHTS,nights,1)}
  </div>
  <div class="roller" id="roller"><div class="city">${H?'？':'???'}</div><div class="ctry">${H?`${CITIES.length} 座城市在等妳翻牌`:`${CITIES.length} CITIES・一張單程好運`}</div></div>
  <button class="draw" id="go">${H?'讓命運決定':'DRAW'}</button>
  <div id="out"></div>`;
  document.getElementById('bk').onclick=gate;
  const mu=document.getElementById('mu');mu.onclick=()=>{initAudio();setMute(!muted,mu)};
  const bind=(id,set)=>document.querySelectorAll('#'+id+' button').forEach(b=>b.onclick=()=>{set(+b.dataset.v);SFX[side].pick();
    document.querySelectorAll('#'+id+' button').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));if(last)ticket(last,false)});
  bind('fb',v=>{budget=v;try{localStorage.setItem('td_budget',v)}catch(e){}});
  bind('fn',v=>{nights=v;try{localStorage.setItem('td_nights',v)}catch(e){}});
  document.getElementById('go').onclick=spin;
}
function pool(){const ms=months();const ok=CITIES.filter(c=>!budget||Math.min(...ms.map(m=>cost(c,m,nights)))<=budget);return ok.length?ok:CITIES}
function spin(){
  const go=document.getElementById('go'),r=document.getElementById('roller'),cityEl=r.querySelector('.city'),ctryEl=r.querySelector('.ctry');
  const P=pool();let pick=P[Math.random()*P.length|0];if(last&&P.length>1)while(pick.id===last.id)pick=P[Math.random()*P.length|0];
  go.disabled=true;document.getElementById('out').innerHTML='';r.className='roller spin';
  const S=SFX[side],steps=reduce?1:22;let k=0;
  const H=side==='her';
  const t=()=>{const c=k<steps-1?CITIES[Math.random()*CITIES.length|0]:pick;cityEl.textContent=H?c.city:c.code;ctryEl.textContent=H?c.ctry:c.city+'・'+c.ctry;S.tick();k++;
    if(k<steps)setTimeout(t,40+k*k*.55);else{r.className='roller land';S.land();go.disabled=false;go.textContent=H?'不滿意？再抽':'NOT THIS ONE';last=pick;ticket(pick,true)}};
  t();
}
function ticket(c,fresh){
  const H=side==='her',ms=months(),cs=ms.map(m=>cost(c,m,nights)),min=Math.min(...cs),max=Math.max(...cs),bi=cs.indexOf(min);
  const ev=EVENTS[c.id]||{},evs=ms.filter(m=>ev[m]).map(m=>`${MN[m]}${ev[m]}`);
  const picks=H?c.her:c.him;
    document.getElementById('out').innerHTML=`<article class="ticket">
    <div class="tk-head"><div class="tk-route"><span class="code">TPE</span><span class="arrow"></span><span class="code">${c.code}</span></div>
      <div class="tk-name">${H?`${c.city}・${c.ctry}`:`${c.city}・${c.ctry}　${nights} NIGHTS`}</div><div class="tease">「${(TEASE[c.id]||['',''])[H?0:1]}」</div></div>
    <div class="tk-cut"></div>
    <div class="tk-body">
      <p class="sec">${H?'半年內什麼時候飛最划算':'NEXT 6 MONTHS・機＋酒／人'}</p>
      <div class="price-now"><b>${fmt(min)}</b><span>${H?`${MN[ms[bi]]}飛最省，省下的錢剛好多買一個包`:`${MN[ms[bi]]}最便宜，剩下的預算都是酒錢`}・住 ${nights} 晚、雙人房平分</span></div>
      <div class="bars">${cs.map((v,k)=>`<div class="bc${k===bi?' best':''}"><span class="v">${Math.round(v/1000*10)/10}k</span><span class="col" style="height:${fresh&&!reduce?0:28+72*(v-min)/((max-min)||1)}%" data-h="${28+72*(v-min)/((max-min)||1)}"></span><span class="m">${MN[ms[k]]}</span></div>`).join('')}</div>
      ${evs.length?`<p class="evt">${H?`剛好碰上${evs.join('、')}，人會多、價錢會高，但很值得`:`EVENT：${evs.join('、')}，那幾天最熱鬧`}</p>`:''}
      <div class="tk-cut" style="margin:0 -4px"></div>
      <p class="sec">${H?'這 5 樣沒帶回來會後悔':'這 5 件沒做，等於沒去'}</p>
      ${H?'':`<div class="cbar"><span>🔒 行程已打碼，點一下解碼</span><button id="uncensor">全部解碼</button></div>`}
      <ol class="picks${H?'':' censor'}">${picks.map(([t,d])=>`<li${H?'':' tabindex="0" role="button" aria-label="點一下解碼"'}><div><b>${t}</b><span>${d}</span></div></li>`).join('')}</ol>
      <div class="links">
        <a href="${skyUrl(c,ms[bi])}" target="_blank" rel="noopener">${H?'Skyscanner 看今天票價':'Skyscanner 看票價'}</a>
        <a href="${agodaUrl(c,ms[bi])}" target="_blank" rel="noopener">${H?'Agoda 先搶房':'Agoda 訂房'}</a>
      </div>
      <div class="acts"><button id="cp">${H?'複製去炫耀':'複製去嗆朋友'}</button><button class="pri" id="again">${H?'不滿意？再抽':'NOT THIS ONE'}</button></div>
      <p class="toast" id="toast" role="status"></p>
    </div></article>`;
  if(fresh&&!reduce)requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('.bars .col').forEach(b=>b.style.height=b.dataset.h+'%')));
  if(fresh){confetti(H?['#c8536b','#f3dcd8','#e8b4a0','#ffffff']:['#ffb020','#ff3d5a','#ffffff','#2a3442']);setTimeout(SFX[side].chime,500)}
  if(!H){const lis=[...document.querySelectorAll('.picks.censor li')];
    const reveal=li=>{if(li.classList.contains('rev'))return;li.classList.add('rev');li.removeAttribute('role');li.removeAttribute('aria-label');tone(900+Math.random()*300,.06,'square',.05);noise(.12,.1,4000,0,'highpass')};
    lis.forEach(li=>{li.onclick=()=>reveal(li);li.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();reveal(li)}}});
    document.getElementById('uncensor').onclick=e=>{lis.forEach((li,k)=>setTimeout(()=>reveal(li),k*120));e.target.closest('.cbar').classList.add('done')}}
  document.getElementById('again').onclick=()=>{window.scrollTo({top:0,behavior:reduce?'auto':'smooth'});spin()};
  document.getElementById('cp').onclick=()=>{
    const site=/github\.io$/.test(location.hostname)?'\n'+location.origin+location.pathname:'';
    const t=H?`命運說我下一站是${c.city}🌸\n${MN[ms[bi]]}飛最划算，機＋酒才 ${fmt(min)}\n必買清單已經列好了：${picks.slice(0,3).map(p=>p[0]).join('、')}\n誰要跟？妳抽到哪👇${site}`
             :`我抽到 ${c.city} ✈️\n${MN[ms[bi]]}去，機＋酒 ${fmt(min)}\n行程內容不方便公開😏\n你抽到哪👇${site}`;
    const ok=()=>{say(H?'複製好了，去 Threads 炫耀':'複製好了，去 Threads 嗆朋友');SFX[side].pick()};
    const fb=()=>{const ta=document.getElementById('shareTxt');ta.value=t;ta.select();try{document.execCommand('copy')?ok():say('瀏覽器不讓複製，請截圖分享')}catch(e){say('瀏覽器不讓複製，請截圖分享')}};
    try{navigator.clipboard.writeText(t).then(ok,fb)}catch(e){fb()}};
}
function say(t){const el=document.getElementById('toast');el.textContent=t;el.classList.remove('on');void el.offsetWidth;el.classList.add('on')}
gate();
})();
</script>
