 maitake(g,u,R){for(let i=0;i<6;i++){g.save();g.rotate(-.9+i*.35);g.fillStyle=i%2?"#7a5233":"#5d3d24";g.beginPath();g.ellipse(u*.15,0,u*.25,u*.1,0,0,7);g.fill();g.restore()}g.fillStyle="#d9c3a0";g.beginPath();g.arc(-u*.05,u*.05,u*.06,0,7);g.fill()},
 cheese(g,u,R){g.fillStyle="rgba(255,244,210,.92)";g.beginPath();for(let i=0;i<=16;i++){const a=i/16*6.28,r=u*(.25+R()*.1);i?g.lineTo(Math.cos(a)*r,Math.sin(a)*r*.8):g.moveTo(Math.cos(a)*r,Math.sin(a)*r*.8)}g.closePath();g.fill();
   g.fillStyle="rgba(230,170,70,.35)";g.beginPath();g.ellipse(u*.05,u*.05,u*.15,u*.08,0,0,7);g.fill();shine(g,-u*.08,-u*.06,u*.12,u*.05,.7)},
 lemon(g,u,R){g.fillStyle="#f7d84a";g.beginPath();g.arc(0,0,u*.24,0,7);g.fill();g.fillStyle="#fff3b0";g.beginPath();g.arc(0,0,u*.2,0,7);g.fill();g.fillStyle="#f8e070";
   for(let k=0;k<8;k++){g.beginPath();g.moveTo(0,0);g.arc(0,0,u*.18,k/8*6.28+.06,(k+1)/8*6.28-.06);g.closePath();g.fill()}}
};
const SIZE={leg:1.0,kakuni:1.0,hamburg:1.0,shrimp:1.0,eggplant:.95,pumpkin:1.1,carrot:.9,pepper:.95,beans:.9,broccoli:1.15,corn:1.15,lotus:1.1,okra:.95,egg:1.2,potato:1.05,maitake:1.1,cheese:1.1,lemon:1.0};
const ICONU={leg:52,kakuni:70,hamburg:80,shrimp:58,eggplant:60,pumpkin:95,carrot:64,pepper:70,beans:64,broccoli:105,corn:130,lotus:125,okra:80,egg:120,potato:95,maitake:105,cheese:115,lemon:130};

/* ---------- bowl ---------- */
const B=$("#bowl"),bg=B.getContext("2d");const S=900,CX=S*.5,CY=S*.5,RO=S*.44,RI=S*.36;
let bowlLayer=null,soupLayer=null;
function makeBowl(){const c=document.createElement("canvas");c.width=c.height=S;const g=c.getContext("2d");
  g.fillStyle="rgba(0,0,0,.35)";g.beginPath();g.ellipse(CX+14,CY+22,RO*1.02,RO*1.0,0,0,7);g.fill();
  const gr=g.createRadialGradient(CX-RO*.3,CY-RO*.3,RO*.2,CX,CY,RO);gr.addColorStop(0,"#45454b");gr.addColorStop(1,"#18181b");g.fillStyle=gr;g.beginPath();g.arc(CX,CY,RO,0,7);g.fill();
  g.strokeStyle="rgba(255,255,255,.06)";g.lineWidth=3;for(let i=0;i<120;i++){const a=i/120*6.28;g.beginPath();g.moveTo(CX+Math.cos(a)*RI*1.04,CY+Math.sin(a)*RI*1.04);g.lineTo(CX+Math.cos(a)*RO*.97,CY+Math.sin(a)*RO*.97);g.stroke()}
  g.strokeStyle="rgba(255,255,255,.22)";g.lineWidth=5;g.beginPath();g.arc(CX,CY,RO-3,Math.PI*1.05,Math.PI*1.6);g.stroke();
  g.fillStyle="#111";g.beginPath();g.arc(CX,CY,RI+6,0,7);g.fill();return c}
function makeSoup(){const b=BASES[st.base],sp=st.spice/10;const c=document.createElement("canvas");c.width=c.height=S;const g=c.getContext("2d");
  const c1=b.id==="black"?b.c1:mixc(b.c1,"#c8402f",sp*.55),c2=b.id==="black"?b.c2:mixc(b.c2,"#7a1a10",sp*.5);
  const gr=g.createRadialGradient(CX-RI*.2,CY-RI*.25,RI*.05,CX,CY,RI);gr.addColorStop(0,c1);gr.addColorStop(1,c2);g.fillStyle=gr;g.beginPath();g.arc(CX,CY,RI,0,7);g.fill();
  g.save();g.beginPath();g.arc(CX,CY,RI,0,7);g.clip();const R=RNG(st.base*31+st.spice);
  for(let i=0;i<900;i++){const a=R()*6.28,r=Math.sqrt(R())*RI;g.fillStyle=R()<.7?"rgba(60,25,10,.35)":(R()<.5?"rgba(90,120,40,.5)":"rgba(255,220,160,.3)");g.beginPath();g.arc(CX+Math.cos(a)*r,CY+Math.sin(a)*r,R()*2.5+.6,0,7);g.fill()}
  const oil=22+st.spice*5;for(let i=0;i<oil;i++){const a=R()*6.28,r=Math.sqrt(R())*RI*.95,rr=R()*5+2;g.fillStyle=`rgba(${b.id==="black"?"150,90,50":"255,"+(150-st.spice*8)+",50"},${.18+st.spice*.015})`;g.beginPath();g.arc(CX+Math.cos(a)*r,CY+Math.sin(a)*r,rr,0,7);g.fill();g.fillStyle="rgba(255,255,230,.35)";g.beginPath();g.arc(CX+Math.cos(a)*r-rr*.3,CY+Math.sin(a)*r-rr*.3,rr*.3,0,7);g.fill()}
  if(st.spice>=6){for(let i=0;i<st.spice*2;i++){const a=R()*6.28,r=Math.sqrt(R())*RI*.9;g.fillStyle="rgba(200,40,20,.7)";g.beginPath();g.ellipse(CX+Math.cos(a)*r,CY+Math.sin(a)*r,5,2.5,R()*3,0,7);g.fill()}}
  const sh=g.createLinearGradient(CX-RI,CY-RI,CX+RI,CY+RI);sh.addColorStop(0,"rgba(255,255,255,.18)");sh.addColorStop(.4,"rgba(255,255,255,0)");g.fillStyle=sh;g.fillRect(CX-RI,CY-RI,RI*2,RI*2);
  g.restore();soupLayer=c}
/* slots: polar positions inside soup */
const SLOTS=[[.18,3.4],[.5,-1.15],[.52,-.35],[.5,.45],[.47,1.25],[.52,2.05],[.3,-.7],[.3,.95],[.56,2.85],[.55,4.3],[.45,5.1],[.22,.1]];
function layout(){const prev=items;items=[];const m=MAINS[st.main];
  const keep=k=>prev.find(p=>p.kind===k);
  const mk=(kind,slot,i)=>{const old=keep(kind);if(old){old.slot=slot;return old}const [r,a]=SLOTS[slot];return{kind,slot,rot:(RNG(i*97+kind.length)()-.5)*1.4+(kind==="leg"?-.5:0),seed:Math.floor(Math.random()*1e6),t0:performance.now()}};
  items.push(mk(m.id,0,0));st.veg.forEach((v,i)=>items.push(mk(v,1+i,i+1)))}
function slotXY(it){const [r,a]=SLOTS[it.slot];return[CX+Math.cos(a)*r*RI,CY+Math.sin(a)*r*RI]}
let ripples=[],steam=[],last=performance.now(),T=0;
const steamSpr=(()=>{const c=document.createElement("canvas");c.width=c.height=128;const g=c.getContext("2d");const gr=g.createRadialGradient(64,64,0,64,64,64);gr.addColorStop(0,"rgba(255,255,255,.55)");gr.addColorStop(1,"rgba(255,255,255,0)");g.fillStyle=gr;g.fillRect(0,0,128,128);return c})();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;const g=bg;g.clearRect(0,0,S,S);
  g.drawImage(bowlLayer,0,0);g.save();g.beginPath();g.arc(CX,CY,RI,0,7);g.clip();
  g.translate(CX,CY);g.rotate(Math.sin(T*.2)*.01);g.translate(-CX,-CY);g.drawImage(soupLayer,0,0);g.restore();
  // ripples
  for(let i=ripples.length-1;i>=0;i--){const r=ripples[i];r.t+=dt;if(r.t>1){ripples.splice(i,1);continue}g.save();g.beginPath();g.arc(CX,CY,RI,0,7);g.clip();g.strokeStyle=`rgba(255,240,210,${.5*(1-r.t)})`;g.lineWidth=4;g.beginPath();g.arc(r.x,r.y,20+r.t*110,0,7);g.stroke();g.restore()}
  // items (veg first behind main? main first then veg on top looks natural for side items)
  const order=[...items].sort((a,b)=>a.slot===0?-1:b.slot===0?1:0);
  for(const it of order){const [x,y]=slotXY(it);const age=(now-it.t0)/1000;const k=Math.min(1,age/.35);const drop=(1-k)*(1-k);const sc=1+drop*.5;const u=RI*.62*(SIZE[it.kind]||.9);
    g.save();g.translate(x,y-drop*60);g.rotate(it.rot);g.scale(sc,sc);
    g.save();g.translate(6,9);g.globalAlpha=.35*k;g.scale(1,.6);const sg=g.createRadialGradient(0,0,0,0,0,u*.55);sg.addColorStop(0,"rgba(0,0,0,.8)");sg.addColorStop(1,"rgba(0,0,0,0)");g.fillStyle=sg;g.beginPath();g.arc(0,0,u*.55,0,7);g.fill();g.restore();
    DRAW[it.kind](g,u,RNG(it.seed));g.restore()}
  // rice plate drawn on top-right? keep bowl only
  // steam
  if(steam.length<26)steam.push({x:CX+(Math.random()-.5)*RI*1.2,y:CY+(Math.random()-.3)*RI*.8,s:40+Math.random()*50,l:0,m:2.5+Math.random()*2.5});
  for(let i=steam.length-1;i>=0;i--){const p=steam[i];p.l+=dt;p.y-=30*dt;p.x+=Math.sin(p.l*1.4+i)*.4;p.s+=10*dt;const kk=p.l/p.m;if(kk>=1){steam.splice(i,1);continue}g.globalAlpha=Math.sin(Math.PI*kk)*.2;g.drawImage(steamSpr,p.x-p.s,p.y-p.s,p.s*2,p.s*2)}
  g.globalAlpha=1;requestAnimationFrame(frame)}

/* ---------- icons ---------- */
function icon(kind,isSoup){const c=document.createElement("canvas");c.width=c.height=88;const g=c.getContext("2d");
  if(isSoup){const b=BASES[kind];const gr=g.createRadialGradient(36,34,4,44,44,38);gr.addColorStop(0,b.c1);gr.addColorStop(1,b.c2);g.fillStyle="#222";g.beginPath();g.arc(44,44,42,0,7);g.fill();g.fillStyle=gr;g.beginPath();g.arc(44,44,34,0,7);g.fill();return c}
  g.translate(44,44);DRAW[kind](g,ICONU[kind]||70,RNG(7));return c}

/* ---------- steps UI ---------- */
const STEPS=[
 {t:"選一個湯底",render(el){el.className="opts three";el.innerHTML="";BASES.forEach((b,i)=>el.appendChild(opt(icon(i,true),b.name,b.sub,i===st.base,()=>{st.base=i;makeSoup();SND.plop(.9);refresh()})))}},
 {t:"要多辣？",render(el){el.className="spice";el.innerHTML=`<div class="lv"><b id="spN">${st.spice}</b><span id="spT">${SPICE[st.spice]}</span></div><div class="peppers" id="pp"></div><input type="range" id="sp" min="0" max="10" value="${st.spice}" aria-label="辣度">`;
   const pp=()=>{$("#pp").textContent="🌶".repeat(Math.max(0,Math.ceil(st.spice/2)))||"🥛"};pp();
   $("#sp").oninput=e=>{st.spice=+e.target.value;$("#spN").textContent=st.spice;$("#spT").textContent=SPICE[st.spice];pp();makeSoup();SND.tick()}}},
 {t:"選主角",render(el){el.className="opts";el.innerHTML="";MAINS.forEach((m,i)=>el.appendChild(opt(icon(m.id),m.name,m.sub,i===st.main,()=>{st.main=i;layout();drop(0);SND.plop(.7);refresh()})))}},
 {t:"加蔬菜",render(el){el.className="opts";el.innerHTML="";VEG.forEach(([id,n,p])=>el.appendChild(opt(icon(id),n,`+¥${p}`,st.veg.includes(id),()=>{const i=st.veg.indexOf(id);if(i>=0)st.veg.splice(i,1);else{if(st.veg.length>=MAXV){toastMax();return}st.veg.push(id)}layout();if(i<0)drop(st.veg.length);SND.plop(1+Math.random()*.3);refresh()})))}}];
function opt(cv,name,sub,on,fn){const b=document.createElement("button");b.type="button";b.className="op";b.setAttribute("aria-pressed",on);b.appendChild(cv);b.insertAdjacentHTML("beforeend",`<span>${name}</span>${sub?`<small>${sub}</small>`:""}`);b.onclick=()=>{SND.init();fn()};return b}
function drop(slot){const it=items.find(x=>x.slot===slot);if(!it)return;it.t0=performance.now();const [x,y]=slotXY(it);setTimeout(()=>ripples.push({x,y,t:0}),280)}
let maxT;function toastMax(){$("#qs").textContent=`最多 ${MAXV} 樣`;clearTimeout(maxT);maxT=setTimeout(refresh,1200)}
function price(){return BASES[st.base].price+MAINS[st.main].price+st.veg.reduce((s,v)=>s+VEG.find(x=>x[0]===v)[2],0)+(st.spice>=6?50:0)}
function refresh(){$("#qt").textContent=STEPS[st.step].t;$("#qs").textContent=st.step===3?`已加 ${st.veg.length} / ${MAXV}`:`${st.step+1} / 4`;
  [...$("#steps").children].forEach((x,i)=>x.classList.toggle("on",i<=st.step));
  $("#back").style.visibility=st.step?"visible":"hidden";$("#next").textContent=st.step===3?"上桌！":"下一步";
  $("#price").textContent="¥"+price().toLocaleString()}
function go(n){st.step=n;STEPS[n].render($("#body"));refresh()}
$("#next").onclick=()=>{SND.init();SND.tick();if(st.step<3)go(st.step+1);else serve()};
$("#back").onclick=()=>{SND.tick();if(st.step>0)go(st.step-1)};

/* ---------- result card ---------- */
const PREFIX=["初雪","大通","雪見","小樽","狸小路","薄野"];
function spiceWho(s){return s<=2?"對自己很溫柔":s<=5?"剛剛好就是最好":s<=8?"嘴上說不要，身體很誠實":"愛就要愛到流淚"}
let cardBlob=null;
async function serve(){SND.ding();try{await document.fonts.ready}catch(e){}
  const W=1080,H=1350,c=document.createElement("canvas");c.width=W;c.height=H;const g=c.getContext("2d");
  const wg=g.createLinearGradient(0,0,W,0);["#80543a","#7a4f33","#845a3e","#76492f"].forEach((col,i)=>wg.addColorStop(i/3,col));g.fillStyle=wg;g.fillRect(0,0,W,H);
  g.strokeStyle="rgba(60,35,20,.25)";g.lineWidth=2;for(let x=0;x<W;x+=26){g.beginPath();g.moveTo(x+Math.sin(x)*6,0);g.lineTo(x,H);g.stroke()}
  g.drawImage(B,W/2-380,70,760,760);
  // paper ticket
  g.save();g.translate(0,0);g.shadowColor="rgba(0,0,0,.4)";g.shadowBlur=30;g.fillStyle="#fbf6ec";g.beginPath();g.roundRect(70,830,W-140,460,24);g.fill();g.restore();
  const b=BASES[st.base],m=MAINS[st.main];const pre=PREFIX[Math.floor(Math.random()*PREFIX.length)];const name=`${pre}${b.name}${m.name}湯咖哩`;
  g.fillStyle="#3a2a20";g.textAlign="left";g.font="900 52px 'Zen Maru Gothic','Noto Sans TC',sans-serif";g.fillText(name,110,915);
  g.fillStyle="#c8402f";g.font="700 32px 'Noto Sans TC',sans-serif";g.fillText(`辣度 ${st.spice}・${SPICE[st.spice]}`,110,968);
  g.textAlign="right";g.fillStyle="#3a2a20";g.font="900 46px 'Zen Maru Gothic','Noto Sans TC',sans-serif";g.fillText("¥"+price().toLocaleString(),W-110,915);g.textAlign="left";
  const veg=st.veg.map(v=>VEG.find(x=>x[0]===v)[1]);g.fillStyle="#8b7663";g.font="30px 'Noto Sans TC',sans-serif";
  const line=veg.length?`配料：${veg.join("、")}`:"配料：只要湯和主角就好";let y=1022;let s="";for(const ch of line){if(g.measureText(s+ch).width>W-220){g.fillText(s,110,y);y+=42;s=ch}else s+=ch}g.fillText(s,110,y);
  g.strokeStyle="#eadfcd";g.setLineDash([10,8]);g.beginPath();g.moveTo(110,y+30);g.lineTo(W-110,y+30);g.stroke();g.setLineDash([]);
  g.fillStyle="#3a2a20";g.font="36px 'LXGW WenKai TC','Kaiti TC',serif";const who=`會點這碗的妳，${b.who}；${spiceWho(st.spice)}，而且${m.who}。`;
  y+=88;s="";for(const ch of who){if(g.measureText(s+ch).width>W-220){g.fillText(s,110,y);y+=50;s=ch}else s+=ch}g.fillText(s,110,y);
  g.fillStyle="#fff7ea";g.textAlign="center";g.font="700 30px 'Noto Sans TC',sans-serif";g.fillText("札幌湯咖哩・自己做一碗 → 妳的是哪一碗？",W/2,H-22);
  c.toBlob(bl=>{cardBlob=bl;$("#card").src=URL.createObjectURL(bl);$("#res").hidden=false},"image/jpeg",.9)}
$("#again").onclick=()=>{$("#res").hidden=true;st.veg=[];layout();go(0)};
$("#share").onclick=async()=>{if(!cardBlob)return;const f=new File([cardBlob],"我的湯咖哩.jpg",{type:"image/jpeg"});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]});return}catch(e){if(e.name==="AbortError")return}}
  const a=document.createElement("a");a.href=$("#card").src;a.download="我的湯咖哩.jpg";document.body.appendChild(a);a.click();a.remove();$("#tip").textContent="如果沒有開始下載，長按圖片就能儲存"};

/* ---------- sound ---------- */
const SND=(()=>{let ac=null,m=null,muted=false,el=null;try{muted=localStorage.getItem("scMute")==="1"}catch(e){}
  function silent(){const n=4410,b=new ArrayBuffer(44+n*2),v=new DataView(b);const w=(o,s)=>[...s].forEach((ch,i)=>v.setUint8(o+i,ch.charCodeAt(0)));w(0,"RIFF");v.setUint32(4,36+n*2,true);w(8,"WAVEfmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,44100,true);v.setUint32(28,88200,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,"data");v.setUint32(40,n*2,true);return URL.createObjectURL(new Blob([b],{type:"audio/wav"}))}
  function init(){if(ac){if(ac.state!=="running")ac.resume().catch(()=>{});return}try{if(navigator.audioSession)navigator.audioSession.type="playback"}catch(e){}try{el=new Audio(silent());el.loop=true;el.play().catch(()=>{})}catch(e){}
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return;ac=new C();m=ac.createGain();m.gain.value=muted?0:.8;m.connect(ac.destination);
    // simmer: filtered noise bubbles
    const buf=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate),d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(Math.random()<.002?1:.05);
    const s=ac.createBufferSource();s.buffer=buf;s.loop=true;const f=ac.createBiquadFilter();f.type="bandpass";f.frequency.value=900;f.Q.value=1.5;const gg=ac.createGain();gg.gain.value=.25;s.connect(f);f.connect(gg);gg.connect(m);s.start();upd()}
  const btn=$("#snd");function upd(){btn.textContent=muted?"🔇":(ac?"🔊":"🔈")}
  btn.onclick=()=>{if(!ac){init();return}muted=!muted;try{localStorage.setItem("scMute",muted?"1":"0")}catch(e){}m.gain.setTargetAtTime(muted?0:.8,ac.currentTime,.05);upd()};
  const env=(o,g,t,a,d)=>{g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(a,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(m);o.start(t);o.stop(t+d+.05)};
  return{init,
    plop(p=1){if(!ac||muted)return;const t=ac.currentTime+.25,o=ac.createOscillator(),g=ac.createGain();o.type="sine";o.frequency.setValueAtTime(700*p,t);o.frequency.exponentialRampToValueAtTime(180*p,t+.12);env(o,g,t,.35,.16)},
    tick(){if(!ac||muted)return;const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type="triangle";o.frequency.value=1500;env(o,g,t,.08,.05)},
    ding(){if(!ac||muted)return;const t=ac.currentTime;[1047,1319,1568].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type="sine";o.frequency.value=f;env(o,g,t+i*.09,.18,1.2)})}}})();

/* ---------- boot ---------- */
bowlLayer=makeBowl();makeSoup();st.veg=["pumpkin","eggplant","carrot","beans","egg"];layout();items.forEach(i=>i.t0=-1e4);go(0);requestAnimationFrame(frame);
</script>
