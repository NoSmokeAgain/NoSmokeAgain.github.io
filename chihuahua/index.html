<style>
:root{--bg:#fff4e8;--ink:#2a1f1a;--mute:#8a7566;--card:#fffdf9;--pink:#ff6fa5;--blue:#4b8cf5;--y:#ffcb3d;--line:#2a1f1a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#fff4e8;--ink:#2a1f1a;--mute:#8a7566;--card:#fffdf9}}
:root[data-theme="dark"]{--bg:#fff4e8;--ink:#2a1f1a;--mute:#8a7566;--card:#fffdf9}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background-image:radial-gradient(#f3dcc6 1.2px,transparent 1.2px);background-size:18px 18px}
main{max-width:480px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 14px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{margin:6px 0 2px;font-size:30px;font-weight:900;letter-spacing:-.01em}
h1 em{font-style:normal;color:var(--pink)}
.lead{margin:0 0 12px;color:var(--mute);font-size:14px;font-weight:700}
#mute{width:38px;height:38px;border:3px solid var(--line);border-radius:12px;background:var(--card);font-size:16px;flex:none}
.parents{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:8px 8px 10px;box-shadow:0 5px 0 var(--line);position:relative;min-width:0}
.card .who{position:absolute;top:-12px;left:10px;font-weight:900;font-size:13px;padding:3px 10px;border-radius:99px;border:2px solid var(--line);color:#fff;z-index:2}
.dad .who{background:var(--blue)}.mom .who{background:var(--pink)}
.card canvas{display:block;width:100%;aspect-ratio:1/1;border-radius:12px;background:#e4e0db}
.nm{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:6px 2px 4px;font-weight:900;font-size:15px}
.nm span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rar{font-size:11px;font-weight:900;padding:2px 7px;border-radius:6px;border:2px solid var(--line);flex:none}
.r-N{background:#e9e4dc}.r-R{background:#9be3ff}.r-SR{background:#d6a6ff}.r-SSR{background:var(--y)}.r-UR{background:linear-gradient(90deg,#ff7ab6,#ffd24a,#7af0b3,#7ab8ff);}
.chips{display:flex;flex-wrap:wrap;gap:4px;min-height:44px;align-content:flex-start}
.chip{font-size:11px;font-weight:800;background:#f6eadc;border-radius:6px;padding:2px 6px}
.chip.rare{background:#ffe27a}.chip.mut{background:#ffd1e6}
.btn{appearance:none;border:3px solid var(--line);border-radius:14px;background:var(--y);color:var(--ink);font-family:inherit;font-weight:900;font-size:16px;padding:10px 12px;box-shadow:0 4px 0 var(--line);cursor:pointer;width:100%;margin-top:8px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.big{font-size:22px;padding:15px;margin-top:16px;background:var(--pink);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.btn.ghost{background:var(--card)}
#babyWrap{margin-top:22px}
#babyWrap[hidden]{display:none}
.baby{padding:12px}
.baby .who{background:linear-gradient(90deg,#ff7ab6,#ffb24a);left:50%;transform:translateX(-50%);font-size:14px}
.baby canvas{border-radius:14px}
.bname{text-align:center;margin:10px 0 0;font-size:28px;font-weight:900}
.bsub{text-align:center;margin:2px 0 8px;font-size:14px;color:var(--mute);font-weight:800}
.brow{display:flex;justify-content:center;gap:8px;align-items:center;margin-bottom:8px}
.brow .rar{font-size:15px;padding:3px 12px}
.genes{display:grid;gap:5px;margin:8px 0}
.gene{display:grid;grid-template-columns:54px 1fr auto;gap:8px;align-items:center;font-size:14px;font-weight:800;background:#fbf2e7;border-radius:10px;padding:6px 10px}
.gene small{color:var(--mute);font-weight:700}
.src{font-size:11px;font-weight:900;padding:2px 7px;border-radius:99px;color:#fff}
.s-d{background:var(--blue)}.s-m{background:var(--pink)}.s-x{background:linear-gradient(90deg,#9b5cff,#ff5ca8)}
.comment{text-align:center;font-weight:900;font-size:16px;margin:10px 0 2px}
.like{display:flex;height:12px;border-radius:99px;overflow:hidden;border:2px solid var(--line);margin:8px 0 2px}
.like i{background:var(--blue)}.like b{background:var(--pink)}.like s{background:#b58cff}
.likel{display:flex;justify-content:space-between;font-size:11px;font-weight:800;color:var(--mute)}
.avatar{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center;background:#fbf2e7;border-radius:14px;padding:10px;margin:6px 0 10px}
.avatar canvas{width:120px;height:120px;border-radius:50%;border:3px solid var(--line);display:block}
.avr b{font-size:14px}.avr .btn{margin-top:8px;background:var(--pink);color:#fff}
.sw{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.sw button{width:26px;height:26px;border-radius:50%;border:2px solid rgba(0,0,0,.15);padding:0;cursor:pointer}.sw button[aria-pressed=true]{border:3px solid var(--line);transform:scale(1.1)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.toast{text-align:center;font-weight:800;color:#2e9b5a;min-height:20px;margin:8px 0 0;font-size:14px}
#dex{text-align:center;color:var(--mute);font-size:12px;font-weight:700;margin-top:14px}
.ov{position:fixed;inset:0;z-index:20;background:rgba(42,31,26,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px}
.ov[hidden]{display:none}
.ov img{max-width:100%;max-height:74vh;border-radius:12px}
.ov p{color:#fff;margin:0;font-weight:800}
.flash{position:fixed;inset:0;pointer-events:none;z-index:15;opacity:0}
.flash.go{animation:fl 1s ease-out}
@keyframes fl{0%{opacity:.95}100%{opacity:0}}
.shake{animation:sh .12s linear infinite}
@keyframes sh{0%{transform:translate(1px,0) rotate(.5deg)}50%{transform:translate(-1px,1px) rotate(-.5deg)}100%{transform:translate(1px,-1px) rotate(.3deg)}}
.pop{animation:pp .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pp{from{transform:scale(.6)}}
.heart{position:fixed;z-index:16;pointer-events:none;font-size:28px;animation:hu 1.4s ease-out forwards}
@keyframes hu{to{transform:translateY(-140px) scale(1.4);opacity:0}}

<main>
  <header><div><h1>吉娃娃<em>配種所</em></h1><p class="lead">抽一公一母，生一隻你專屬的吉娃娃頭貼。</p></div><button id="mute" aria-label="聲音開關">🔊</button></header>

      <p class="bname" id="bn"></p><p class="bsub" id="bs"></p>

      <div class="like" id="like"></div><div class="likel"><span id="lD"></span><span id="lX"></span><span id="lM"></span></div>

      <p class="toast" id="toast"></p>
    </div>
  </section>
  <p id="dex"></p>
</main>
<div class="flash" id="flash"></div>
<div class="ov" id="ov" hidden><img id="ovimg" alt="吉娃娃寶寶證"><p>長按圖片可直接存到相簿</p><div style="display:flex;gap:10px"><a class="btn" id="ovdl" download="chihuahua.png" style="width:auto;padding:10px 22px;text-decoration:none;text-align:center">⬇️ 下載圖片</a><button class="btn ghost" id="ovx" style="width:auto;padding:10px 26px">關閉</button></div></div>

<script>
'use strict';
const $=id=>document.getElementById(id);
/* ---------- audio ---------- */
let ac=null,master=null,muted=false;
try{muted=localStorage.getItem('ch_mute')==='1'}catch(e){}
$('mute').textContent=muted?'🔇':'🔊';
function silentWav(){const n=800,b=new ArrayBuffer(44+n),v=new DataView(b),w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};w(0,'RIFF');v.setUint32(4,36+n,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,8000,true);v.setUint32(28,8000,true);v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,'data');v.setUint32(40,n,true);for(let i=0;i<n;i++)v.setUint8(44+i,128);return URL.createObjectURL(new Blob([b],{type:'audio/wav'}))}
function initAudio(){if(ac){if(ac.state==='suspended')ac.resume();return}
  try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
  try{const a=new Audio(silentWav());a.loop=true;a.play().catch(()=>{})}catch(e){}
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;ac=new C();master=ac.createGain();master.gain.value=muted?0:.9;master.connect(ac.destination)}
function osc(type,f,t,d,p,f2){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(p,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05)}
const T=()=>ac?ac.currentTime:0;
const sfx={tick(){osc('square',900+Math.random()*500,T(),.03,.06)},
  yip(p=1){const t=T();osc('sawtooth',900*p,t,.09,.14,1500*p);osc('sine',1400*p,t+.02,.07,.1,700*p)},
  ding(){const t=T();[880,1175].forEach((f,i)=>osc('triangle',f,t+i*.07,.2,.18))},
  fan(r){const t=T(),n=[[523,659],[523,659,784],[523,659,784,1046],[523,659,784,1046,1318],[523,659,784,1046,1318,1568]][r];n.forEach((f,i)=>osc('triangle',f,t+i*.08,.35,.2))},
  heart(){const t=T();osc('sine',660,t,.15,.15,990)},
  squeak(){const t=T();osc('sine',1800,t,.12,.18,2600);osc('sine',2200,t+.14,.1,.14,1600)}};

/* ---------- genes ---------- */
// [label, weight, rarity points]
const G={
  coat:[['奶油色',10,0],['黑棕色',8,0],['巧克力',8,0],['雪白',7,0],['虎斑',5,1],['灰藍',4,1],['乳牛斑',4,1],['粉紅',1,3],['彩虹',.35,6]],
  head:[['蘋果頭',14,0],['鹿頭',4,0],['方頭',2,1],['倒三角頭',2,1],['巨頭',3,2],['迷你頭',2,2]],
  ears:[['雷達大耳',12,0],['小耳朵',3,0],['一隻垂耳',5,1],['蝙蝠耳',3,1],['兔子耳',2,2],['天線',.7,4]],
  eyes:[['水汪汪凸眼',10,0],['超級凸眼',3,2],['豆豆眼',6,0],['鬥雞眼',4,1],['大小眼',4,1],['三白眼',3,1],['星星眼',1,3],['獨眼',.5,5]],
  mouth:[['吐舌',9,0],['嘟嘴',7,0],['貓咪嘴',6,0],['地包天暴牙',3,1],['咬牙切齒',1.5,1],['大叫中',1.5,1],['八字鬍',1,3]],
  body:[['標準',8,0],['歪頭',6,0],['雙下巴',3,1],['鼓鼓臉',3,1]],
  expr:[['茫然',10,0],['瞇眼笑',6,0],['睥睨',4,1],['厭世',3,1],['驚嚇',3,1],['想睡',3,1],['翻白眼',.8,2]],
  extra:[['無',18,0],['腮紅',8,0],['蝴蝶結',5,1],['小花',4,1],['呆毛',4,1],['生日帽',2,2],['墨鏡',1.5,3],['超粗眉',1.5,1],['空錢包',1.2,3],['皇冠胎記',.6,4],['第三隻眼',.4,5]]
};
const KEYS=['coat','head','ears','eyes','expr','mouth','body','extra'];
const KNAME={coat:'毛色',head:'頭型',ears:'耳朵',eyes:'眼睛',expr:'表情',mouth:'嘴巴',body:'姿勢',extra:'特徵'};
const COAT={'奶油色':['#efc78f','#fff1d9'],'黑棕色':['#2e2420','#d2934f'],'巧克力':['#7a4a2a','#c99a72'],'雪白':['#f7f3ec','#ffffff'],'虎斑':['#a9733f','#f0d2a8'],'灰藍':['#8996a6','#d3dae2'],'乳牛斑':['#fbfaf6','#ffffff'],'粉紅':['#ff9ec7','#ffe1ee'],'彩虹':['#ff9ec7','#fff']};
function pick(list,boost=1){const tot=list.reduce((a,x,i)=>a+(i?x[1]*1:x[1])*(x[2]>=3?boost:1),0);let r=Math.random()*tot;for(const x of list){r-=x[1]*(x[2]>=3?boost:1);if(r<=0)return x[0]}return list[0][0]}
const ptsOf=(k,v)=>G[k].find(x=>x[0]===v)[2];
function randDog(){const g={};for(const k of KEYS)g[k]=pick(G[k]);
  g.hs=.9+Math.random()*.2;g.es=.85+Math.random()*.3;g.ear=.85+Math.random()*.3;g.leg=.85+Math.random()*.3;g.hue=Math.random()*360;g.turn=(Math.random()-.5)*.6;g.seed=Math.random()*1e9|0;return g}
function rarity(g){let p=0;for(const k of KEYS)p+=ptsOf(k,g[k]);return p>=10?'UR':p>=7?'SSR':p>=4?'SR':p>=2?'R':'N'}
const RIDX={N:0,R:1,SR:2,SSR:3,UR:4};
const DADN=['阿福','老大','Lucky','黑皮','大雄','Money','阿宅','皮皮','肉鬆','可樂','麥克','旺來'];
const MOMN=['公主','小花','Coco','咪咪','露露','妞妞','Bella','珍珠','奶茶','香香','Lily','甜甜'];
const BABY=['麻糬','皮蛋','滷蛋','豆花','黑輪','珍奶','肉圓','芋圓','鹹酥雞','臭豆腐','雞排','車輪餅','米糕','貢丸','蚵仔煎','鳳梨酥','地瓜球','肉粽','布丁','蔥抓餅'];
const NICK={'彩虹':'彩虹','粉紅':'粉紅','獨眼':'獨眼','星星眼':'星星','天線':'外星','第三隻眼':'開天眼','皇冠胎記':'皇室','八字鬍':'紳士','鬥雞眼':'鬥雞','地包天暴牙':'暴牙','蝙蝠耳':'蝙蝠','巨頭':'大頭','迷你頭':'小頭','兔子耳':'兔兔','三白眼':'兇','超級凸眼':'金魚','蝴蝶結':'公主','小花':'花花','生日帽':'壽星','墨鏡':'墨鏡','貓咪嘴':'貓貓','睥睨':'不屑','厭世':'厭世','驚嚇':'吉碎','想睡':'愛睏','瞇眼笑':'奸笑','翻白眼':'白眼','大叫中':'吵鬧','雙下巴':'肥肥','鼓鼓臉':'河豚','歪頭':'疑惑','大小眼':'大小眼','咬牙切齒':'森七七','空錢包':'窮'};

/* ---------- drawing ---------- */
function rng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s^=s>>>17;s^=s<<5;return((s>>>0)%10000)/10000}}
function hex2rgb(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function shade(h,k){const c=hex2rgb(h).map(v=>k<0?v*(1+k):v+(255-v)*k);return`rgb(${c.map(v=>Math.round(Math.max(0,Math.min(255,v)))).join(',')})`}

const SCENES={beach:'🏖️',cafe:'☕',garden:'🌷',night:'🌃'};
function bokeh(x,S,R,cols,n,rmin,rmax,ymin,ymax){for(let i=0;i<n;i++){const r=S*(rmin+R()*(rmax-rmin)),cx=R()*S,cy=S*(ymin+R()*(ymax-ymin)),c=cols[i%cols.length],g=x.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,c);g.addColorStop(.7,c.replace(/[\d.]+\)$/,m=>(parseFloat(m)*.6)+')'));g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.beginPath();x.arc(cx,cy,r,0,7);x.fill()}}
function drawScene(x,S,k){const R=rng(k.length*977+13);
  if(k==='beach'){let g=x.createLinearGradient(0,0,0,S*.5);g.addColorStop(0,'#4fa9e8');g.addColorStop(1,'#bfe6ff');x.fillStyle=g;x.fillRect(0,0,S,S*.5);
    g=x.createLinearGradient(0,S*.46,0,S*.6);g.addColorStop(0,'#2fc6d1');g.addColorStop(1,'#7fe3e0');x.fillStyle=g;x.fillRect(0,S*.46,S,S*.14);
    g=x.createLinearGradient(0,S*.58,0,S);g.addColorStop(0,'#f6e7cc');g.addColorStop(1,'#e2c9a0');x.fillStyle=g;x.fillRect(0,S*.58,S,S*.42);
    x.fillStyle='rgba(255,255,255,.75)';for(let i=0;i<3;i++){const cx=S*(.08+i*.34+(i===1?.5:0))%S;x.globalAlpha=.55;x.beginPath();x.roundRect(cx-S*.09,S*.3,S*.18,S*.26,S*.02);x.fill();x.fillStyle='rgba(255,250,240,.9)';x.beginPath();x.moveTo(cx-S*.13,S*.31);x.lineTo(cx,S*.24);x.lineTo(cx+S*.13,S*.31);x.closePath();x.fill();x.fillStyle='rgba(255,255,255,.75)'}x.globalAlpha=1;

const BGS=['beach','cafe','garden','night','#ffd6e0','#cfe8ff','#fff1b8','#e6dcff'];
let avBg=BGS[0];try{const v=localStorage.getItem('ch_bg');if(BGS.includes(v))avBg=v}catch(e){}
$('sw').innerHTML=BGS.map(c=>SCENES[c]?`<button style="background:#fff;font-size:14px" data-c="${c}" aria-label="背景" aria-pressed="${c===avBg}">${SCENES[c]}</button>`:`<button style="background:${c}" data-c="${c}" aria-label="背景色" aria-pressed="${c===avBg}"></button>`).join('');
$('sw').onclick=e=>{const b=e.target.closest('button');if(!b)return;avBg=b.dataset.c;try{localStorage.setItem('ch_bg',avBg)}catch(_){}$('sw').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));sfx.tick()};
function avatarCanvas(){const c=document.createElement('canvas');c.width=c.height=1080;drawDog(c,baby,1,{still:true,bg:avBg,fit:1});return c}
let dlURL=null;
async function shareCanvas(c,name){c.toBlob(async b=>{if(!b)return;const f=new File([b],name,{type:'image/png'});
  const touch=matchMedia('(pointer:coarse)').matches;
  if(touch&&navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]});$('toast').textContent='已開啟分享，選「儲存影像」就存到相簿';return}catch(e){if(e&&e.name==='AbortError')return}}
  if(dlURL)URL.revokeObjectURL(dlURL);dlURL=URL.createObjectURL(b);const a=$('ovdl');a.href=dlURL;a.download=name;
  if(!touch){a.click();$('toast').textContent='圖片已下載';return}
  $('ovimg').src=dlURL;$('ov').hidden=false},'image/png')}
$('saveA').onclick=()=>{if(baby)shareCanvas(avatarCanvas(),'chihuahua-avatar.png')};
$('ovx').onclick=()=>$('ov').hidden=true;
$('copy').onclick=()=>{const t=shareText(),ok=()=>$('toast').textContent='複製好了，去炫耀吧';
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(ok,fb);else fb();
  function fb(){const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,t.length);try{document.execCommand('copy');ok()}catch(e){$('toast').textContent='長按自己複製吧'}ta.remove()}};
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊';try{localStorage.setItem('ch_mute',muted?'1':'0')}catch(e){}if(master)master.gain.setTargetAtTime(muted?0:.9,ac.currentTime,.02)};

/* ---------- loop ---------- */
const CACHE=new Map();
function cached(g,S,opts){const key=g?[g.seed,g.coat,g.head,g.ears,g.eyes,g.expr,g.mouth,g.body,g.extra,S,opts.bg,opts.fit||0].join('|'):'none|'+S+opts.bg;let c=CACHE.get(key);
  if(!c){c=document.createElement('canvas');c.width=c.height=S;drawDog(c,g,0,Object.assign({},opts,{still:true}));CACHE.set(key,c);if(CACHE.size>40)CACHE.delete(CACHE.keys().next().value)}return c}
function paint(cv,g,t,opts){const S=cv.width,img=cached(g,S,opts),x=cv.getContext('2d'),sh=g?Math.sin(t*38+(g.seed||0))*S*.004:0;x.setTransform(1,0,0,1,0,0);x.drawImage(img,-S*.01+sh,-S*.01,S*1.02,S*1.02)}
function loop(ts){const t=ts/1000;paint($('cD'),dad,t,{bg:'#d6e6ff'});paint($('cM'),mom,t+1.3,{bg:'#ffdbe8'});paint($('cB'),baby,t+2.1,{bg:avBg});if(baby)paint($('cA'),baby,t+2.1,{bg:avBg,fit:1});requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
</body>
