<style>
/* Layout: one narrow column, three scenes (intake → séance chat with sticky upload bar → bill). Single committed look: midnight violet séance, holographic gold, drifting aurora + starfield. */
:root{
  --bg:#130a24; --bg2:#21103d; --ink:#f4eafc; --mute:#b9a6d6; --line:#ffffff22;
  --gold:#f0c869; --gold2:#ffe3a1; --rose:#ff8fd0; --cyan:#8ff0ff; --violet:#9b6bff;
  --glass:#ffffff12; --glass2:#ffffff1c; --me1:#b44bd6; --me2:#6a4bff;
  --holo:linear-gradient(100deg,#ffe3a1 0%,#ff9ad5 30%,#b99bff 55%,#8ff0ff 80%,#ffe3a1 100%);
  --serif:"Noto Serif TC","Songti TC",serif; --sans:"Noto Sans TC","PingFang TC",system-ui,sans-serif; --script:"Cormorant Garamond",Georgia,serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;overflow-x:hidden}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.aura{position:fixed;inset:-20%;z-index:0;pointer-events:none;filter:blur(60px);opacity:.75;
  background:radial-gradient(closest-side at 25% 30%,#7b2fbf 0,transparent 70%),radial-gradient(closest-side at 80% 20%,#1f6fbf88 0,transparent 70%),radial-gradient(closest-side at 70% 80%,#c2368f99 0,transparent 70%),radial-gradient(closest-side at 15% 85%,#2b8f9a66 0,transparent 70%);
  animation:drift 22s ease-in-out infinite alternate}
@keyframes drift{0%{transform:rotate(0) scale(1);filter:blur(60px) hue-rotate(0)}100%{transform:rotate(25deg) scale(1.15);filter:blur(70px) hue-rotate(50deg)}}
.wrap{position:relative;z-index:1;max-width:460px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--gold);outline-offset:2px}

/* teacher avatar */
.av{width:52px;height:52px;border-radius:50%;flex:none;background:var(--avimg,#5b2f57) center/cover;
  box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--gold),0 0 18px 4px #b99bff88}
.av.sm{width:36px;height:36px;box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--gold),0 0 10px 2px #b99bff66}

/* intake */
.brand{display:flex;align-items:center;gap:14px}
.brand b{font-family:var(--serif);font-size:18px;display:block;line-height:1.2}
.brand small{color:var(--mute);font-size:12px}
.hero{position:relative;padding-block:30px 22px}
.wheel{position:absolute;right:-90px;top:-10px;width:300px;height:300px;opacity:.5;pointer-events:none;animation:spin 90s linear infinite;max-width:none}
@keyframes spin{to{transform:rotate(360deg)}}
.eyebrow{font-family:var(--script);font-style:italic;color:var(--gold);font-size:21px;letter-spacing:.04em;position:relative}
h1{position:relative;font-family:var(--serif);font-weight:900;font-size:clamp(32px,9.5vw,42px);line-height:1.2;margin:4px 0 12px;text-wrap:balance;
  background:var(--holo);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:holo 8s linear infinite;filter:drop-shadow(0 0 14px #ff9ad566)}
@keyframes holo{to{background-position:200% 0}}
.hero p{position:relative;color:var(--mute);margin:0}
.stats{position:relative;display:flex;gap:20px;margin-top:16px;font-size:12px;color:var(--mute)}
.stats b{display:block;font-family:var(--serif);font-size:19px;color:var(--gold2);font-variant-numeric:tabular-nums}

.card{position:relative;background:linear-gradient(160deg,#ffffff16,#ffffff08);border:1px solid var(--line);border-radius:22px;padding:18px;display:grid;gap:16px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 20px 50px -20px #000a,inset 0 1px 0 #ffffff22}
.fld{display:grid;gap:8px}
.fld>span{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--gold2)}
input[type=text]{width:100%;box-sizing:border-box;border:1px solid var(--line);background:#0000002e;border-radius:12px;padding:11px 12px;font:inherit;color:var(--ink)}
input::placeholder{color:#b9a6d688}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--glass);border-radius:999px;padding:7px 13px;font-size:14px}
.chip[aria-pressed=true]{background:var(--holo);border-color:transparent;color:#2a1240;font-weight:700;box-shadow:0 0 14px #ff9ad566}
.drop{position:relative;border:1.5px dashed #f0c86999;border-radius:16px;padding:20px;text-align:center;display:grid;gap:4px;background:#f0c8690d;cursor:pointer}
.drop b{font-family:var(--serif);font-size:16px;color:var(--gold2)}
.drop small{color:var(--mute);font-size:12px}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.drop.has{border-style:solid}
.go{position:relative;overflow:hidden;background:linear-gradient(100deg,var(--me1),var(--me2));color:#fff;border:0;border-radius:16px;padding:15px;font-family:var(--serif);font-weight:700;font-size:17px;letter-spacing:.12em;box-shadow:0 0 0 1px #ffe3a166,0 10px 30px -8px #b44bd6aa}
.go::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,#ffffff55 50%,transparent 70%);transform:translateX(-100%);animation:sheen 3.2s ease-in-out infinite}
@keyframes sheen{60%,100%{transform:translateX(100%)}}
.go:disabled{opacity:.4;cursor:not-allowed}.go:disabled::after{display:none}
.link{background:none;border:0;color:var(--mute);text-decoration:underline;font-size:13px;padding:0}
.fine{position:relative;font-size:12px;color:var(--mute);text-align:center;margin-top:14px}

/* session */
.up{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#1b0f33e6;border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;gap:12px;align-items:center;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 30px -12px #000c}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.thumb{width:54px;height:54px;border-radius:12px;overflow:hidden;flex:none;background:#ffffff14;display:grid;place-items:center;font-size:24px}
.thumb video,.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.upi{flex:1;min-width:0}
.upi .row{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.upi .fn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.pct{font-variant-numeric:tabular-nums;font-weight:700;color:var(--gold2)}
.bar{height:6px;border-radius:9px;background:#ffffff1a;margin:7px 0 5px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--holo);background-size:200% 100%;animation:holo 3s linear infinite;border-radius:9px;transition:width .4s;box-shadow:0 0 10px #ff9ad5}
.st{font-size:11.5px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st.warn{color:#ff9a8a}

.chat{display:grid;gap:12px;padding-block:18px 8px}
.msg{display:flex;gap:8px;align-items:flex-end;animation:in .45s ease both}
.msg .b{background:linear-gradient(160deg,#ffffff1c,#ffffff0c);border:1px solid #ffffff26;padding:10px 13px;border-radius:18px 18px 18px 4px;max-width:78%;min-width:0;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 0 22px -8px #b99bff88}
.msg.me{justify-content:flex-end}
.msg.me .b{background:linear-gradient(120deg,var(--me1),var(--me2));border-color:transparent;color:#fff;border-radius:18px 18px 4px 18px;box-shadow:0 8px 24px -10px #b44bd6}
.msg.sys{justify-content:center}
.msg.sys .b{background:none;border:0;box-shadow:none;color:var(--mute);font-size:12px;padding:0;text-align:center;max-width:none}
.msg .b em{font-style:normal;font-weight:700;background:var(--holo);-webkit-background-clip:text;background-clip:text;color:transparent}
.msg .tm{font-size:10px;color:var(--mute);flex:none}
.typing .b{display:flex;gap:4px;padding:13px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--gold2);animation:dot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{opacity:.25;transform:none}30%{opacity:1;transform:translateY(-3px)}}
@keyframes in{from{opacity:0;transform:translateY(8px);filter:blur(4px)}}

/* bill */
.bill{margin-top:8px;background:linear-gradient(160deg,#ffffff18,#ffffff08);border:1px solid #f0c86955;border-radius:22px;padding:20px;display:grid;gap:14px;animation:in .6s ease both;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.bill h2{font-family:var(--serif);font-size:20px;margin:0;display:flex;justify-content:space-between;align-items:baseline;color:var(--gold2)}
.bill h2 small{font-family:var(--sans);font-size:11px;color:var(--mute);font-weight:400}
.lines{display:grid;gap:7px;font-size:14px}
.lines div{display:flex;justify-content:space-between;gap:10px}
.lines div span:last-child{font-variant-numeric:tabular-nums}
.lines .z{color:#ff9a8a;font-weight:700}
.tot{border-top:1px dashed #ffffff33;padding-top:10px;display:flex;justify-content:space-between;font-family:var(--serif);font-weight:900;font-size:22px}
.tot span:last-child{background:var(--holo);-webkit-background-clip:text;background-clip:text;color:transparent}
.reveal{background:#00000055;border:1px solid #ffffff1f;border-radius:12px;padding:12px 14px;font-size:13.5px}
.reveal b{color:var(--gold2)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts button{border-radius:14px;padding:13px;border:1px solid #ffffff44;background:var(--glass);font-weight:700}
.acts .p{background:linear-gradient(100deg,var(--me1),var(--me2));border-color:transparent;color:#fff}
.disc{font-size:12px;color:var(--mute);text-align:center}

/* sound toggle */
.snd{position:fixed;z-index:15;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:42px;height:42px;border-radius:50%;border:1px solid #ffffff33;background:#1b0f33cc;font-size:18px;display:grid;place-items:center;box-shadow:0 0 16px #b99bff55}
.snd.off{opacity:.6}
/* share overlay */
.ov{position:fixed;inset:0;z-index:20;background:#0b0516ee;display:grid;place-items:center;padding:max(20px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ov[hidden]{display:none}
.ovb{display:grid;gap:10px;justify-items:center;max-width:380px;width:100%}
.ovb img{width:100%;border-radius:12px;box-shadow:0 20px 50px #000a}
.ovb p{color:var(--ink);font-size:13px;margin:0;text-align:center}
.ovb .row{display:flex;gap:10px}
.ovb a,.ovb button{color:var(--ink);border:1px solid #ffffff55;background:none;border-radius:10px;padding:9px 16px;text-decoration:none;font-size:14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>


<div class="aura"></div><canvas id="sky"></canvas>
<div class="wrap">
  <section id="intake">
    <div class="brand"><div class="av"></div><div><b>Mona 姐</b><small>動物心靈溝通師・遠距感應・塔羅</small></div></div>
    <div class="hero">
      <canvas class="wheel" id="wheel" width="600" height="600"></canvas>
      <div class="eyebrow">✦ Animal Communication ✦</div>
      <h1>牠想說的，<br>我都聽得到</h1>
      <p>上傳毛孩的問題影片，老師幫你遠距感應牠的心聲。</p>
      <div class="stats"><div><b>12,847</b>隻毛孩</div><div><b>4.98</b>★ 好評</div><div><b>0 秒</b>平均看片時間</div></div>
    </div>
    <form class="card" id="f">
      <label class="fld"><span>毛孩的名字</span><input type="text" id="nm" maxlength="8" placeholder="例如：可樂" autocomplete="off"></label>
      <div class="fld"><span>牠是</span><div class="chips" id="sp"></div></div>
      <div class="fld"><span>最近的困擾</span><div class="chips" id="pb"></div></div>
      <label class="drop" id="drop">
        <input type="file" id="file" accept="video/*,image/*">
        <b id="dropT">＋ 上傳問題影片</b>
        <small id="dropS">影片或照片都可以，30 秒內最好</small>
      </label>
      <button class="go" id="go" type="submit" disabled>開始溝通</button>
      <div style="text-align:center"><button class="link" type="button" id="demo">沒有影片？先用示範影片試試</button></div>
    </form>
    <p class="fine">影片不會真的上傳，全程只在你的手機裡。</p>
  </section>

  <section id="sess" hidden>
    <div class="up">
      <div class="thumb" id="th">🐾</div>
      <div class="upi">
        <div class="row"><span class="fn" id="fn">video.mov</span><span class="pct" id="pct">0%</span></div>
        <div class="bar"><i id="barI"></i></div>
        <div class="st" id="st">準備上傳…</div>
      </div>
    </div>
    <div class="chat" id="chat"></div>
    <div id="billBox"></div>
  </section>
</div>

<button type="button" class="snd" id="snd" aria-label="聲音開關">🔊</button>
<div class="ov" id="ov" hidden>
  <div class="ovb">
    <img id="ovImg" alt="毛孩心聲鑑定書">
    <p>長按圖片儲存，或用下面的按鈕下載</p>
    <div class="row"><a id="ovDl" download="毛孩心聲鑑定書.png" href="#">下載圖片</a><button type="button" id="ovX">關閉</button></div>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const SP=[["狗","狗"],["貓","貓"],["兔子","兔子"],["其他","毛孩"]];
const PB=["亂尿尿","拆家咬東西","半夜一直叫","不吃飯","一直舔腳","對我愛理不理","追自己尾巴","其他"];
let st={name:"",sp:0,pb:0,file:null,url:null,kind:null,demo:false};

const D={
 open:["收到！影片還在上傳，但不用等，{n}已經先跟我連上了。","等一下…上傳才到一點點，{n}就一直在我耳邊講話。","我先說，影片我其實不太需要看，我是用感應的。","{n}的能量好強，強到你的網路都卡住了 🙏"],
 nick:["寶貝大人","總經理","小公主","大哥","阿嬤","少爺","董事長","老佛爺","主任"],
 past:["清朝的御前侍衛，所以很會顧門","一間早餐店的老闆娘，所以每天六點就叫你起床","一個很會記仇的會計師","埃及法老身邊的祭司","你前世的債主，這輩子來收利息","一位沒出道的偶像練習生","鄉公所的承辦人員，所以凡事要照牠的流程","你家樓下那棵三百年的榕樹","台積電的夜班工程師，所以半夜特別有精神","在市場賣襪子的阿伯，所以對腳特別有興趣"],
 why:{
  "亂尿尿":["牠亂尿尿不是沒教好，是在幫你家「定磁場」。牠尿的那個角落，剛好是你家的財位。","牠說尿布墊正對大門，煞氣太重，牠尿在那裡沒有安全感。","那是牠在寫字。我看了一下，寫的是「不要再出門了」。"],
  "拆家咬東西":["牠咬的那雙鞋，是你上次穿去見一個牠不喜歡的人。","牠不是在拆家，是在幫你斷捨離。牠覺得你東西太多了。","牠說沙發的氣卡住了，咬開是在幫它通氣。"],
  "半夜一直叫":["牠半夜叫是在跟你阿公講話。阿公說冰箱那盒東西快過期了。","牠在幫你擋東西。你最近晚上是不是比較常做夢？","牠在跟樓上的貓吵架，牠說是對方先開始的。"],
  "不吃飯":["牠不是不吃，是在等你換那包比較貴的。牠說牠看過你的購物車。","牠說碗的顏色跟牠的能量不合，牠比較適合大地色系。","牠在減肥。上次量體重的時候，牠覺得護理師有偷笑。"],
  "一直舔腳":["牠舔腳是在幫你消化情緒。你最近是不是想離職？","牠說腳底有個穴位，舔了會想起前世。","牠在練習。牠想學你滑手機的樣子。"],
  "對我愛理不理":["牠不是不理你，是在給你空間。牠覺得你最近需要獨處。","牠在生氣。上次你摸了別人家的{s}，牠有聞到。","牠說你叫牠的聲音太公事公辦，像在叫號。"],
  "追自己尾巴":["牠追的不是尾巴，是前世沒完成的願望。","牠說尾巴最近怪怪的，好像不是自己的。","這是牠的晨間儀式，就跟你做瑜伽一樣。"],
  "其他":["這個問題的根源在你，不在牠。","牠說這件事牠解釋過很多次了，是你一直沒聽懂。","牠說牠不想講，牠覺得你心裡知道。"]
 },
 love:["你回家第一件事是看手機，不是看牠","你洗澡太久，牠每次都以為你不回來了","你在外面對別的{s}比較熱情","你唱歌真的不太好聽","你上次說「最後一塊」，結果沒有給牠","你拍牠的照片都沒有修圖","你最近笑得比較少"],
 say:["我其實都聽得懂，只是不想回。","那個藍色的玩具不是我弄壞的。","你不用一直說我很乖，我知道。","下次要去看醫生，可以先跟我講嗎。","你那個朋友，我不喜歡。","罐頭可以一次開兩罐，我吃得完。","不要再叫我「小可愛」了，我有名字。"],
